/* ===== AGENTE CENTINELA: asesor del día para Dirección/RRHH (100% reglas locales) ===== */
var CEN_SEV={ crit:['Crítico','var(--bad)'], alta:['Alto','var(--warn)'], media:['Medio','var(--data)'] };
/* Sugerencias constructivas para días sin pendientes (la tarjeta nunca queda vacía) */
var CEN_SUG=[
  {sev:'media', icon:'', titulo:'Reconoce al equipo', detalle:'Todo va al corriente. Un aviso de felicitación en Noticias motiva mucho y no cuesta nada.', accion:{label:'Ver noticias', js:'renderNews()'}},
  {sev:'media', icon:'', titulo:'Lanza una encuesta corta', detalle:'Pregunta al personal cómo se siente esta semana. Toma un minuto y da mucha información.', accion:{label:'Ir a Operación', js:'mgrTab(\'op\')'}},
  {sev:'media', icon:'', titulo:'Revisa el avance por área', detalle:'Aprovecha el día tranquilo para ver qué área podría necesitar apoyo pronto.', accion:{label:'Ver áreas', js:'mgrTab(\'area\')'}}
];
function centinelaRun(){
  var items=[], now=Date.now();
  // R1 · Sabotaje pendiente → CRÍTICO
  try{ var A=(qstats().alerts||[]);
    if(A.length){ items.push({sev:'crit', icon:IC2.shield, titulo:'Alerta de sabotaje sin atender', detalle:A.length+' pregunta(s) con intención de dañar la planta. Revísalas arriba y márcalas como vistas.', accion:{label:'Ver alertas', js:'window.scrollTo(0,0)'}}); }
  }catch(e){}
  // R2 · Preguntas del Asistente sin responder
  try{ var U=Object.keys(qstats().unans||{}).length;
    if(U>0){ items.push({sev:(U>=5?'alta':'media'), icon:IC2.cap, titulo:'Preguntas del Asistente sin respuesta', detalle:U+' pregunta(s) esperan una respuesta autorizada. Revísalas y márcalas como atendidas.', accion:{label:'Revisar preguntas', js:'mgrTab(\'op\')'}}); }
  }catch(e){}
  // R3 · Área con avance bajo (<50%)
  try{ ((CFG.hr||{}).byArea||[]).forEach(function(a){
    if(a[1]<50){ items.push({sev:'alta', icon:IC2.gear, titulo:'Avance bajo en '+a[0], detalle:'El área va en '+a[1]+'% de sus cursos. Habla con su responsable para ponerse al corriente.', accion:{label:'Ver áreas', js:'mgrTab(\'area\')'}}); }
  }); }catch(e){}
  // R4 · Tema muy fallado (>35%)
  try{ ((CFG.hr||{}).failed||[]).forEach(function(x){
    if(x[1]>35){ items.push({sev:'media', icon:IC2.check, titulo:'Muchos fallos en: '+x[0], detalle:x[1]+'% de fallo en los quizzes. Puede faltar capacitación… o haber un problema en el proceso.', accion:{label:'Ver temas', js:'mgrTab(\'area\')'}}); }
  }); }catch(e){}
  // R5 · Reportes del buzón pendientes
  try{ var R=reportsGet().filter(function(r){return r.status==='pendiente';}).length;
    if(R>0){ items.push({sev:(R>=5?'alta':'media'), icon:IC2.doc, titulo:'Reportes del buzón sin revisar', detalle:R+' queja(s) o reporte(s) esperan tu revisión. Los válidos dan puntos al trabajador.', accion:{label:'Revisar buzón', js:'mgrTab(\'op\')'}}); }
  }catch(e){}
  // R6 · Vacaciones sin revisar más de 3 días
  try{ var V=leaveGet().filter(function(r){return r.status==='pendiente' && (now-r.ts)>3*86400000;}).length;
    if(V>0){ items.push({sev:'media', icon:IC2.people, titulo:'Solicitudes de permiso detenidas', detalle:V+' solicitud(es) llevan más de 3 días sin respuesta. El trabajador está esperando.', accion:{label:'Revisar solicitudes', js:'mgrTab(\'ppl\')'}}); }
  }catch(e){}
  // R7 · Noticia con poca lectura (solo la más reciente que cumpla)
  try{ var nb=null;
    newsGet().forEach(function(n){
      var dest=(n.to&&n.to.mode==='range')?(Math.abs((+n.to.max)-(+n.to.min))+1):(((CFG.hr||{}).employees)||600);
      if((now-n.ts)>2*86400000 && ((n.reads||[]).length/(dest||1))<0.30){ if(!nb||n.ts>nb.ts) nb=n; }
    });
    if(nb){ items.push({sev:'media', icon:IC2.doc, titulo:'Aviso con poca lectura', detalle:'“'+(nb.t||(nb.b||'').slice(0,40))+'” — solo '+(nb.reads||[]).length+' persona(s) han confirmado lectura. Considera reenviarlo o avisar en piso.', accion:{label:'Ver noticias', js:'renderNews()'}}); }
  }catch(e){}
  // R8 · Nadie ha firmado su recibo del periodo
  try{ var pk=payPeriod(), F=recibosGet().filter(function(r){return r.key===pk.key;}).length;
    if(F===0){ items.push({sev:'media', icon:IC2.lock, titulo:'Nadie ha firmado su recibo', detalle:'Ningún trabajador ha firmado el recibo del periodo '+pk.label+'. Recuérdales en el pizarrón o por aviso.', accion:{label:'Ver firmados', js:'mgrTab(\'ppl\')'}}); }
  }catch(e){}
  // R9 · NOM-035 abierta
  try{ var st=nomGet();
    if(st.current){ items.push({sev:'media', icon:IC2.people, titulo:'Aplicación NOM-035 en curso', detalle:'Van '+(st.current.n||0)+' respuestas anónimas. Impulsa la participación y ciérrala cuando termine.', accion:{label:'Ver NOM-035', js:'mgrTab(\'op\')'}}); }
  }catch(e){}
  // R10 · Retardos acumulados (1 item con lista)
  try{ var T=HORAS_DEMO.filter(function(w){return w.ret>=2;});
    if(T.length){ items.push({sev:'media', icon:IC2.gear, titulo:'Retardos que se repiten', detalle:T.map(function(w){return '#'+(''+w.emp).padStart(3,'0')+' '+w.area+' ('+w.ret+')';}).join(' · ')+'. Platica con ellos antes de que crezca.', accion:{label:'Ver horarios', js:'mgrTab(\'res\')'}}); }
  }catch(e){}
  // Orden: crítico → alto → medio, estable según el orden de las reglas
  var rank={crit:0,alta:1,media:2};
  items.forEach(function(x,i){ x._i=i; });
  items.sort(function(a,b){ return (rank[a.sev]-rank[b.sev])||(a._i-b._i); });
  return items;
}
function centinelaBlock(){
  var items=[]; try{ items=centinelaRun(); }catch(e){ items=[]; }
  function cenRow(a,tag){
    return '<div class="line" style="align-items:flex-start;gap:10px">'+
      '<span style="width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px;background:'+CEN_SEV[a.sev][1]+';box-shadow:0 0 8px '+CEN_SEV[a.sev][1]+'"></span>'+
      '<span style="flex:1;min-width:0"><b style="font-size:13.5px">'+esc(a.titulo)+'</b> <span class="tg" style="margin-left:4px">'+(tag||CEN_SEV[a.sev][0])+'</span><br><span class="note">'+esc(a.detalle)+'</span></span>'+
      '<button class="back" style="padding:6px 10px;flex:none" onclick="'+a.accion.js+'">'+a.accion.label+'</button></div>';
  }
  var resumen = items.length
    ? ('Tienes '+items.length+' acciones para hoy. '+items.map(function(a,i){return (i+1)+'. '+CEN_SEV[a.sev][0]+': '+a.titulo;}).join('. '))
    : 'Sin pendientes urgentes. La planta va bien hoy. Te dejo unas sugerencias por si quieres aprovechar el día.';
  var h='<div class="panel"><div class="hd" style="align-items:flex-start">'+
    '<div><div class="eyebrow">Centinela</div><b style="font-size:17px">Acciones de hoy</b><p class="note" style="margin:3px 0 0">Lo más importante primero, según los datos de la planta.</p></div>'+
    '<span style="display:flex;gap:8px;align-items:center;flex:none"><span class="chipst'+(items.length?'':' mut')+'">'+items.length+'</span>'+speakBtn(resumen)+'</span></div>';
  if(!items.length){
    h+='<div class="line" style="border:none;padding:6px 0 0"><span style="color:var(--ok);font-weight:700">✓ Sin pendientes urgentes</span></div>'+
       '<p class="note" style="margin-top:3px">La planta va bien hoy. Unas sugerencias por si quieres aprovechar:</p>';
    CEN_SUG.forEach(function(a){ h+=cenRow(a,'Sugerencia'); });
    return h+'</div>';
  }
  items.forEach(function(a){ h+=cenRow(a); });
  return h+'</div>';
}

/* ----- Feed de preguntas: marcar atendidas + reporte semanal para dirección ----- */
var _HRUN=[];   // preguntas sin responder visibles en el tablero (para los botones ✓)
var _HRAL=[];   // alertas de sabotaje visibles en el tablero (para los botones "Visto")
function saveQstats(s){ try{ localStorage.setItem('hb_qstats', JSON.stringify(s)); }catch(e){} }
function alertTime(t){ try{ var d=new Date(t); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function dismissAlert(i){
  var a=_HRAL[i]; if(!a) return;
  if(!confirm('¿Marcar esta alerta como vista (archivar)?\n\nEmpleado #'+(''+a.emp).padStart(3,'0')+'\n«'+a.q+'»\n\nQuedará registrada en el reporte, pero saldrá de la lista de pendientes.')) return;
  var s=qstats(); s.alerts=(s.alerts||[]).filter(function(x){ return !(x.t===a.t && x.emp===a.emp && x.q===a.q); });
  saveQstats(s); flash('Alerta archivada'); renderHR();
}
function markAnswered(i){
  var u=_HRUN[i]; if(!u) return;
  if(!confirm('¿Marcar como atendida?\n\n«'+u.q+'»\n\nDespués agrega la respuesta autorizada a la biblioteca del Asistente (CFG.kb) para que la conteste.')) return;
  var s=qstats(); if(!s.unans[u.key]) return;
  s.res=s.res||{}; s.res[u.key]={q:u.q,n:u.n,t:Date.now()};
  delete s.unans[u.key]; saveQstats(s);
  flash('Atendida. Agrégala a la biblioteca del Asistente cuando esté autorizada.'); renderHR();
}
function reportData(){
  var Q=qstats(), d=new Date();
  return {
    fecha:d.toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'}),
    alerts:(Q.alerts||[]).slice().sort(function(a,b){return b.t-a.t;}),
    freq:Object.keys(Q.freq).map(function(k){return [k,Q.freq[k]];}).sort(function(a,b){return b[1]-a[1];}),
    unans:Object.keys(Q.unans).map(function(k){return Q.unans[k];}).sort(function(a,b){return b.n-a.n;}),
    res:Object.keys(Q.res||{}).map(function(k){return Q.res[k];}).sort(function(a,b){return b.t-a.t;})
  };
}
function printReport(){
  var r=reportData(), el=$('printReport');
  var h='<h1>Hules Banda · Bandamatic — Reporte semanal del Asistente</h1>'+
        '<div class="mut2">'+esc(r.fecha)+' · Generado desde la app de capacitación (demo: datos de este dispositivo)</div>';
  h+='<h2>Alertas de seguridad (posible sabotaje)</h2>'+(r.alerts.length? r.alerts.map(function(a){return '<div class="prl"><span>Empleado #'+(''+a.emp).padStart(3,'0')+(a.area?' · '+esc(a.area):'')+' — «'+esc(a.q)+'»</span><b>'+alertTime(a.t)+'</b></div>';}).join('') : '<div>Sin alertas. </div>');
  h+='<h2>Preguntas más frecuentes (ya autorizadas)</h2>'+(r.freq.length? r.freq.map(function(x){return '<div class="prl"><span>'+esc(x[0])+'</span><b>'+x[1]+'</b></div>';}).join('') : '<div>Sin registros.</div>');
  h+='<h2>Sin responder — para autorizar respuesta</h2>'+(r.unans.length? r.unans.map(function(u){return '<div class="prl"><span>'+esc(u.q)+'</span><b>'+u.n+'×</b></div>';}).join('') : '<div>Sin pendientes.</div>');

function copyReport(){

function legacyCopy(t){

/* ====================== NOTICIAS (RRHH → todo el personal) ======================
   RRHH publica avisos e infografías; los trabajadores los reciben en su área "Noticias".
   Demo: localStorage 'hb_news'. En producción esto vive en el servidor y llega a todos. */
function newsGet(){ if(DBC.news!=null) return DBC.news; try{ return JSON.parse(localStorage.getItem('hb_news')||'[]')||[]; }catch(e){ return []; } }
function newsSave(a){ try{ localStorage.setItem('hb_news', JSON.stringify(a)); }catch(e){ flash('No se pudo guardar (espacio lleno)'); } DBC.news=a; sbSync('news', a); }
function newsTime(ts){ try{ var d=new Date(ts); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return ''; } }
/* segmentación por rango de número de empleado (compartido por Noticias y mensajes directos) */
function inTarget(to,emp){ if(!to||to.mode==='all') return true; if(to.mode==='range'){ var mn=+to.min,mx=+to.max; if(isNaN(mn)||isNaN(mx)) return true; if(mn>mx){ var t=mn; mn=mx; mx=t; } return emp>=mn&&emp<=mx; } return true; }
function targetLabel(to){ if(!to||to.mode==='all') return 'Para todos'; var mn=(''+to.min).padStart(3,'0'),mx=(''+to.max).padStart(3,'0'); return to.min===to.max?('Para ID '+mn):('Para IDs '+mn+'–'+mx); }
function rangePicker(pfx,mode){ var act='background:var(--accent);color:#fff;border-color:var(--accent)';
  return '<div style="display:flex;gap:7px;flex-wrap:wrap"><button id="'+pfx+'ToAll" class="chip2" style="'+(mode==='all'?act:'')+'" onclick="setTo(\''+pfx+'\',\'all\')">Todos</button><button id="'+pfx+'ToRange" class="chip2" style="'+(mode==='range'?act:'')+'" onclick="setTo(\''+pfx+'\',\'range\')">Por rango de IDs</button></div>'+
    '<div id="'+pfx+'Range" style="display:'+(mode==='range'?'flex':'none')+';gap:8px;align-items:center;margin-top:8px"><span class="note">Desde</span><input id="'+pfx+'Min" class="fin" type="number" min="1" placeholder="001" style="width:88px"><span class="note">hasta</span><input id="'+pfx+'Max" class="fin" type="number" min="1" placeholder="050" style="width:88px"></div>';
}
function setTo(pfx,m){ if(pfx==='news') _newsTo=m; else if(pfx==='poll') _pollTo=m; else _dmTo=m; var r=$(pfx+'Range'); if(r) r.style.display=(m==='range'?'flex':'none'); var act='background:var(--accent);color:#fff;border-color:var(--accent)'; var a=$(pfx+'ToAll'),b=$(pfx+'ToRange'); if(a) a.style.cssText=(m==='all'?act:''); if(b) b.style.cssText=(m==='range'?act:''); }
function readTarget(pfx){ var mode=(pfx==='news'?_newsTo:(pfx==='poll'?_pollTo:_dmTo)); if(mode!=='range') return {mode:'all'}; var mn=parseInt(($(pfx+'Min')||{}).value,10), mx=parseInt(($(pfx+'Max')||{}).value,10); if(isNaN(mn)||isNaN(mx)) return null; return {mode:'range',min:mn,max:mx}; }
var _newsTo='all', _dmTo='all', _pollTo='all';
/* pestañas del panel "Publicar" (admin). Alterna con display para NO perder lo tecleado. */
var _pubTab='news';
function pubTab(t){ _pubTab=t;
  ['news','ev','poll'].forEach(function(k){

  });

var _newsImg=null;
function loadNewsImg(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(e){ var img=new Image();
    img.onload=function(){ var max=1000,w=img.width,h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      _newsImg=c.toDataURL('image/jpeg',0.82);
      var pv=$('newsImgPv'); if(pv){ pv.src=_newsImg; pv.style.display='block'; }
      flash('Infografía lista para publicar');
    };
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}
function postNews(){
  var t=(($('newsTitle')||{}).value||'').trim(), b=(($('newsBody')||{}).value||'').trim();

  a.unshift({ id:'n'+Date.now(), t:t, b:b, img:_newsImg||'', to:to, by:'RRHH', ts:Date.now() });
  if(a.length>100) a.length=100;
  newsSave(a); _newsImg=null; flash('Publicada · '+targetLabel(to)); renderNews();

/* ===== Acuse "Enterado": el trabajador confirma que leyó (da puntos bajos 1 sola vez) y RRHH ve quién leyó.
   Demo: el acuse se guarda en la propia noticia (hb_news[].reads). En producción va al servidor. ===== */
function hasRead(n){ var r=n.reads||[]; for(var j=0;j<r.length;j++){ if(r[j].emp===S.emp) return true; } return false; }
function markRead(id){
  var a=newsGet(), n=null; for(var i=0;i<a.length;i++){ if(a[i].id===id){ n=a[i]; break; } }

function reportsSave(a){ try{ localStorage.setItem('hb_reports', JSON.stringify(a)); }catch(e){} DBC.reports=a; sbSync('reports', a); }
/* Mensajes directos de RRHH al personal (un trabajador, un rango o todos) */
function dmGet(){ try{ return JSON.parse(localStorage.getItem('hb_dm')||'[]')||[]; }catch(e){ return []; } }
function dmSave(a){ try{ localStorage.setItem('hb_dm', JSON.stringify(a)); }catch(e){} }
function sendDM(){

function awardPointsTo(emp,pts){

var HBVOICES=[];
function loadVoices(){ try{ if('speechSynthesis' in window){ var v=speechSynthesis.getVoices(); if(v&&v.length) HBVOICES=v; } }catch(e){} }
function pickVoice(lang){
  var vs=HBVOICES.length?HBVOICES:[]; if(!vs.length){ loadVoices(); vs=HBVOICES; }
  if(!vs.length) return null;
  var nrm=function(v){ return (v.lang||'').toLowerCase().replace('_','-'); };
  // calidad: prefiere voces "Enhanced / Premium / Natural" si el dispositivo las tiene descargadas
  var qual=function(v){ var n=(v.name||''), s=0;
    if(/enhanced|mejorad|premium|neural|natural|siri/i.test(n)) s+=2;
    if(/paulina|juan|google|microsoft|sabina|luciana|monica|angelica/i.test(n)) s+=1;
    return s; };
  var best=function(list){ var b=list[0]; for(var x=1;x<list.length;x++) if(qual(list[x])>qual(b)) b=list[x]; return b; };
  if(lang && lang.toLowerCase().indexOf('en')===0){
    var en=vs.filter(function(v){ return /^en-us/.test(nrm(v)); }); if(!en.length) en=vs.filter(function(v){ return /^en/.test(nrm(v)); });
    return en.length?best(en):null;
  }
  var pref=['es-mx','es-419','es-us','es-co','es-es','es'];
  for(var i=0;i<pref.length;i++){ var m=vs.filter(function(v){ return nrm(v).indexOf(pref[i])===0; }); if(m.length) return best(m); }
  return null;
}
try{ if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var clean=String(text||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}]/gu,' ');
    if(!clean) return;
    var u=new SpeechSynthesisUtterance(clean.replace(/\s+/g,' ').trim());
    var v=pickVoice(lang); if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=lang||'es-MX'; }
    u.rate=(window.S&&S.rate)||0.78; u.pitch=1.0; u.volume=1;   // velocidad ajustable desde Educación básica
    setTimeout(function(){ try{ window.speechSynthesis.speak(u); }catch(e){} }, 80);
  }catch(e){}
}

  var cols=[getCss('--accent'),getCss('--accent2'),'#27c267','#ffd76a','#5aa8ff','#fff'];
  for(var i=0;i<26;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.transform='rotate('+(Math.random()*360)+'deg)';

  document.body.appendChild(c);

}

function fmtDate(d){ try{ if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)){ var p=d.split('-'); d=new Date(+p[0],+p[1]-1,+p[2]); } return new Date(d).toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'}); }catch(e){ return ''; } }
function money(n){ try{ return '$'+(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }catch(e){ return '$'+n; } }

/* ===== AGENTE COACH: siguiente mejor acción para el trabajador (100% reglas locales) ===== */
function coachNext(){
  // P1 · NOM-035 abierta y no respondida
  try{ var st=nomGet();
    if(st.current){
      var dn=false; try{ dn=!!localStorage.getItem(nomDoneKey(st.current.id)); }catch(e){}
      if(!dn) return {kind:'nom', titulo:'Responde el cuestionario NOM-035', detalle:'Es anónimo y rápido. Nadie sabrá que fuiste tú, y ayuda a que la planta sea un mejor lugar.', btnLabel:'Responder ahora', onclick:'renderNom()'};
    }
  }catch(e){}
  // P2 · Recibo del periodo sin firmar
  try{ var per=payPeriod();
    if(!signRecord(S.emp,per.key)) return {kind:'recibo', titulo:'Firma tu recibo de nómina', detalle:'Tu recibo de '+per.label+' ya está listo. Fírmalo con el dedo para avisar a RRHH que lo recibiste.', btnLabel:'Ver y firmar', onclick:'renderPay()'};
  }catch(e){}
  // P3 · Curso obligatorio pendiente
  try{ var list=myCourses();
    for(var i=0;i<list.length;i++){ var c=list[i];
      if(c.m && !statusOf(c.id)) return {kind:'curso', titulo:'Te falta un curso obligatorio', detalle:'“'+c.t+'” dura '+(c.dur||'unos minutos')+'. Velo hoy y gana '+CFG.points.watch+' puntos.', btnLabel:'Empezar curso', onclick:'openCourse(\''+c.id+'\')'};
    }
  }catch(e){}
  // P4 · Noticia dirigida a mí sin leer
  try{ var ns=newsGet();
    for(var j=0;j<ns.length;j++){ var n=ns[j];
      if(inTarget(n.to,S.emp) && !hasRead(n)) return {kind:'noticia', titulo:'Hay un aviso nuevo para ti', detalle:'“'+(n.t||(n.b||'').slice(0,50))+'”. Léelo, confirma con “Ya leí esto” y gana '+CFG.points.read+' puntos.', btnLabel:'Leer aviso', onclick:'renderNews()'};
    }
  }catch(e){}
  // P5 · Encuesta dirigida a mí sin responder
  try{ var ps=pollGet();
    for(var k=0;k<ps.length;k++){ var p=ps[k];
      if(inTarget(p.to,S.emp) && (p.votes||{})[S.emp]==null) return {kind:'encuesta', titulo:'Responde una encuesta', detalle:'“'+p.q+'”. Toma menos de un minuto y ganas '+CFG.points.poll+' puntos.', btnLabel:'Responder', onclick:'renderEncuestas()'};
    }
  }catch(e){}
  // P6 · Repaso espaciado (registro propio: hb_repaso_<emp>, ciclos de 14 días)
  try{
    var map={}; try{ map=JSON.parse(localStorage.getItem('hb_repaso_'+S.emp)||'{}')||{}; }catch(e){ map={}; }
    var cand=null, lista=myCourses();
    for(var m=0;m<lista.length;m++){ var cc=lista[m];
      if(!statusOf(cc.id)) continue;                              // solo cursos ya aprobados
      var ts=map[cc.id];
      if(ts && (Date.now()-ts)<=14*86400000) continue;            // repasado hace poco
      if((S.best[cc.id]||0)>=3) continue;                         // quiz perfecto: no urge repasar
      if(!cand || (S.best[cc.id]||0)<(S.best[cand.id]||0)) cand=cc; // el de menor calificación (empate: el primero)
    }
    if(cand) return {kind:'repaso', titulo:'Dale un repaso rápido', detalle:'Ya aprobaste “'+cand.t+'”, pero un repaso de vez en cuando ayuda a no olvidar lo importante. No pierdes nada: fallar no resta.', btnLabel:'Repasar curso', onclick:'coachRepaso(\''+cand.id+'\')'};
  }catch(e){}
  // P7 · Al corriente
  return {kind:'ok', titulo:'¡Vas al corriente!', detalle:'No tienes pendientes por ahora. Sigue así. Puedes repasar tus cursos o ver tus premios cuando quieras.', btnLabel:'Ver mis cursos', onclick:'renderCourses()'};
}
function coachRepaso(id){
  try{
    var map={}; try{ map=JSON.parse(localStorage.getItem('hb_repaso_'+S.emp)||'{}')||{}; }catch(e){ map={}; }
    map[id]=Date.now();
    localStorage.setItem('hb_repaso_'+S.emp, JSON.stringify(map));
  }catch(e){}
  openCourse(id);
}
function coachCard(noCurso){
  if(!S || S.admin) return '';
  var a; try{ a=coachNext(); }catch(e){ return ''; }
  if(noCurso && (a.kind==='curso' || a.kind==='repaso' || a.kind==='ok')) return '';  // en Mis cursos, rutaCard ya cubre eso
  return '<div class="panel" style="border-left:4px solid var(--data)">'+
    '<div class="line" style="border-bottom:none;padding:0"><span class="tg">Tu coach</span>'+speakBtn(a.titulo+'. '+a.detalle)+'</div>'+
    '<b style="font-size:16px;display:block;margin:8px 0 2px">'+esc(a.titulo)+'</b>'+
    '<p class="note">'+esc(a.detalle)+'</p>'+
    '<button class="btn" style="margin-top:10px" onclick="'+a.onclick+'">'+a.btnLabel+'</button></div>';
}

function pollGet(){ return lsGet('hb_polls'); }

/* ===== #6 RECIBO DE NÓMINA + FIRMA DIGITAL · hb_recibos ===== */
function payPeriod(){ var d=new Date(), mes=d.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  return d.getDate()<=15 ? {label:'1 al 15 de '+mes, key:d.getFullYear()+'-'+(d.getMonth()+1)+'-A'} : {label:'16 al fin de '+mes, key:d.getFullYear()+'-'+(d.getMonth()+1)+'-B'}; }
function payData(emp){
  var sueldo=3500+(emp%10)*50, bono=300, perc=sueldo+bono;
  var imss=Math.round(perc*0.025), isr=Math.round(perc*0.09), ded=imss+isr;
  return {sueldo:sueldo,bono:bono,perc:perc,imss:imss,isr:isr,ded:ded,neto:perc-ded};
}
function recibosGet(){ return lsGet('hb_recibos'); }
function signRecord(emp,key){ var a=recibosGet(); for(var i=0;i<a.length;i++){ if(a[i].emp===emp&&a[i].key===key) return a[i]; } return null; }
function renderPay(){
  var per=payPeriod(), p=payData(S.emp), signed=signRecord(S.emp,per.key), h='';
  var ppw=Math.round(p.perc/(p.perc+p.ded)*100), ddw=100-ppw;
  h+='<div class="paytop"><div class="hd" style="margin-bottom:0"><div><div class="eyebrow">'+esc(per.label)+'</div><div class="note" style="margin-top:3px">Neto a pagar · #'+(''+S.emp).padStart(3,'0')+' · '+esc(S.area)+'</div></div><span class="chipst'+(signed?'':' mut')+'">'+(signed?'Firmado ✓':'Por firmar')+'</span></div>'+
     '<div class="neto">'+money(p.neto)+'</div>'+
     '<div class="paysplit"><div class="pp" style="width:'+ppw+'%"></div><div class="dd" style="width:'+ddw+'%"></div></div>'+
     '<div class="line" style="border:none;padding:0"><span class="note" style="color:var(--data);font-weight:700">Percepciones '+money(p.perc)+'</span><span class="note" style="color:var(--accent2);font-weight:700">Deducciones − '+money(p.ded)+'</span></div></div>';
  h+='<div class="panel"><div class="hd"><b>Percepciones</b><b style="color:var(--data)">'+money(p.perc)+'</b></div>'+
     '<div class="line"><span>Sueldo</span><span>'+money(p.sueldo)+'</span></div>'+
     '<div class="line"><span>Bono de puntualidad</span><span>'+money(p.bono)+'</span></div></div>';
  h+='<div class="panel"><div class="hd"><b>Deducciones</b><b style="color:var(--accent2)">− '+money(p.ded)+'</b></div>'+
     '<div class="line"><span>IMSS</span><span>− '+money(p.imss)+'</span></div>'+
     '<div class="line"><span>ISR</span><span>− '+money(p.isr)+'</span></div></div>';
  if(signed){
    h+='<div class="card" style="border:1px solid var(--ok)"><div class="row">'+bandi('b-sm')+'<div><b style="color:var(--ok)">✓ Firmado</b><p class="note">Firmaste el '+fmtDate(signed.ts)+'. RRHH ya recibió tu acuse.</p></div></div>'+
       (signed.img?'<img src="'+signed.img+'" alt="firma" style="width:100%;max-height:200px;object-fit:contain;margin-top:10px;background:#fff;border-radius:10px;padding:8px;display:block">':'')+'</div>';
  } else {
    h+='<div class="card"><b>Firma de recibido</b><p class="note" style="margin:4px 0 9px">Firma con el dedo en el recuadro y confirma. Esto le avisa a RRHH que ya recibiste tu recibo.</p>'+
       '<canvas id="sigPad" width="600" height="240" style="width:100%;height:210px;background:#fff;border-radius:10px;border:1px solid var(--line);touch-action:none"></canvas>'+
       '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" style="margin:0;flex:none;padding:11px 14px" onclick="sigClear()">Borrar</button>'+
       '<button class="btn" style="margin:0;flex:1;padding:11px" onclick="signPay()">Firmar y enviar a RRHH</button></div></div>';
  }
  $('s-pay').innerHTML=h; show('pay');
  if(!signed) setTimeout(sigInit,40);

var _sig={on:false,drawn:false};
function sigInit(){
  var c=$('sigPad'); if(!c) return; var ctx=c.getContext('2d'); _sig.drawn=false;
  ctx.strokeStyle='#16181d'; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round';
  function pos(e){ var r=c.getBoundingClientRect(), t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height)}; }
  function down(e){ e.preventDefault(); _sig.on=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!_sig.on) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _sig.drawn=true; }
  function up(){ _sig.on=false; }
  c.onmousedown=down; c.onmousemove=move; c.onmouseup=up; c.onmouseleave=up;
  c.ontouchstart=down; c.ontouchmove=move; c.ontouchend=up;
}
function sigClear(){ var c=$('sigPad'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); _sig.drawn=false; } }
function signPay(){
  if(!_sig.drawn){ flash('Firma en el recuadro primero '); return; }
  var c=$('sigPad'), per=payPeriod(), img=''; try{ img=c.toDataURL('image/png'); }catch(e){}

/* Columnas de asistencia: una por persona, con línea de meta (100% del turno) y marcador de retardos */
function hoursChart(rows){
  var W=330,H=170,padL=10,padR=10,base=H-26,full=H-58,n=rows.length||1;
  var slot=(W-padL-padR)/n, bw=Math.min(30,slot*.58);
  var goalY=base-full;
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  // línea de meta punteada
  s+='<line x1="'+padL+'" y1="'+goalY+'" x2="'+(W-padR)+'" y2="'+goalY+'" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="5 5"/>'+
     '<text x="'+(W-padR)+'" y="'+(goalY-5)+'" text-anchor="end" font-size="8.5" font-weight="800" fill="rgba(255,255,255,.5)">META DEL TURNO</text>';
  rows.forEach(function(w,i){
    var pct=Math.min(100,w.hrs/w.exp*100);
    var col = pct>=98?'var(--data)':(pct>=85?'var(--warn)':'var(--bad)');
    var bh=Math.max(5,pct/100*full), x=padL+i*slot+(slot-bw)/2, y=base-bh;
    var det='#'+((''+w.emp).length<3?('00'+w.emp).slice(-3):w.emp)+' · '+w.area+' · '+w.hrs+' de '+w.exp+' horas · turno '+w.turno+(w.ret?(' · '+w.ret+' retardo'+(w.ret>1?'s':'')):' · sin retardos');
    s+='<g class="cbar" onclick="flash(\''+esc(det)+'\')"><title>'+esc(det)+'</title>'+
       '<rect x="'+x.toFixed(1)+'" y="'+goalY+'" width="'+bw.toFixed(1)+'" height="'+full+'" rx="7" fill="rgba(255,255,255,.05)"/>'+
       '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="7" fill="'+col+'"/>'+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">'+w.hrs+'</text>'+
       (w.ret?'<circle cx="'+(x+bw-3).toFixed(1)+'" cy="'+(y+7).toFixed(1)+'" r="6.5" fill="var(--warn)"/><text x="'+(x+bw-3).toFixed(1)+'" y="'+(y+10).toFixed(1)+'" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3a2800">'+w.ret+'</text>':'')+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-11)+'" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,.55)">#'+(''+w.emp).padStart(3,'0')+'</text>'+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-2)+'" text-anchor="middle" font-size="7.5" font-weight="700" fill="rgba(255,255,255,.35)">'+esc((w.area||'').slice(0,7))+'</text></g>';
  });
  return s+'</svg>';
}

var LOCK_MIN=10, LOCK_SEC=600, _simWork=false, _learnTimer=null, _consentCb=null, _screen='';
var SHIFTS={ almacen:{ini:7,fin:16}, inventario:{ini:7,fin:16}, produccion:{ini:7,fin:17}, calidad:{ini:8,fin:17}, comercial:{ini:9,fin:18}, maquinaria:{ini:6,fin:15} };

function shiftEnd(){ return (''+myShift().fin).padStart(2,'0')+':00'; }

function mxNow(){ try{ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})); }catch(e){ return new Date(); } }
function mxToday(){ var d=mxNow(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function inWorkHours(){ if(_simWork) return true; var s=myShift(), d=mxNow(); if(d.getDay()===0) return false; var hh=d.getHours()+d.getMinutes()/60; return hh>=s.ini && hh<s.fin; }

function learnSave(d){ try{ localStorage.setItem('hb_learn_'+S.emp, JSON.stringify(d)); }catch(e){} }
function learnLeft(){ return Math.max(0, LOCK_SEC-(learnState().used||0)); }
/* ¿se puede entrar a capacitación/educación? si no, muestra consentimiento o bloqueo y devuelve false */
function learnAllow(reenter){
  if(!S || S.admin || !inWorkHours()) return true;            // admin o fuera de horario = libre
  if(learnLeft()<=0){ showLearnLock(); return false; }         // ya gastó sus 10 min de hoy
  if(!learnState().consent){ showConsent(reenter); return false; }
  startLearnTimer(); return true;
}
function startLearnTimer(){
  if(_learnTimer) return;
  _learnTimer=setInterval(function(){
    if(!S || S.admin) return;
    if(['course','quiz','result','clases'].indexOf(_screen)<0) return;  // solo cuenta en capacitación/educación
    if(!inWorkHours()) return;                                          // fuera de horario: libre
    var d=learnState(); if(d.used>=LOCK_SEC) return;
    d.used++; d.consent=true; learnSave(d);
    if(d.used>=LOCK_SEC) showLearnLock();

}

function cConv(emp){ return 'c:'+emp; }            // línea del trabajador con Dirección
function jConv(key,emp){ return 'j:'+key+':'+emp; } // línea del trabajador con el responsable de SU área
function areaName(key){ for(var i=0;i<CFG.ranges.length;i++){ if(CFG.ranges[i].key===key) return CFG.ranges[i].area; } return key; }
/* Quién puede ESCRIBIR en una conversación (lo demás es monitoreo/solo lectura para management). */
function canWriteConv(conv){
  // Chat directo: solo los participantes. (Management que no participa = monitoreo)
  if(conv.indexOf('d:')===0){ var p=conv.slice(2).split('-').map(Number); return p.indexOf(S.emp)>=0; }
  // Grupo de área: los miembros del área (comparten key) + management.
  if(conv.indexOf('g:')===0){ return S.key===conv.slice(2) || S.dash==='rrhh' || S.dash==='ceo'; }
  // Línea con RRHH: la responde RRHH (Dirección solo monitorea).
  if(conv.indexOf('r:')===0){ var or=+conv.slice(2); return or===S.emp || S.dash==='rrhh'; }
  // Línea con Dirección: la responde Dirección (RRHH solo monitorea).
  if(conv.indexOf('c:')===0){ var oc=+conv.slice(2); return oc===S.emp || S.dash==='ceo'; }
  // Línea con el responsable: la responde el responsable de ESA área (RRHH/Dirección solo monitorean).
  if(conv.indexOf('j:')===0){ var pp=conv.slice(2).split(':'); return (+pp[1])===S.emp || (S.dash==='resp' && S.key===pp[0]); }
  return true;
}
function convMsgs(conv){ return msgsGet().filter(function(m){ return m.conv===conv; }).sort(function(x,y){ return x.ts-y.ts; }); }
function convLast(conv){ var a=convMsgs(conv); return a.length?a[a.length-1]:null; }
function convOther(conv){ var p=conv.slice(2).split('-'); return (+p[0]===S.emp)?+p[1]:+p[0]; }
function readMap(){ try{ return JSON.parse(localStorage.getItem('hb_read_'+S.emp)||'{}')||{}; }catch(e){ return {}; } }
function readSave(m){ try{ localStorage.setItem('hb_read_'+S.emp, JSON.stringify(m)); }catch(e){} }
function markConvRead(conv){ var r=readMap(); r[conv]=Date.now(); readSave(r); }
function convUnread(conv){ var last=(readMap()[conv]||0), n=0; convMsgs(conv).forEach(function(m){ if(m.ts>last && m.from!==S.emp) n++; }); return n; }
function isAdminId(id){ var r=rangeOf(+id); return !!(r&&r.admin); }
function empName(id){ var r=rangeOf(+id); return '#'+(''+id).padStart(3,'0')+(r?' · '+r.area:''); }
function roleLabel(id){ var r=rangeOf(+id); if(!r) return '#'+(''+id).padStart(3,'0'); if(r.dash==='ceo') return 'Dirección'; if(r.dash==='rrhh') return 'Recursos Humanos'; if(r.dash==='resp') return 'Responsable · '+r.area; return '#'+(''+id).padStart(3,'0'); }
function senderLabel(from){ return isAdminId(from)?roleLabel(from):('#'+(''+from).padStart(3,'0')); }
function convTitle(conv){
  if(conv.indexOf('r:')===0) return 'Recursos Humanos';
  if(conv.indexOf('c:')===0) return 'Dirección';
  if(conv.indexOf('j:')===0){ var parts=conv.slice(2).split(':'); return 'Responsable · '+areaName(parts[0]); }
  if(conv.indexOf('g:')===0) return 'Grupo · '+areaName(conv.slice(2));
  if(conv.indexOf('d:')===0) return empName(convOther(conv));
  return conv;
}
function sendMsg(conv,text,img){
  text=(text||'').trim(); if(!text&&!img) return;
  var a=msgsGet(); a.push({ id:'m'+Date.now()+'-'+S.emp, conv:conv, from:S.emp, text:text, img:img||'', ts:Date.now() });
  if(a.length>4000) a.splice(0,a.length-4000);
  msgsSave(a);
  // anti-sabotaje: intención de daño → alerta SOLO a RRHH; el trabajador NO se entera (el mensaje se envía normal)
  if(text && typeof maliceCheck==='function' && maliceCheck(text)) logAlert('[Chat] '+text);
  markConvRead(conv);
}
function totalUnread(){ if(!S||S.admin) return 0; var t=convUnread(rConv(S.emp))+convUnread(cConv(S.emp))+convUnread(jConv(S.key,S.emp))+convUnread(gConv(S.key)); myDirects().forEach(function(c){ t+=convUnread(c); }); return t; }
function updateMsgBadge(){ var b=$('nav-msgs'); if(!b) return; var ex=b.querySelector('.nbadge'); if(ex) ex.remove(); var n=totalUnread(); if(n>0){ var s=document.createElement('span'); s.className='nbadge'; s.textContent=n>9?'9+':(''+n); b.appendChild(s); } }
function myDirects(){
  var seen={}, out=[];
  msgsGet().forEach(function(m){ if(m.conv.indexOf('d:')===0){ var p=m.conv.slice(2).split('-'); if(+p[0]===S.emp||+p[1]===S.emp){ if(!seen[m.conv]){ seen[m.conv]=1; out.push(m.conv); } } } });
  out.sort(function(a,b){ var la=convLast(a),lb=convLast(b); return (lb?lb.ts:0)-(la?la.ts:0); });
  return out;
}
/* Un solo mapa de identidad visual por canal (ícono + color) — usado en listas y cabecera del hilo */
function chanMeta(conv){
  if(conv.indexOf('r:')===0) return [CHAN_IC.rrhh,'#39d6c0'];
  if(conv.indexOf('c:')===0) return [CHAN_IC.dir,'#ffd166'];
  if(conv.indexOf('j:')===0) return [CHAN_IC.resp,'#f0a05a'];
  if(conv.indexOf('g:')===0) return [IC2.people,'#2a7de1'];
  return [CHAN_IC.comp,'#8b8ff7'];
}
function chanAvatar(conv){
  // Chats entre compañeros (d:): misma foto-portada para todos, estilo banners
  if(conv.indexOf('d:')===0){
    return '<span style="width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(150deg,#0e9e8e,#053b36)"><span style="width:22px;height:22px;display:block">'+CHAN_IC.comp+'</span></span>';
  }
  var m=chanMeta(conv);
  return '<span style="width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;color:'+m[1]+';background:color-mix(in srgb,'+m[1]+' 15%,transparent)"><span style="width:23px;height:23px;display:block">'+m[0]+'</span></span>';
}
function convRow(conv,title,sub){
  var last=convLast(conv), un=convUnread(conv);
  var prev = last ? ((last.from===S.emp?'Tú: ':'')+(last.img&&!last.text?'Foto':esc((last.text||'').slice(0,42)))) : (sub||'Sin mensajes todavía');
  return '<div class="card" style="cursor:pointer" onclick="openConv(\''+conv+'\')"><div class="line"><span style="flex:1;min-width:0;display:flex;align-items:center;gap:12px">'+
    chanAvatar(conv)+
    '<span style="min-width:0"><b>'+esc(title)+'</b><br><span class="note">'+prev+'</span></span></span>'+
    (un?'<span class="tg" style="background:var(--accent);color:#fff;flex:none">'+un+'</span>':'<span class="note" style="flex:none">›</span>')+'</div></div>';
}

function dirListHTML(term){
  var q=_norm(term||''), digits=(term||'').replace(/\D/g,''), byArea={}, order=[];
  DEMO_DIR.forEach(function(p){

    if(term){ var byName=q&&_norm(p.name).indexOf(q)>=0; var byId=digits&&(''+p.id).padStart(3,'0').indexOf(digits)>=0; if(!byName&&!byId) return; }

  });
  if(!order.length) return '<div class="card"><div class="note">Nadie coincide con «'+esc(term)+'».</div></div>';

    h+='<div class="sec-t">'+esc(area)+'<span class="ln"></span></div>';

}

    h+='<div class="panel"><div class="hd"><b>'+LEAVE[_vacPick].l+'</b><button class="back" style="padding:6px 10px" onclick="pickVac(null)">Cambiar</button></div>'+

  }
  if(mine.length){ h+='<div class="sec-t">Mis solicitudes<span class="ln"></span></div>'; mine.forEach(function(r){

    h+='<div class="card"><div class="line"><span>'+LEAVE[r.type].l+'<br><span class="note">'+fmtDate(r.from)+' → '+fmtDate(r.to)+' · '+r.days+' día(s)</span></span>'+st+'</div></div>';

function pickVac(t){ _vacPick=t; renderVacaciones(); }
function submitVac(){
  if(!_vacPick){ flash('Elige un tipo'); return; }
  var from=(($('lvFrom')||{}).value||''), to=(($('lvTo')||{}).value||''), reason=(($('lvReason')||{}).value||'').trim();
  if(!from||!to){ flash('Elige las fechas (desde y hasta)'); return; }
  var days=Math.max(1, Math.round((new Date(to)-new Date(from))/86400000)+1);
  var a=leaveGet(); a.unshift({ id:'l'+Date.now(), emp:S.emp, area:S.area, type:_vacPick, from:from, to:to, days:days, reason:reason, status:'pendiente', ts:Date.now() });
  leaveSave(a); _vacPick=null; burst(); flash('Solicitud enviada a RRHH'); renderVacaciones();
}

function msgImgLoad(inp){

    img.onload=function(){ var max=900,w=img.width,h=img.height; if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }

function openConv(conv){

  } else {

function sendFromThread(){

/* sonido tipo alarma (Web Audio) + vibración */
var _beepInt=null, _beepCtx=null;
function beepStart(){
  try{ _beepCtx=_beepCtx||new (window.AudioContext||window.webkitAudioContext)();
    var ring=function(){ var o=_beepCtx.createOscillator(), g=_beepCtx.createGain(); o.type='square'; o.frequency.value=880; o.connect(g); g.connect(_beepCtx.destination); g.gain.value=0.15; o.start(); o.stop(_beepCtx.currentTime+0.35); };
    ring(); if(_beepInt) clearInterval(_beepInt); _beepInt=setInterval(ring,850);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([400,180,400,180,600]); }catch(e){}
}
function beepStop(){ try{ if(_beepInt){ clearInterval(_beepInt); _beepInt=null; } }catch(e){} try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){} }

/* ============================================================================
   SUPABASE — Fase 2: demo EN VIVO (cross-device en tiempo real).
   Mantiene la API síncrona de la app (msgsGet/pagesGet/newsGet/reportsGet) leyendo
   de un caché en memoria (DBC) que se sincroniza con el servidor por Realtime.
   Degrada con gracia: si no hay servidor (offline o CDN no cargó), usa localStorage.
   La llave publishable es PÚBLICA por diseño; en modo demo las tablas van abiertas
   (sin datos reales). Con IDs+PIN reales se cambia a RLS estricto por rol.
   ============================================================================ */
var SB_URL='https://vuyetjbeoeezuniwwquv.supabase.co';
var SB_KEY='sb_publishable_9obls1EHbWYQoYZyhE2QWA_PiOe1-Xs';
var SB=null, SB_ON=false, DBC={};   // DBC[tabla]: caché en memoria (undefined = aún no cargada → usar localStorage)
try{ if(window.supabase && /^https?:/.test(SB_URL)){ SB=window.supabase.createClient(SB_URL, SB_KEY); SB_ON=true; } }catch(e){ SB_ON=false; }
function sbReady(){ return !!(SB_ON && SB); }
function sbLoad(tbl, cb){
  if(!sbReady()){ if(cb) cb(); return; }
  try{ SB.from(tbl).select('data').order('ts',{ascending:true}).then(function(r){
    if(!r.error && r.data){ DBC[tbl]=r.data.map(function(x){ return x.data; }); try{ lsSet('hb_'+tbl, DBC[tbl]); }catch(e){} sbRerender(); }
    if(cb) cb();
  }); }catch(e){ if(cb) cb(); }
}
function sbSync(tbl, arr){   // sube/actualiza el arreglo completo (demo: tamaños chicos)
  if(!sbReady() || !arr || !arr.length) return;
  try{ SB.from(tbl).upsert(arr.map(function(o){ return {id:o.id, data:o, ts:(o.ts||Date.now())}; })).then(function(){}); }catch(e){}
}
function sbDelRec(tbl, id){ if(sbReady()){ try{ SB.from(tbl).delete().eq('id',id).then(function(){}); }catch(e){} } }
function sbSubscribe(tbl){ if(!sbReady()) return; try{ SB.channel('rt-'+tbl).on('postgres_changes',{event:'*',schema:'public',table:tbl},function(){ sbLoad(tbl); }).subscribe(); }catch(e){} }
function sbRerender(){ try{
  if(_screen==='msgs') renderMsgs();
  else if(_screen==='thread' && _curConv) openConv(_curConv);
  else if(_screen==='hr' && typeof renderDash==='function') renderDash();
  else if(_screen==='news') renderNews();
  if(typeof updateMsgBadge==='function') updateMsgBadge();
  if(S && !S.admin && typeof checkPage==='function') checkPage();
}catch(e){} }
function sbInit(){
  if(!sbReady()) return;
  ['msgs','pages','news','reports'].forEach(function(t){ sbSubscribe(t); });
  sbLoad('msgs'); sbLoad('pages');
  // noticias/reportes: si el servidor viene vacío, sembrar desde localStorage (para que la demo se vea poblada)
  sbLoad('news', function(){ if(!(DBC.news&&DBC.news.length)){ var s=lsArr('hb_news'); if(s.length){ DBC.news=s; sbSync('news', s); } } });
  sbLoad('reports', function(){ if(!(DBC.reports&&DBC.reports.length)){ var s=lsArr('hb_reports'); if(s.length){ DBC.reports=s; sbSync('reports', s); } } });
}
function lsArr(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]')||[]; }catch(e){ return []; }
}
