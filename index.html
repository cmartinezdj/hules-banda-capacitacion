function copyReport(){
  var r=reportData();
  var t='HULES BANDA · BANDAMATIC — REPORTE SEMANAL DE BANDI\n'+r.fecha+'\n\n';
  t+='🚨 ALERTAS DE SEGURIDAD (posible sabotaje):\n'+(r.alerts.length? r.alerts.map(function(a){return ' · Empleado #'+(''+a.emp).padStart(3,'0')+(a.area?' ('+a.area+')':'')+' — '+a.q+' ['+alertTime(a.t)+']';}).join('\n') : ' · Sin alertas')+'\n\n';
  t+='PREGUNTAS MÁS FRECUENTES (autorizadas):\n'+(r.freq.length? r.freq.map(function(x){return ' · '+x[0]+' — '+x[1];}).join('\n') : ' · Sin registros')+'\n\n';
  t+='SIN RESPONDER (para autorizar):\n'+(r.unans.length? r.unans.map(function(u){return ' · '+u.q+' — '+u.n+'×';}).join('\n') : ' · Sin pendientes')+'\n\n';
  t+='ATENDIDAS (cargar a Bandi):\n'+(r.res.length? r.res.map(function(u){return ' · '+u.q;}).join('\n') : ' · Ninguna todavía')+'\n';
  var done=function(){ flash('📋 Reporte copiado. Pégalo en un correo o WhatsApp.'); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ legacyCopy(t); done(); }); }
    else { legacyCopy(t); done(); }
  }catch(e){ legacyCopy(t); done(); }
}
function legacyCopy(t){
  var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
}

/* ====================== NOTICIAS (RRHH → todo el personal) ======================
   RRHH publica avisos e infografías; los trabajadores los reciben en su área "Noticias".
   Demo: localStorage 'hb_news'. En producción esto vive en el servidor y llega a todos. */
function newsGet(){ try{ return JSON.parse(localStorage.getItem('hb_news')||'[]')||[]; }catch(e){ return []; } }
function newsSave(a){ try{ localStorage.setItem('hb_news', JSON.stringify(a)); }catch(e){ flash('No se pudo guardar (espacio lleno)'); } }
function newsTime(ts){ try{ var d=new Date(ts); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return ''; } }
/* segmentación por rango de número de empleado (compartido por Noticias y mensajes directos) */
function inTarget(to,emp){ if(!to||to.mode==='all') return true; if(to.mode==='range'){ var mn=+to.min,mx=+to.max; if(isNaN(mn)||isNaN(mx)) return true; if(mn>mx){ var t=mn; mn=mx; mx=t; } return emp>=mn&&emp<=mx; } return true; }
function targetLabel(to){ if(!to||to.mode==='all') return 'Para todos'; var mn=(''+to.min).padStart(3,'0'),mx=(''+to.max).padStart(3,'0'); return to.min===to.max?('Para ID '+mn):('Para IDs '+mn+'–'+mx); }
function rangePicker(pfx,mode){ var act='background:var(--accent);color:#fff;border-color:var(--accent)';
  return '<div style="display:flex;gap:7px;flex-wrap:wrap"><button id="'+pfx+'ToAll" class="chip2" style="'+(mode==='all'?act:'')+'" onclick="setTo(\''+pfx+'\',\'all\')">👥 Todos</button><button id="'+pfx+'ToRange" class="chip2" style="'+(mode==='range'?act:'')+'" onclick="setTo(\''+pfx+'\',\'range\')">🔢 Por rango de IDs</button></div>'+
    '<div id="'+pfx+'Range" style="display:'+(mode==='range'?'flex':'none')+';gap:8px;align-items:center;margin-top:8px"><span class="note">Desde</span><input id="'+pfx+'Min" class="fin" type="number" min="1" placeholder="001" style="width:88px"><span class="note">hasta</span><input id="'+pfx+'Max" class="fin" type="number" min="1" placeholder="050" style="width:88px"></div>';
}
function setTo(pfx,m){ if(pfx==='news') _newsTo=m; else if(pfx==='poll') _pollTo=m; else _dmTo=m; var r=$(pfx+'Range'); if(r) r.style.display=(m==='range'?'flex':'none'); var act='background:var(--accent);color:#fff;border-color:var(--accent)'; var a=$(pfx+'ToAll'),b=$(pfx+'ToRange'); if(a) a.style.cssText=(m==='all'?act:''); if(b) b.style.cssText=(m==='range'?act:''); }
function readTarget(pfx){ var mode=(pfx==='news'?_newsTo:(pfx==='poll'?_pollTo:_dmTo)); if(mode!=='range') return {mode:'all'}; var mn=parseInt(($(pfx+'Min')||{}).value,10), mx=parseInt(($(pfx+'Max')||{}).value,10); if(isNaN(mn)||isNaN(mx)) return null; return {mode:'range',min:mn,max:mx}; }
var _newsTo='all', _dmTo='all', _pollTo='all';
var _newsImg=null;
function loadNewsImg(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(e){ var img=new Image();
    img.onload=function(){ var max=1000,w=img.width,h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      _newsImg=c.toDataURL('image/jpeg',0.82);
      var pv=$('newsImgPv'); if(pv){ pv.src=_newsImg; pv.style.display='block'; }
      flash('Infografía lista para publicar');
    };
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}
function postNews(){
  var t=(($('newsTitle')||{}).value||'').trim(), b=(($('newsBody')||{}).value||'').trim();
  if(!t&&!b&&!_newsImg){ flash('Escribe un título o mensaje'); return; }
  var to=readTarget('news'); if(!to){ flash('Escribe el rango de IDs (desde–hasta)'); return; }
  var a=newsGet();
  a.unshift({ id:'n'+Date.now(), t:t, b:b, img:_newsImg||'', to:to, by:'RRHH', ts:Date.now() });
  if(a.length>100) a.length=100;
  newsSave(a); _newsImg=null; flash('📣 Publicada · '+targetLabel(to)); renderNews();
}
function delNews(id){ if(!confirm('¿Eliminar esta noticia?')) return; newsSave(newsGet().filter(function(n){ return n.id!==id; })); renderNews(); }
/* ===== Acuse "Enterado": el trabajador confirma que leyó (da puntos bajos 1 sola vez) y RRHH ve quién leyó.
   Demo: el acuse se guarda en la propia noticia (hb_news[].reads). En producción va al servidor. ===== */
function hasRead(n){ var r=n.reads||[]; for(var j=0;j<r.length;j++){ if(r[j].emp===S.emp) return true; } return false; }
function markRead(id){
  var a=newsGet(), n=null; for(var i=0;i<a.length;i++){ if(a[i].id===id){ n=a[i]; break; } }
  if(!n) return;

  if(hasRead(n)){ renderNews(); return; }      // ya estaba marcada: no re-otorga puntos
  n.reads.push({ emp:S.emp, ts:Date.now() });
  newsSave(a);
  S.points+=CFG.points.read; save(); renderTop();
  flash('👍 ¡Gracias por enterarte! +'+CFG.points.read+' pts');
  renderNews();
}

    h+=dmAdminBlock();
  }

/* ====================== BUZÓN: QUEJAS Y REPORTES (personal → RRHH) ======================

   acepta una anormalidad/mejora válida, se guarda y el trabajador gana CFG.points.report (75).

function reportsGet(){ try{ return JSON.parse(localStorage.getItem('hb_reports')||'[]')||[]; }catch(e){ return []; } }
function reportsSave(a){ try{ localStorage.setItem('hb_reports', JSON.stringify(a)); }catch(e){} }
/* Mensajes directos de RRHH al personal (un trabajador, un rango o todos) */
function dmGet(){ try{ return JSON.parse(localStorage.getItem('hb_dm')||'[]')||[]; }catch(e){ return []; } }

function sendDM(){
  var txt=(($('dmText')||{}).value||'').trim(); if(!txt){ flash('Escribe el mensaje'); return; }

var RPT={ queja:{ic:'😟',l:'Queja',pts:false}, anormalidad:{ic:'⚠️',l:'Reporte de anormalidad',pts:true}, mejora:{ic:'💡',l:'Mejora continua',pts:true} };
var _buzType='queja';
function pickBuzType(t){ _buzType=t; renderMsgs(); }
function buzTime(ts){ try{ var d=new Date(ts); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function stTag(s){ return s==='aceptado'?'<span class="tg g">Aceptado</span>':s==='rechazado'?'<span class="tg">No procede</span>':'<span class="tg">Pendiente</span>'; }
function submitReport(){

function awardPointsTo(emp,pts){

function reportFormBlock(){   // trabajador: queja / anormalidad / mejora

var HBVOICES=[];
function loadVoices(){ try{ if('speechSynthesis' in window){ var v=speechSynthesis.getVoices(); if(v&&v.length) HBVOICES=v; } }catch(e){} }
function pickVoice(lang){
  var vs=HBVOICES.length?HBVOICES:[]; if(!vs.length){ loadVoices(); vs=HBVOICES; }
  if(!vs.length) return null;
  var nrm=function(v){ return (v.lang||'').toLowerCase().replace('_','-'); };
  // calidad: prefiere voces "Enhanced / Premium / Natural" si el dispositivo las tiene descargadas
  var qual=function(v){ var n=(v.name||''), s=0;
    if(/enhanced|mejorad|premium|neural|natural|siri/i.test(n)) s+=2;
    if(/paulina|juan|google|microsoft|sabina|luciana|monica|angelica/i.test(n)) s+=1;
    return s; };
  var best=function(list){ var b=list[0]; for(var x=1;x<list.length;x++) if(qual(list[x])>qual(b)) b=list[x]; return b; };
  if(lang && lang.toLowerCase().indexOf('en')===0){
    var en=vs.filter(function(v){ return /^en-us/.test(nrm(v)); }); if(!en.length) en=vs.filter(function(v){ return /^en/.test(nrm(v)); });
    return en.length?best(en):null;
  }
  var pref=['es-mx','es-419','es-us','es-co','es-es','es'];
  for(var i=0;i<pref.length;i++){ var m=vs.filter(function(v){ return nrm(v).indexOf(pref[i])===0; }); if(m.length) return best(m); }
  return null;
}
try{ if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var clean=String(text||'').replace(/[\u{1F000}-\u{1FAFF}←-⇿⌀-➿⬀-⯿️]/gu,' ');
    if(!clean) return;
    var u=new SpeechSynthesisUtterance(clean.replace(/\s+/g,' ').trim());
    var v=pickVoice(lang); if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=lang||'es-MX'; }
    u.rate=(window.S&&S.rate)||0.78; u.pitch=1.0; u.volume=1;   // velocidad ajustable desde Profe Bandi
    setTimeout(function(){ try{ window.speechSynthesis.speak(u); }catch(e){} }, 80);
  }catch(e){}
}

  var cols=[getCss('--accent'),getCss('--accent2'),'#27c267','#ffd76a','#5aa8ff','#fff'];
  for(var i=0;i<26;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.transform='rotate('+(Math.random()*360)+'deg)';

function payPeriod(){ var d=new Date(), mes=d.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  return d.getDate()<=15 ? {label:'1 al 15 de '+mes, key:d.getFullYear()+'-'+(d.getMonth()+1)+'-A'} : {label:'16 al fin de '+mes, key:d.getFullYear()+'-'+(d.getMonth()+1)+'-B'}; }
function payData(emp){
  var sueldo=3500+(emp%10)*50, bono=300, perc=sueldo+bono;
  var imss=Math.round(perc*0.025), isr=Math.round(perc*0.09), ded=imss+isr;
  return {sueldo:sueldo,bono:bono,perc:perc,imss:imss,isr:isr,ded:ded,neto:perc-ded};
}
function recibosGet(){ return lsGet('hb_recibos'); }
function signRecord(emp,key){ var a=recibosGet(); for(var i=0;i<a.length;i++){ if(a[i].emp===emp&&a[i].key===key) return a[i]; } return null; }

  h+='<div class="card hero"><div class="row">'+bandi('b-lg')+'<div><h2>Mi recibo de nómina</h2><p>Revísalo y fírmalo. Le llega a RRHH sin papel.</p></div></div></div>';

  } else {
    h+='<div class="card"><b>Firma de recibido</b><p class="note" style="margin:4px 0 9px">Firma con el dedo en el recuadro y confirma. Esto le avisa a RRHH que ya recibiste tu recibo.</p>'+

       '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" style="margin:0;flex:none;padding:11px 14px" onclick="sigClear()">Borrar</button>'+
       '<button class="btn" style="margin:0;flex:1;padding:11px" onclick="signPay()">✍️ Firmar y enviar a RRHH</button></div></div>';
  }
  $('s-pay').innerHTML=h; show('pay');

var _sig={on:false,drawn:false};
function sigInit(){
  var c=$('sigPad'); if(!c) return; var ctx=c.getContext('2d'); _sig.drawn=false;
  ctx.strokeStyle='#16181d'; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round';
  function pos(e){ var r=c.getBoundingClientRect(), t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height)}; }
  function down(e){ e.preventDefault(); _sig.on=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!_sig.on) return; e.preventDefault(); var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _sig.drawn=true; }
  function up(){ _sig.on=false; }
  c.onmousedown=down; c.onmousemove=move; c.onmouseup=up; c.onmouseleave=up;
  c.ontouchstart=down; c.ontouchmove=move; c.ontouchend=up;
}
function sigClear(){ var c=$('sigPad'); if(c){ c.getContext('2d').clearRect(0,0,c.width,c.height); _sig.drawn=false; } }
function signPay(){
  if(!_sig.drawn){ flash('Firma en el recuadro primero ✍️'); return; }
  var c=$('sigPad'), per=payPeriod(), img=''; try{ img=c.toDataURL('image/png'); }catch(e){}
  var a=recibosGet(); a.unshift({ emp:S.emp, area:S.area, key:per.key, period:per.label, img:img, ts:Date.now() }); lsSet('hb_recibos', a);
  burst(); flash('✅ ¡Recibo firmado y enviado a RRHH!'); renderPay();
}

/* ===== #9 LOCK-DOWN (opción B): 10 min/día SOLO en capacitación + educación básica, en
   horario laboral. Todo lo demás (mensajes, noticias, recibos, premios) SIEMPRE libre.
   Al salir del turno se reanuda sin límite. Demo: datos de ejemplo + simulador de horario;
   en Fase 2 usa la hora del servidor y los horarios reales por trabajador. */
var LOCK_MIN=10, LOCK_SEC=600, _simWork=false, _learnTimer=null, _consentCb=null, _screen='';
var SHIFTS={ almacen:{ini:7,fin:16}, inventario:{ini:7,fin:16}, produccion:{ini:7,fin:17}, calidad:{ini:8,fin:17}, comercial:{ini:9,fin:18}, maquinaria:{ini:6,fin:15} };
function myShift(){ return SHIFTS[S.key]||{ini:8,fin:17}; }
function shiftEnd(){ return (''+myShift().fin).padStart(2,'0')+':00'; }
function inWorkHours(){ if(_simWork) return true; var s=myShift(), d=new Date(); if(d.getDay()===0) return false; var hh=d.getHours()+d.getMinutes()/60; return hh>=s.ini && hh<s.fin; }
function learnState(){ var d; try{ d=JSON.parse(localStorage.getItem('hb_learn_'+S.emp)||'{}')||{}; }catch(e){ d={}; } var today=new Date().toISOString().slice(0,10); if(d.date!==today) d={date:today,used:0,consent:false}; return d; }
function learnSave(d){ try{ localStorage.setItem('hb_learn_'+S.emp, JSON.stringify(d)); }catch(e){} }
function learnLeft(){ return Math.max(0, LOCK_SEC-(learnState().used||0)); }
/* ¿se puede entrar a capacitación/educación? si no, muestra consentimiento o bloqueo y devuelve false */
function learnAllow(reenter){
  if(!S || S.admin || !inWorkHours()) return true;            // admin o fuera de horario = libre
  if(learnLeft()<=0){ showLearnLock(); return false; }         // ya gastó sus 10 min de hoy
  if(!learnState().consent){ showConsent(reenter); return false; }
  startLearnTimer(); return true;
}
function startLearnTimer(){
  if(_learnTimer) return;
  _learnTimer=setInterval(function(){
    if(!S || S.admin) return;
    if(['course','quiz','result','clases'].indexOf(_screen)<0) return;  // solo cuenta en capacitación/educación
    if(!inWorkHours()) return;                                          // fuera de horario: libre
    var d=learnState(); if(d.used>=LOCK_SEC) return;
    d.used++; d.consent=true; learnSave(d);
    if(d.used>=LOCK_SEC) showLearnLock();
  },1000);
}
function showConsent(cb){
  _consentCb=cb||null; var el=$('lockScreen'); if(!el){ if(cb) cb(); return; }
  el.innerHTML='<div class="lk-emoji">⏱️</div>'+bandi('b-lg')+
    '<h2>Tus 10 minutos de hoy</h2>'+
    '<p>En horario laboral tienes <b>'+LOCK_MIN+' minutos al día</b> para <b>capacitación y educación básica</b>. Hoy te quedan <b>'+Math.ceil(learnLeft()/60)+' min</b>. El tiempo corre mientras estés aquí.</p>'+
    '<p>Todo lo demás —mensajes, noticias, recibos, premios— está <b>siempre libre</b>.</p>'+
    '<button class="btn" style="max-width:280px;margin-top:16px" onclick="acceptLearn()">Empezar mis '+LOCK_MIN+' min ▶</button>'+
    '<div class="lk-demo"><span onclick="hideLock()" style="text-decoration:underline;cursor:pointer">Ahora no</span></div>';
  el.classList.remove('hide');
}
function acceptLearn(){ var d=learnState(); d.consent=true; learnSave(d); hideLock(); startLearnTimer(); var f=_consentCb; _consentCb=null; if(f) f(); }

/* ============================================================================
   MENSAJES (chat interno) — RRHH · grupo de área · directos por ID (estilo BBM)
   Server-ready: hoy en localStorage 'hb_msgs'; en Fase 2 cada get/send pega al servidor.
   RRHH puede leer cualquier conversación (encubierto). Anti-sabotaje: alerta solo a RRHH.
   ============================================================================ */
function msgsGet(){ return lsGet('hb_msgs'); }
function msgsSave(a){ lsSet('hb_msgs', a); }
function dConv(a,b){ a=+a; b=+b; return 'd:'+Math.min(a,b)+'-'+Math.max(a,b); }
function gConv(key){ return 'g:'+key; }
function rConv(emp){ return 'r:'+emp; }            // línea del trabajador con RRHH
function cConv(emp){ return 'c:'+emp; }            // línea del trabajador con Dirección
function jConv(key,emp){ return 'j:'+key+':'+emp; } // línea del trabajador con el responsable de SU área
function areaName(key){ for(var i=0;i<CFG.ranges.length;i++){ if(CFG.ranges[i].key===key) return CFG.ranges[i].area; } return key; }
/* Quién puede ESCRIBIR en una conversación (lo demás es monitoreo/solo lectura para management). */
function canWriteConv(conv){
  // Chat directo: solo los participantes. (Management que no participa = monitoreo)
  if(conv.indexOf('d:')===0){ var p=conv.slice(2).split('-').map(Number); return p.indexOf(S.emp)>=0; }
  // Grupo de área: los miembros del área (comparten key) + management.
  if(conv.indexOf('g:')===0){ return S.key===conv.slice(2) || S.dash==='rrhh' || S.dash==='ceo'; }
  // Línea con RRHH: la responde RRHH (Dirección solo monitorea).
  if(conv.indexOf('r:')===0){ var or=+conv.slice(2); return or===S.emp || S.dash==='rrhh'; }
  // Línea con Dirección: la responde Dirección (RRHH solo monitorea).
  if(conv.indexOf('c:')===0){ var oc=+conv.slice(2); return oc===S.emp || S.dash==='ceo'; }
  // Línea con el responsable: la responde el responsable de ESA área (RRHH/Dirección solo monitorean).
  if(conv.indexOf('j:')===0){ var pp=conv.slice(2).split(':'); return (+pp[1])===S.emp || (S.dash==='resp' && S.key===pp[0]); }
  return true;
}
function convMsgs(conv){ return msgsGet().filter(function(m){ return m.conv===conv; }).sort(function(x,y){ return x.ts-y.ts; }); }
function convLast(conv){ var a=convMsgs(conv); return a.length?a[a.length-1]:null; }
function convOther(conv){ var p=conv.slice(2).split('-'); return (+p[0]===S.emp)?+p[1]:+p[0]; }
function readMap(){ try{ return JSON.parse(localStorage.getItem('hb_read_'+S.emp)||'{}')||{}; }catch(e){ return {}; } }
function readSave(m){ try{ localStorage.setItem('hb_read_'+S.emp, JSON.stringify(m)); }catch(e){} }
function markConvRead(conv){ var r=readMap(); r[conv]=Date.now(); readSave(r); }
function convUnread(conv){ var last=(readMap()[conv]||0), n=0; convMsgs(conv).forEach(function(m){ if(m.ts>last && m.from!==S.emp) n++; }); return n; }
function isAdminId(id){ var r=rangeOf(+id); return !!(r&&r.admin); }
function empName(id){ var r=rangeOf(+id); return '#'+(''+id).padStart(3,'0')+(r?' · '+r.area:''); }
function roleLabel(id){ var r=rangeOf(+id); if(!r) return '#'+(''+id).padStart(3,'0'); if(r.dash==='ceo') return 'Dirección'; if(r.dash==='rrhh') return 'Recursos Humanos'; if(r.dash==='resp') return 'Responsable · '+r.area; return '#'+(''+id).padStart(3,'0'); }
function senderLabel(from){ return isAdminId(from)?roleLabel(from):('#'+(''+from).padStart(3,'0')); }
function convTitle(conv){
  if(conv.indexOf('r:')===0) return 'Recursos Humanos';
  if(conv.indexOf('c:')===0) return 'Dirección';
  if(conv.indexOf('j:')===0){ var parts=conv.slice(2).split(':'); return 'Responsable · '+areaName(parts[0]); }
  if(conv.indexOf('g:')===0) return 'Grupo · '+areaName(conv.slice(2));
  if(conv.indexOf('d:')===0) return empName(convOther(conv));
  return conv;
}
function sendMsg(conv,text,img){
  text=(text||'').trim(); if(!text&&!img) return;
  var a=msgsGet(); a.push({ id:'m'+Date.now()+'-'+S.emp, conv:conv, from:S.emp, text:text, img:img||'', ts:Date.now() });
  if(a.length>4000) a.splice(0,a.length-4000);
  msgsSave(a);
  // anti-sabotaje: intención de daño → alerta SOLO a RRHH; el trabajador NO se entera (el mensaje se envía normal)
  if(text && typeof maliceCheck==='function' && maliceCheck(text)) logAlert('[Chat] '+text);
  markConvRead(conv);
}
function totalUnread(){ if(!S||S.admin) return 0; var t=convUnread(rConv(S.emp))+convUnread(cConv(S.emp))+convUnread(jConv(S.key,S.emp))+convUnread(gConv(S.key)); myDirects().forEach(function(c){ t+=convUnread(c); }); return t; }
function updateMsgBadge(){ var b=$('nav-msgs'); if(!b) return; var ex=b.querySelector('.nbadge'); if(ex) ex.remove(); var n=totalUnread(); if(n>0){ var s=document.createElement('span'); s.className='nbadge'; s.textContent=n>9?'9+':(''+n); b.appendChild(s); } }
function myDirects(){
  var seen={}, out=[];
  msgsGet().forEach(function(m){ if(m.conv.indexOf('d:')===0){ var p=m.conv.slice(2).split('-'); if(+p[0]===S.emp||+p[1]===S.emp){ if(!seen[m.conv]){ seen[m.conv]=1; out.push(m.conv); } } } });
  out.sort(function(a,b){ var la=convLast(a),lb=convLast(b); return (lb?lb.ts:0)-(la?la.ts:0); });
  return out;
}
function convRow(conv,title,sub){
  var last=convLast(conv), un=convUnread(conv);
  var prev = last ? ((last.from===S.emp?'Tú: ':'')+(last.img&&!last.text?'📷 Foto':esc((last.text||'').slice(0,42)))) : (sub||'Sin mensajes todavía');
  return '<div class="card" style="cursor:pointer" onclick="openConv(\''+conv+'\')"><div class="line"><span style="flex:1;min-width:0"><b>'+esc(title)+'</b><br><span class="note">'+prev+'</span></span>'+
    (un?'<span class="tg" style="background:var(--accent);color:#fff;flex:none">'+un+'</span>':'<span class="note" style="flex:none">›</span>')+'</div></div>';
}
var _curConv=null, _pendImg=null;
function renderMsgs(){
  _pendImg=null;
  var h='';
  var sub = S.admin ? (S.dash==='resp' ? 'Tu equipo, tu grupo de área y tus líneas con Dirección y RRHH.' : 'Líneas con la planta, monitoreo, quejas/reportes, vacaciones y recibos — todo en un lugar.')
                    : 'Escribe a RRHH, a Dirección, a tu responsable o a tu grupo. Aquí también van tus quejas y vacaciones.';
  h+='<div class="card hero"><div class="row">'+bandi('b-lg')+'<div><h2>Mensajes</h2><p>'+sub+'</p></div></div></div>';
  if(S.admin){
    if(S.dash==='resp') h+=respMsgs();
    else { h+=beeperAdminCard(); h+=msgAdminInbox(); }
  } else {
    h+='<div class="sec-t">Tus líneas directas<span class="ln"></span></div>';
    h+=convRow(rConv(S.emp),'📊 Recursos Humanos','Tu canal privado con RRHH');
    h+=convRow(cConv(S.emp),'👑 Dirección','Escríbele directo a Dirección');
    h+=convRow(jConv(S.key,S.emp),'🧑‍🏭 Responsable de '+S.area,'El jefe de tu área');
    h+='<div class="sec-t">Tu grupo de área<span class="ln"></span></div>'+convRow(gConv(S.key),'👥 Grupo · '+S.area,'Mensajes de toda tu área');
    h+='<div class="card"><b>💬 Escribir a un compañero</b><div class="note" style="margin:3px 0 8px">Con su número de empleado, como tu PIN. Ejemplo: 055</div>'+
       '<div style="display:flex;gap:8px"><input id="newChatId" class="fin" type="number" placeholder="Número de empleado" style="flex:1;min-width:0"><button class="btn" style="margin:0;flex:none;width:auto;padding:13px 18px" onclick="newChatById()">Abrir</button></div></div>';
    var dir=myDirects();
    if(dir.length){ h+='<div class="sec-t">Conversaciones<span class="ln"></span></div>'; dir.forEach(function(c){ h+=convRow(c,empName(convOther(c)),null); }); }
    h+=reportFormBlock(); h+=leaveWorkerBlock(); h+=myReportsBlock();
  }
  $('s-msgs').innerHTML=h; show('msgs');
}
/* Bandeja del responsable de área: solo SU equipo (líneas j: de su key) + su grupo + sus líneas con Dirección/RRHH + beeper de su equipo. */
function respMsgs(){
  var h='';
  h+='<div class="sec-t">Tus líneas directas<span class="ln"></span></div>';
  h+=convRow(cConv(S.emp),'👑 Dirección','Tu canal con Dirección');
  h+=convRow(rConv(S.emp),'📊 Recursos Humanos','Tu canal con RRHH');
  h+=beeperAdminCard();
  h+='<div class="sec-t">Grupo de '+esc(S.area)+'<span class="ln"></span></div>'+convRow(gConv(S.key),'👥 Grupo · '+S.area,'Mensajes de toda tu área');
  h+='<div class="sec-t">Tu equipo te escribe<span class="ln"></span></div>';
  var pre='j:'+S.key+':', seen={};
  msgsGet().forEach(function(m){ if(m.conv.indexOf(pre)===0) seen[m.conv]=1; });
  var ks=Object.keys(seen);
  if(!ks.length) h+='<div class="card"><div class="note">Nadie de tu equipo te ha escrito todavía.</div></div>';
  ks.forEach(function(c){ var emp=c.slice(pre.length); h+=convRow(c,'#'+(''+emp).padStart(3,'0')+' · '+S.area,null); });
  return h;
}
function msgAdminInbox(){
  var msgs=msgsGet(), rc={},cc={},jc={},gc={},dc={};
  msgs.forEach(function(m){ var c=m.conv;
    if(c.indexOf('r:')===0) rc[c]=1; else if(c.indexOf('c:')===0) cc[c]=1; else if(c.indexOf('j:')===0) jc[c]=1;
    else if(c.indexOf('g:')===0) gc[c]=1; else if(c.indexOf('d:')===0) dc[c]=1; });
  var h='<div class="card" style="border-left:4px solid var(--accent2)"><div class="note">🔍 <b>Monitoreo.</b> Puedes leer cualquier conversación de la planta. Los trabajadores no ven que tienes acceso.</div></div>';
  h+='<div class="sec-t">Líneas con RRHH<span class="ln"></span></div>';
  var rk=Object.keys(rc); if(!rk.length) h+='<div class="card"><div class="note">Nadie ha escrito a RRHH todavía.</div></div>';
  rk.forEach(function(c){ h+=convRow(c,'#'+(''+c.slice(2)).padStart(3,'0')+' → RRHH',null); });
  h+='<div class="sec-t">Líneas con Dirección<span class="ln"></span></div>';
  var ck=Object.keys(cc); if(!ck.length) h+='<div class="card"><div class="note">Nadie ha escrito a Dirección todavía.</div></div>';
  ck.forEach(function(c){ h+=convRow(c,'#'+(''+c.slice(2)).padStart(3,'0')+' → Dirección',null); });
  h+='<div class="sec-t">Líneas con responsables<span class="ln"></span></div>';
  var jk=Object.keys(jc); if(!jk.length) h+='<div class="card"><div class="note">Sin mensajes a responsables.</div></div>';
  jk.forEach(function(c){ var parts=c.slice(2).split(':'); h+=convRow(c,'#'+(''+parts[1]).padStart(3,'0')+' → Resp. '+areaName(parts[0]),null); });
  h+='<div class="sec-t">Grupos de área<span class="ln"></span></div>';
  var gk=Object.keys(gc); if(!gk.length) h+='<div class="card"><div class="note">Sin mensajes de grupo.</div></div>';
  gk.forEach(function(c){ h+=convRow(c,convTitle(c),null); });
  h+='<div class="sec-t">Chats entre empleados (monitoreo)<span class="ln"></span></div>';
  var dk=Object.keys(dc); if(!dk.length) h+='<div class="card"><div class="note">Sin conversaciones todavía.</div></div>';
  dk.forEach(function(c){ var p=c.slice(2).split('-'); h+=convRow(c,'#'+(''+p[0]).padStart(3,'0')+' ↔ #'+(''+p[1]).padStart(3,'0'),null); });
  return h;
}
function newChatById(){
  var v=parseInt(($('newChatId')||{}).value,10);
  if(isNaN(v)){ flash('Escribe un número de empleado'); return; }
  if(v===S.emp){ flash('Ese eres tú 🙂'); return; }
  if(!rangeOf(v)){ flash('Ese número de empleado no existe'); return; }
  if(isAdminId(v)){ flash('Para RRHH, Dirección o tu responsable usa tus líneas directas de arriba.'); return; }
  openConv(dConv(S.emp,v));
}
function msgImgLoad(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(e){ var img=new Image();
    img.onload=function(){ var max=900,w=img.width,h=img.height; if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      _pendImg=c.toDataURL('image/jpeg',0.8); openConv(_curConv); };
    img.src=e.target.result; };
  rd.readAsDataURL(f);
}
function threadHTML(msgs,showSender){
  if(!msgs.length) return '<div class="note" style="text-align:center;padding:22px">Aún no hay mensajes. ¡Escribe el primero!</div>';
  return msgs.map(function(m){
    var mine=m.from===S.emp;
    var body=(m.img?'<img src="'+m.img+'" style="max-width:200px;border-radius:10px;display:block;'+(m.text?'margin-bottom:6px':'')+'">':'')+(m.text?esc(m.text):'');
    var lbl=(showSender&&!mine)?'<div class="note" style="margin-bottom:2px;font-size:10px">'+esc(senderLabel(m.from))+'</div>':'';
    return '<div class="m '+(mine?'user':'bot')+'"><div class="bub">'+lbl+body+'</div></div>';
  }).join('');
}
function openConv(conv){
  _curConv=conv; markConvRead(conv);
  // Es "monitoreo" (solo lectura) cuando el management NO tiene permiso de escribir en esa conversación.
  var isMonitor = S.admin && !canWriteConv(conv);
  var isGroup = conv.indexOf('g:')===0;
  var isLine = /^(r:|c:|j:)/.test(conv);   // líneas con RRHH / Dirección / responsable → mostrar quién responde
  var h='';
  h+='<div class="chathead">'+bandi('b-md')+'<div class="t"><b>'+esc(convTitle(conv))+'</b><span>'+(isMonitor?'👁 Monitoreo · solo lectura':(isGroup?'Grupo de área':'Conversación'))+'</span></div></div>';
  h+='<div class="msgs" id="thMsgs">'+threadHTML(convMsgs(conv), isGroup||S.admin||isLine)+'</div>';
  if(_pendImg && !isMonitor) h+='<div class="card" style="padding:8px;display:flex;gap:10px;align-items:center"><img src="'+_pendImg+'" style="max-height:70px;border-radius:8px"><span class="note" style="flex:1">Imagen lista para enviar</span><button class="back" style="padding:6px 10px" onclick="_pendImg=null;openConv(_curConv)">Quitar</button></div>';
  if(!isMonitor){
    h+='<div class="composer"><label class="send" style="background:var(--card2);color:var(--txt);cursor:pointer;font-size:20px">📎<input type="file" accept="image/*" onchange="msgImgLoad(this)" style="display:none"></label><input id="thIn" placeholder="Escribe un mensaje…" autocomplete="off"><button class="send" onclick="sendFromThread()" aria-label="Enviar">➤</button></div>';
  } else {
    h+='<div class="note" style="text-align:center;padding:12px">Estás observando esta conversación (monitoreo). No puedes escribir aquí.</div>';
  }
  $('s-thread').innerHTML=h; show('thread');
  var t=$('thMsgs'); if(t) t.scrollTop=t.scrollHeight;
  var ci=$('thIn'); if(ci){ ci.onkeydown=function(ev){ if(ev.key==='Enter') sendFromThread(); }; ci.focus(); }
}
function sendFromThread(){
  var inp=$('thIn'), t=inp?(inp.value||'').trim():'';
  if(!t && !_pendImg) return;
  sendMsg(_curConv,t,_pendImg); _pendImg=null;
  openConv(_curConv);
}

/* ============================================================================
   BEEPER — RRHH/supervisor llama a un trabajador por su ID; le llega una alarma
   (sonido + vibración + pantalla completa) para que se presente donde se necesita.
   Demo: localStorage 'hb_pages' + sondeo cada 3 s. En vivo (Fase 2): push del servidor. */
function pagesGet(){ return lsGet('hb_pages'); }
function pagesSave(a){ lsSet('hb_pages', a); }
function beeperAdminCard(){
  var recent=pagesGet().slice(0,5);
  var list = recent.length ? '<div class="note" style="margin-top:10px">'+recent.map(function(p){ return '#'+(''+p.to).padStart(3,'0')+' &mdash; '+(p.ackTs?'<b style="color:var(--ok)">✓ confirmó</b>':'<span style="color:var(--warn)">⏳ llamando…</span>'); }).join('<br>')+'</div>' : '';
  var soloEquipo = (S.dash==='resp');
  return '<div class="card" style="border-left:4px solid var(--accent2)"><b>📟 Beeper &mdash; llamar a un trabajador</b>'+
    '<div class="note" style="margin:3px 0 9px">Escribe su número y le llega una <b>alarma</b> para que se presente.'+(soloEquipo?' Solo puedes llamar a <b>tu equipo de '+esc(S.area)+'</b>.':'')+'</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:9px"><input id="beepId" class="fin" type="number" placeholder="N° empleado" style="flex:none;width:130px"><input id="beepMsg" class="fin" placeholder="Motivo / lugar (ej. Ven a RRHH)" style="flex:1"></div>'+
    '<button class="btn" style="margin:0;padding:12px" onclick="sendPage()">📟 Llamar</button>'+list+'</div>';
}
function sendPage(){
  var id=parseInt(($('beepId')||{}).value,10), msg=(($('beepMsg')||{}).value||'').trim();
  if(isNaN(id)){ flash('Escribe el número de empleado'); return; }
  var r=rangeOf(id);
  if(!r){ flash('Ese número de empleado no existe'); return; }
  // El responsable solo puede llamar a trabajadores de SU propia área.
  if(S.dash==='resp' && (r.admin || r.key!==S.key)){ flash('Solo puedes llamar a tu equipo de '+S.area+'.'); return; }
  var a=pagesGet(); a.unshift({ id:'pg'+Date.now(), to:id, by:(S&&S.emp), msg:msg||'Preséntate donde se te indica', ts:Date.now(), ackTs:0 });
  pagesSave(a); flash('📟 Llamando al #'+(''+id).padStart(3,'0')); renderMsgs();
}
function myPendingPage(){ var a=pagesGet(); for(var i=0;i<a.length;i++){ if(a[i].to===S.emp && !a[i].ackTs) return a[i]; } return null; }
function checkPage(){ if(!S||S.admin) return; var bs=$('beepScreen'); if(!bs||!bs.classList.contains('hide')) return; var p=myPendingPage(); if(p) showBeep(p); }
function showBeep(p){
  var el=$('beepScreen'); if(!el) return;
  el.innerHTML='<div class="bp-emoji">📟</div>'+bandi('b-lg')+
    '<h2>¡Te están llamando!</h2>'+
    '<p>'+esc(p.msg)+'</p>'+
    '<div class="lk-time">'+esc(roleLabel(p.by)||'La planta')+' te necesita</div>'+
    '<button class="btn" style="max-width:280px" onclick="ackPage()">✓ Voy para allá</button>';
  el.classList.remove('hide'); beepStart();
}
function ackPage(){ var p=myPendingPage(); if(p){ var a=pagesGet(); for(var i=0;i<a.length;i++){ if(a[i].id===p.id){ a[i].ackTs=Date.now(); break; } } pagesSave(a); } beepStop(); var el=$('beepScreen'); if(el) el.classList.add('hide'); }
/* sonido tipo alarma (Web Audio) + vibración */
var _beepInt=null, _beepCtx=null;
function beepStart(){
  try{ _beepCtx=_beepCtx||new (window.AudioContext||window.webkitAudioContext)();
    var ring=function(){ var o=_beepCtx.createOscillator(), g=_beepCtx.createGain(); o.type='square'; o.frequency.value=880; o.connect(g); g.connect(_beepCtx.destination); g.gain.value=0.15; o.start(); o.stop(_beepCtx.currentTime+0.35); };
    ring(); if(_beepInt) clearInterval(_beepInt); _beepInt=setInterval(ring,850);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([400,180,400,180,600]); }catch(e){}
}
function beepStop(){ try{ if(_beepInt){ clearInterval(_beepInt); _beepInt=null; } }catch(e){} try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){} }
