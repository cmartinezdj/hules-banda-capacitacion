     ====================================================================== */
  clasesLevels:['Primeros pasos','Básico','Practicando','Entendiendo','Avanzando','Seguro','Fuerte','Preparado','Experto práctico','Logro final'],
  clasesTiers:{ corto:25, medio:50, normal:100, dificil:150 },
  clases: [
    { id:'lectura', name:'Lectura y escritura útil', icon:'', tier:'normal', desc:'Leer instrucciones, llenar formatos y firmar con seguridad.', levels:[
      { n:1, title:'Leer con propósito',
        lesson:['Leer no es solo pasar los ojos: es entender qué te pide el texto.','Regla de oro: primero lee TODO, después actúa.','Al terminar, dilo con tus palabras: «me piden esto». Si no puedes, vuelve a leer.','En el trabajo, leer bien evita errores, regaños y accidentes.'],
        quiz:[
          { q:'¿Qué haces primero con una instrucción escrita?', o:['Leerla completa antes de actuar','Empezar a trabajar y leer después','Pedirle a otro que la lea por mí siempre'], a:0, e:'Leer todo primero te dice qué necesitas y en qué orden.' },
          { q:'¿Cómo compruebas que entendiste un texto?', o:['Lo guardo en la bolsa','Lo digo con mis propias palabras','Lo leo en voz muy alta'], a:1, e:'Si puedes explicarlo con tus palabras, lo entendiste de verdad.' },
          { q:'Leer bien en la planta sirve para…', o:['Presumir','Perder menos tiempo en el descanso','Evitar errores y accidentes'], a:2, e:'Casi todos los errores empiezan por no leer o no entender una indicación.' } ] },
      { n:2, title:'Leer una instrucción de trabajo',
        lesson:['Una instrucción de trabajo tiene partes: título, advertencias y pasos numerados.','Las ADVERTENCIAS se leen primero: te dicen los riesgos y el EPP.','Los pasos van EN ORDEN: 1, 2, 3. No te saltes ninguno.','¿Un paso no se entiende? Detente y pregunta a tu responsable. Eso es profesional.'],
        quiz:[
          { q:'¿Qué parte de la instrucción lees primero?', o:['Los pasos, de atrás para adelante','Las advertencias y el EPP que pide','La firma del final'], a:1, e:'Las advertencias te cuidan: dicen el riesgo y la protección antes de empezar.' },
          { q:'La instrucción dice: paso 3, esperar 5 minutos. Tú vas rápido, ¿lo puedes saltar?', o:['Sí, si tengo prisa','Solo los viernes','No: los pasos van en orden y completos'], a:2, e:'Cada paso existe por una razón: saltarlo daña el producto o te pone en riesgo.' },
          { q:'Si un paso no se entiende…', o:['Me detengo y pregunto antes de seguir','Lo invento parecido','Lo hago como lo hacía en otro trabajo'], a:0, e:'Preguntar a tiempo cuesta un minuto; un error cuesta horas.' } ] },
      { n:3, title:'Señales y colores de la planta',
        lesson:['Los colores de las señales hablan: ROJO prohíbe o marca alto y fuego.','AMARILLO avisa precaución: piso mojado, alta temperatura, partes en movimiento.','AZUL obliga: usa casco, usa lentes, usa tapones.','VERDE guía a lo seguro: rutas de evacuación, salidas y botiquín.'],
        quiz:[
          { q:'Una señal AZUL con un casco significa…', o:['Prohibido pasar','Zona de descanso','Es obligatorio usar casco aquí'], a:2, e:'El azul manda: es una obligación, no una sugerencia.' },
          { q:'El color AMARILLO en una señal te dice…', o:['Precaución: hay un riesgo cerca','Que ya terminó el turno','Que ahí se come'], a:0, e:'Amarillo = atención: piso mojado, calor, máquinas en movimiento.' },
          { q:'Si suena la alarma, ¿qué color de señal sigues para salir?', o:['Rojo','Verde','Amarillo'], a:1, e:'El verde marca la ruta de evacuación y las salidas seguras.' } ] },
      { n:4, title:'Etiquetas y hojas de seguridad',
        lesson:['Toda etiqueta responde tres cosas: QUÉ es, QUÉ riesgo tiene y HASTA CUÁNDO sirve.','Busca el nombre, los pictogramas de peligro y la fecha de caducidad.','Si el producto trae pictograma de peligro, se maneja con EPP y ventilación.','¿Dudas de un químico? Pide su hoja de datos de seguridad (HDS). Es tu derecho.'],
        quiz:[
          { q:'En una etiqueta de cemento buscas…', o:['El precio','Nombre, pictogramas de peligro y caducidad','El país donde se hizo'], a:1, e:'Esas tres cosas te dicen qué es, qué riesgo tiene y si todavía sirve.' },
          { q:'Un bote trae pictograma de flama. Eso significa…', o:['Que se puede calentar sin problema','Que es refresco','Que es inflamable: lejos de chispas y calor'], a:2, e:'La flama avisa material inflamable: nada de chispas, flamas ni calor cerca.' },
          { q:'¿Dónde encuentras toda la información de un químico?', o:['En su hoja de datos de seguridad (HDS)','En internet, en cualquier página','Preguntando a un amigo'], a:0, e:'La HDS es el documento oficial: riesgos, EPP y qué hacer en emergencia.' } ] },
      { n:5, title:'Llenar un formato sin errores',
        lesson:['Los formatos se llenan con pluma y letra de molde, clara y sin prisas.','Datos que casi siempre piden: nombre completo, número de empleado, área y fecha.','No dejes espacios vacíos: si algo no aplica, escribe una raya o N/A.','Un formato bien llenado protege tu trabajo: es la prueba de lo que hiciste.'],
        quiz:[
          { q:'¿Con qué se llena un formato oficial?', o:['Con lápiz, por si me equivoco','Con pluma y letra de molde clara','Con plumón grueso'], a:1, e:'La pluma no se borra y la letra de molde la entiende cualquiera.' },
          { q:'Hay un campo que no aplica a tu caso. ¿Qué haces?', o:['Lo dejo vacío','Escribo cualquier cosa','Pongo una raya o N/A'], a:2, e:'Un espacio vacío otro lo puede llenar después: la raya te protege.' },
          { q:'Un formato bien llenado sirve para…', o:['Dejar constancia clara de lo que hiciste','Gastar papel','Que RRHH tenga trabajo'], a:0, e:'Es tu prueba: qué se hizo, quién, cuándo y cuánto.' } ] },
      { n:6, title:'Fechas, folios y correcciones',
        lesson:['La fecha se escribe completa: día, mes y año. Ejemplo: 02 de julio de 2026.','El FOLIO es el número único del documento: sirve para encontrarlo después.','¿Te equivocaste? Una sola línea encima, el dato correcto al lado y tu inicial.','Nunca uses corrector ni encimes números: se ve alterado y pierde valor.'],
        quiz:[
          { q:'¿Para qué sirve el folio de un vale?', o:['De adorno','Para encontrar y rastrear ese documento después','Para saber el precio'], a:1, e:'El folio es único: con él cualquiera ubica el documento en segundos.' },
          { q:'Escribiste mal una cantidad en un formato. Lo correcto es…', o:['Una línea encima, el dato correcto al lado y tu inicial','Taparlo con corrector','Encimar el número bueno sobre el malo'], a:0, e:'Así la corrección queda clara y honesta, sin parecer alterada.' },
          { q:'¿Cuál fecha está completa?', o:['Julio','02','02 de julio de 2026'], a:2, e:'Día, mes y año: sin los tres, la fecha no sirve para nada.' } ] },
      { n:7, title:'Escribir un reporte corto',
        lesson:['Un buen reporte contesta 4 preguntas: QUÉ pasó, DÓNDE, CUÁNDO y QUÉ viste tú.','Escribe hechos, no adivinanzas: «vi aceite bajo la prensa 2», no «alguien la descompuso».','Corto y claro gana: 3 o 4 frases bien puestas valen más que una hoja confusa.','Termina con tu nombre, tu número y la hora. Así tu aviso sí ayuda.'],
        quiz:[
          { q:'¿Qué contesta un buen reporte?', o:['Qué, dónde, cuándo y qué viste','Quién tiene la culpa','Qué opinan todos'], a:0, e:'Con esos cuatro datos, quien lo lea puede actuar de inmediato.' },
          { q:'¿Cuál frase es un HECHO?', o:['«Seguro fue el turno de la noche»','«Hay una fuga de aire en la línea 3, junto a la báscula»','«Esa máquina siempre ha sido mala»'], a:1, e:'Un hecho se puede ver y comprobar; las culpas y opiniones no ayudan.' },
          { q:'Un reporte corto y claro es mejor porque…', o:['Se ve bonito','Ahorra tinta','Se entiende rápido y se actúa rápido'], a:2, e:'En planta el tiempo cuenta: claridad rápida evita que el problema crezca.' } ] },
      { n:8, title:'Leer avisos y mensajes oficiales',
        lesson:['Un aviso de la empresa se lee COMPLETO: al final suele venir lo importante.','Al leerlo pregúntate dos cosas: ¿qué me pide? y ¿para cuándo?','En esta app, marca «Enterado» solo cuando de verdad lo leíste.','Si el aviso no te queda claro, pregunta a tu responsable o a RRHH antes del plazo.'],
        quiz:[
          { q:'Un aviso dice: «Entrega tu talla de uniforme antes del viernes». ¿Qué te pide y para cuándo?', o:['Nada, es informativo','Comprar uniforme el sábado','Dar mi talla, a más tardar el viernes'], a:2, e:'Qué: tu talla. Cuándo: antes del viernes. Eso es leer con propósito.' },
          { q:'¿Cuándo marcas «Enterado» en la app?', o:['Cuando ya leí y entendí el aviso','Apenas llega, sin abrirlo','Nunca'], a:0, e:'«Enterado» es tu palabra de que lo leíste; márcalo con honestidad.' },
          { q:'No entendiste una parte del aviso y el plazo es mañana…', o:['Dejo pasar el plazo','Pregunto hoy a mi responsable o a RRHH','Adivino qué querían decir'], a:1, e:'Preguntar antes del plazo te deja cumplir a tiempo y sin errores.' } ] },
      { n:9, title:'Tu firma vale: firma informado',
        lesson:['Tu firma es tu palabra por escrito: di que sí solo a lo que ya leíste.','Antes de firmar revisa: qué documento es, qué dice y qué cantidad o fecha trae.','Nunca firmes hojas en blanco ni documentos a medio llenar.','Pedir tiempo para leer o pedir copia NO es desconfianza: es tu derecho.'],
        quiz:[
          { q:'Firmar un documento significa…', o:['Que estás de acuerdo con lo que dice','Que tienes bonita letra','Nada importante'], a:0, e:'La firma te compromete: por eso primero se lee, luego se firma.' },
          { q:'Te piden firmar una hoja en blanco «para ahorrar tiempo»…', o:['La firmo si me lo pide alguien conocido','No la firmo: nunca se firma en blanco','La firmo chiquito'], a:1, e:'En una hoja en blanco pueden escribir lo que sea encima de tu firma.' },
          { q:'Antes de firmar un recibo, ¿qué revisas?', o:['El color de la tinta','Nada, firmo rápido','Que las cantidades y fechas sean correctas'], a:2, e:'Revisar cantidades y fechas te evita firmar algo que no corresponde.' } ] },
      { n:10, title:'Logro final: el vale completo',
        lesson:['Caso real: sacas 4 cubetas de cemento del almacén y llenas el vale de salida.','Escribes: fecha completa, material, cantidad con unidad (4 cubetas), tu nombre y número.','El almacenista entrega y firma; tú recibes y firmas. Dos firmas, cero dudas.','Ya sabes leer, llenar y firmar como profesional. Eso protege tu trabajo cada día.'],
        quiz:[
          { q:'En el vale, la cantidad se escribe…', o:['«Varias»','Con número y unidad: 4 cubetas','Como sea, luego se corrige'], a:1, e:'Número y unidad exactos: así el inventario cuadra y nadie te reclama.' },
          { q:'¿Por qué firman los dos: quien entrega y quien recibe?', o:['Para que quede claro qué salió y quién lo tiene','Por costumbre','Para gastar tinta'], a:0, e:'Dos firmas cierran la historia completa del material: sin huecos.' },
          { q:'Un vale bien llenado te protege porque…', o:['Se ve ordenado','Le gusta al jefe','Es la prueba de qué sacaste, cuánto y cuándo'], a:2, e:'Si algo falta después, tu vale habla por ti. ¡Completaste Lectura y escritura útil!' } ] }
    ] },
    { id:'matematicas', name:'Números para el trabajo', icon:'', tier:'normal', desc:'Medir, pesar, sacar porcentajes y leer básculas y vales.', levels:[
      { n:1, title:'Sumar y restar sin calculadora',
        lesson:['Truco para sumar rápido: por partes. 47 + 35 = 47 + 30 + 5 = 82.','Para restar, completa: de 68 a 100 van 32, porque 68 + 32 = 100.','Comprueba siempre al revés: si 82 − 35 = 47, tu suma estaba bien.','En conteos de almacén y producción, comprobar te salva de retrabajos.'],
        quiz:[
          { q:'¿Cuánto es 47 + 35?', o:['72','82','92'], a:1, e:'47 + 30 = 77, y 77 + 5 = 82. Por partes es más fácil.' },
          { q:'Contaste 100 piezas y entregas 68. ¿Cuántas quedan?', o:['32','42','38'], a:0, e:'De 68 a 100 van 32: completar a cien es un gran truco.' },
          { q:'¿Cómo compruebas que 82 es correcto en 47 + 35?', o:['Lo vuelvo a adivinar','No se puede comprobar','Resto: 82 − 35 debe dar 47'], a:2, e:'La resta es el espejo de la suma: si regresa al número, está bien.' } ] },
      { n:2, title:'Multiplicar y repartir en la planta',
        lesson:['Multiplicar es contar grupos iguales rápido: 6 tarimas de 25 cajas = 150 cajas.','Truco: 6 por 25 es 6 por 100 entre 4: 600 entre 4 = 150.','Dividir es repartir parejo: 120 bultos entre 3 turnos = 40 bultos por turno.','Con esto revisas embarques y repartos sin depender de nadie.'],
        quiz:[
          { q:'6 tarimas con 25 cajas cada una, ¿cuántas cajas son?', o:['125','150','175'], a:1, e:'6 por 25 = 150. Cuatro veinticincos hacen cien, y sobran dos: 150.' },
          { q:'120 bultos entre 3 turnos, ¿cuántos por turno?', o:['40','30','60'], a:0, e:'120 entre 3 = 40: reparto parejo para los tres turnos.' },
          { q:'¿Cuál operación usas para contar 8 filas de 12 llantas?', o:['Resta','Suma de uno en uno','Multiplicación: 8 por 12'], a:2, e:'8 por 12 = 96. Multiplicar es sumar grupos iguales, pero rápido.' } ] },
      { n:3, title:'Medir largo: metros, centímetros, milímetros',
        lesson:['1 metro = 100 centímetros. 1 centímetro = 10 milímetros.','El milímetro es la medida fina: el espesor de una banda se mide en mm.','Para medir bien: empieza en el CERO, flexómetro derecho y sin doblar.','Regla de la planta: mide dos veces, corta una. Así no hay desperdicio.'],
        quiz:[
          { q:'¿Cuántos milímetros tiene un metro?', o:['100','1000','10'], a:1, e:'1 m = 100 cm y cada cm = 10 mm: 100 por 10 = 1000 mm.' },
          { q:'El espesor fino de una banda se mide en…', o:['Milímetros','Litros','Kilos'], a:0, e:'Las medidas finas de largo y espesor van en milímetros.' },
          { q:'¿Por qué se mide dos veces antes de cortar?', o:['Para tardar más','Por costumbre','Para no desperdiciar material por una mala medida'], a:2, e:'Un corte malo no se puede pegar: revisar antes cuesta segundos.' } ] },
      { n:4, title:'Pesar bien: báscula y tara',
        lesson:['1 kilo = 1000 gramos. 1 tonelada = 1000 kilos. Los bultos de hule van en kilos.','La TARA es el peso del recipiente o la tarima: se resta para saber el peso neto.','Ejemplo: báscula marca 260 kg y la tarima pesa 20 kg. Neto = 240 kg de material.','Antes de pesar, revisa que la báscula marque cero vacía. Si no, avisa.'],
        quiz:[
          { q:'La báscula marca 260 kg con todo y tarima de 20 kg. ¿Cuánto material hay?', o:['280 kg','260 kg','240 kg'], a:2, e:'Neto = total menos tara: 260 − 20 = 240 kg de material.' },
          { q:'¿Qué es la tara?', o:['El peso del recipiente o tarima, que se resta','Un tipo de hule','El total de la venta'], a:0, e:'La tara no es producto: se resta para obtener el peso neto real.' },
          { q:'Antes de pesar, la báscula vacía debe marcar…', o:['Cualquier número','Cero','Mil'], a:1, e:'Si vacía no marca cero, todos tus pesos saldrán mal: se reporta.' } ] },
      { n:5, title:'Leer un vale con números',
        lesson:['Un vale trae: folio, fecha, material, CANTIDAD y UNIDAD (piezas, kg, metros).','La unidad importa: 12 piezas no es lo mismo que 12 kilos.','Al recibir, cuenta o pesa y compara contra el vale: debe cuadrar exacto.','¿No cuadra? No firmes todavía: avisa y que se corrija primero.'],
        quiz:[
          { q:'El vale dice «12 kg de hule cojín» y te entregan 12 piezas. ¿Está bien?', o:['Sí, doce es doce','No: la unidad no coincide, kilos no son piezas','Da igual'], a:1, e:'Cantidad Y unidad deben coincidir: 12 kg y 12 piezas son cosas distintas.' },
          { q:'¿Qué haces antes de firmar de recibido?', o:['Contar o pesar y comparar contra el vale','Firmar rápido para no hacer fila','Guardar el vale sin leerlo'], a:0, e:'Tu firma dice «recibí esto»: primero comprueba que sea cierto.' },
          { q:'Lo que recibiste no cuadra con el vale…', o:['Lo acomodo y ya','Firmo y luego veo','No firmo: aviso para que se corrija primero'], a:2, e:'Corregir antes de firmar es fácil; después de firmar, es problema.' } ] },
      { n:6, title:'Porcentajes fáciles',
        lesson:['Por ciento significa «de cada 100». 50% es la mitad, 25% la cuarta parte.','El 10% es facilísimo: quítale un cero. El 10% de 250 es 25.','Con el 10% armas los demás: 20% = dos veces el 10%. 5% = la mitad del 10%.','Ejemplo: 20% de 150 = 15 + 15 = 30.'],
        quiz:[
          { q:'¿Cuánto es el 10% de 250?', o:['25','2.5','50'], a:0, e:'Para el 10% solo quitas un cero: 250 pasa a 25.' },
          { q:'¿Cuánto es el 50% de 80?', o:['20','40','60'], a:1, e:'50% es la mitad: la mitad de 80 es 40.' },
          { q:'¿Cuánto es el 20% de 150?', o:['15','45','30'], a:2, e:'El 10% de 150 es 15, y el 20% es el doble: 30.' } ] },
      { n:7, title:'Porcentajes en tu trabajo',
        lesson:['Avance: la meta del día es 200 bandas y llevas 150. 150 de 200 = 75% de avance.','Merma: de 100 piezas, 2 salieron mal = 2% de merma. Mientras más bajo, mejor.','En la tienda también: 20% de descuento en 300 pesos = 60 pesos menos, pagas 240.','Los porcentajes te dicen si vas bien, en el trabajo y en tu bolsillo.'],
        quiz:[
          { q:'Meta: 200 piezas. Llevas 150. ¿Qué porcentaje de avance llevas?', o:['50%','75%','25%'], a:1, e:'150 de 200 es lo mismo que 75 de 100: 75%.' },
          { q:'De 100 piezas, 2 salieron con defecto. La merma es…', o:['2%','20%','12%'], a:0, e:'2 de cada 100 = 2%. En calidad, cada punto menos de merma cuenta.' },
          { q:'Chamarra de 300 pesos con 20% de descuento. ¿Cuánto pagas?', o:['280 pesos','260 pesos','240 pesos'], a:2, e:'El 20% de 300 es 60: 300 − 60 = 240 pesos.' } ] },
      { n:8, title:'El tiempo: turnos, horas y minutos',
        lesson:['1 hora = 60 minutos. Media hora = 30 minutos. Un cuarto de hora = 15.','Tu descanso de 30 min empieza a la 1:10: regresas a la 1:40.','De 7:00 a 15:30 hay 8 horas y media de jornada.','Llegar 10 minutos antes te da tiempo de EPP, vestidor y arrancar tranquilo.'],
        quiz:[
          { q:'Tu descanso de 30 minutos empieza a la 1:10. ¿A qué hora regresas?', o:['1:30','1:40','2:10'], a:1, e:'1:10 + 30 minutos = 1:40. Regresar a tiempo también es respeto al equipo.' },
          { q:'¿Cuántas horas hay de 7:00 a 15:30?', o:['8 horas y media','7 horas y media','9 horas'], a:0, e:'De 7 a 15 son 8 horas, más los 30 minutos: 8 horas y media.' },
          { q:'Llegar unos minutos antes del turno sirve para…', o:['Nada','Ganar puntos en la app','Ponerte el EPP y empezar sin carreras'], a:2, e:'Quien llega con calma trabaja seguro desde el primer minuto.' } ] },
      { n:9, title:'Promedios y metas',
        lesson:['El promedio reparte parejo: suma todo y divide entre los días.','Hiciste 90, 100 y 110 piezas en 3 días: 300 entre 3 = promedio de 100 diarias.','El promedio te dice tu ritmo real, no tu mejor día ni tu peor día.','Si tu promedio va abajo de la meta, se avisa a tiempo y se pide apoyo.'],
        quiz:[
          { q:'Hiciste 90, 100 y 110 en tres días. ¿Tu promedio diario?', o:['100','110','90'], a:0, e:'90 + 100 + 110 = 300, y 300 entre 3 días = 100.' },
          { q:'El promedio sirve para…', o:['Presumir el mejor día','Conocer tu ritmo real de varios días','Nada'], a:1, e:'Un día bueno o malo engaña; el promedio dice la verdad del ritmo.' },
          { q:'Tu promedio va abajo de la meta de la semana…', o:['Lo escondo','Espero a que me llamen','Aviso a tiempo y pido apoyo'], a:2, e:'Avisar temprano permite ayudarte: nadie mejora lo que no se conoce.' } ] },
      { n:10, title:'Logro final: los números de tu día',
        lesson:['Caso completo: recibes hule. La báscula marca 520 kg, la tarima pesa 20 kg.','Peso neto: 520 − 20 = 500 kg. El vale dice 500 kg: cuadra, firmas de recibido.','La meta del turno es 200 piezas y llevas 160: vas al 80%, buen ritmo.','Medir, pesar, comparar y avisar: ya dominas los números de tu trabajo.'],
        quiz:[
          { q:'Báscula: 520 kg. Tarima: 20 kg. ¿Peso neto de material?', o:['540 kg','500 kg','520 kg'], a:1, e:'520 − 20 = 500 kg netos: eso es lo que de verdad recibes.' },
          { q:'El vale dice 500 kg y tu neto fue 500 kg. ¿Qué haces?', o:['Cuadra: firmo de recibido','Vuelvo a pesar diez veces','No firmo nunca'], a:0, e:'Comparaste y cuadró: ahora tu firma sí dice la verdad.' },
          { q:'Meta 200, llevas 160. ¿Tu avance?', o:['60%','70%','80%'], a:2, e:'160 de 200 = 80 de cada 100 = 80%. ¡Completaste Números para el trabajo!' } ] }
    ] },
    { id:'hule', name:'El mundo del hule', icon:'', tier:'dificil', desc:'De dónde viene el hule, la vulcanización y cómo nace una banda.', levels:[
      { n:1, title:'¿De dónde viene el hule?',
        lesson:['El hule natural nace de un árbol: el árbol del hule. Se le hace un corte y suelta un líquido blanco llamado látex.','El látex se junta, se seca y se prensa: así se vuelve hule natural.','También existe hule sintético: se fabrica a partir del petróleo.','Nuestras bandas usan mezclas de hules: cada uno aporta algo, agarre, fuerza o duración.'],
        quiz:[
          { q:'El hule natural viene de…', o:['Una mina','Un árbol que suelta látex','El mar'], a:1, e:'Del árbol del hule sale el látex, un líquido blanco que se vuelve hule.' },
          { q:'El hule sintético se fabrica a partir de…', o:['Petróleo','Madera','Arena'], a:0, e:'El sintético nace en fábricas químicas, a partir del petróleo.' },
          { q:'¿Por qué las bandas mezclan varios hules?', o:['Para gastar más','Por tradición','Porque cada hule aporta algo: agarre, fuerza o duración'], a:2, e:'La mezcla correcta junta lo mejor de cada hule en una sola banda.' } ] },
      { n:2, title:'El hule verde: crudo y delicado',
        lesson:['Antes de cocerse, el hule se llama crudo o «verde»: suave, pegajoso y moldeable.','Como la masa antes del horno: se puede formar, pero también se echa a perder.','Por eso el hule verde se almacena con cuidado: limpio, sin sol directo y sin aplastarlo.','Si el hule verde se maltrata, la banda final sale con defectos. Tu cuidado se nota al final.'],
        quiz:[
          { q:'¿Cómo es el hule antes de vulcanizarse?', o:['Duro como piedra','Suave, pegajoso y moldeable','Líquido como agua'], a:1, e:'Crudo o «verde», el hule todavía es masa moldeable y delicada.' },
          { q:'El hule verde se parece a…', o:['La masa antes de hornear','Un pastel ya horneado','Un vaso de vidrio'], a:0, e:'Como la masa: se le da forma, pero hay que cuidarla antes del horno.' },
          { q:'Si el hule verde se maltrata en el almacén…', o:['No pasa nada','Se vuelve más fuerte','La banda final puede salir con defectos'], a:2, e:'Lo que le pase al hule crudo se hereda al producto final.' } ] },
      { n:3, title:'La receta del compuesto',
        lesson:['Hacer compuesto de hule es como cocinar: cada banda tiene su receta exacta.','Lleva caucho, negro de humo (da la fuerza y el color negro), aceites, azufre y acelerantes.','El mezclador Banbury amasa todo con temperatura y tiempos controlados.','Si la receta o el orden cambian, la banda cambia. Por eso se respeta al pie de la letra.'],
        quiz:[
          { q:'¿Qué le da al hule su fuerza y su color negro?', o:['El negro de humo','La pintura','El agua'], a:0, e:'El negro de humo refuerza el hule y por él las llantas son negras.' },
          { q:'¿Qué máquina mezcla el compuesto?', o:['La báscula','El mezclador Banbury','El montacargas'], a:1, e:'El Banbury amasa caucho, negro de humo, aceites y aditivos.' },
          { q:'¿Por qué se respeta la receta exacta?', o:['Por capricho del laboratorio','Para acabar más temprano','Porque si cambia la receta, cambia la calidad de la banda'], a:2, e:'La receta es la garantía: misma receta, misma calidad, siempre.' } ] },
      { n:4, title:'La vulcanización, explicada fácil',
        lesson:['En 1839, Charles Goodyear descubrió por accidente que hule con azufre y calor cambia para siempre.','Eso es vulcanizar: calor + azufre + presión transforman el hule por dentro.','Antes: masa pegajosa que se deforma. Después: material elástico, firme y resistente.','Es como hornear un pastel: ya horneado, nunca vuelve a ser masa. El hule vulcanizado tampoco.'],
        quiz:[
          { q:'¿Qué necesita el hule para vulcanizarse?', o:['Hielo y sal','Calor, azufre y presión','Agua y jabón'], a:1, e:'Esa combinación transforma el hule por dentro, para siempre.' },
          { q:'¿Cómo queda el hule después de vulcanizar?', o:['Elástico, firme y resistente','Más pegajoso','Líquido'], a:0, e:'Deja de ser masa: ya es material fuerte que aguanta camino.' },
          { q:'¿El hule vulcanizado puede volver a ser masa cruda?', o:['Sí, con agua fría','Sí, dejándolo reposar','No: el cambio es para siempre, como un pastel horneado'], a:2, e:'Por eso hay que hacerlo bien a la primera: no hay reversa.' } ] },
      { n:5, title:'¿Qué es la banda de precurado?',
        lesson:['La banda de precurado es la banda de rodamiento que ya viene vulcanizada ANTES de aplicarse.','Sale de nuestra prensa con su dibujo listo y su calidad pareja, revisada pieza por pieza.','Eso es Hules Banda: fabricamos esa banda y la enviamos a los renovadores.','Ellos la aplican sobre llantas usadas. Nosotros no renovamos llantas ni las vendemos: hacemos el corazón del renovado.'],
        quiz:[
          { q:'«Precurado» quiere decir que la banda…', o:['Ya está vulcanizada y con dibujo antes de aplicarse','Está a medio cocer','Se cura en el camión'], a:0, e:'Pre = antes. Se vulcaniza antes, y por eso llega pareja y lista.' },
          { q:'¿Qué hace exactamente Hules Banda?', o:['Renueva llantas en talleres','Fabrica la banda de precurado para los renovadores','Vende llantas nuevas'], a:1, e:'Fabricamos la banda; los renovadores la aplican a las llantas.' },
          { q:'¿Por qué la banda precurada sale con calidad pareja?', o:['Por suerte','Porque se pinta al final','Porque se vulcaniza en prensa controlada y se revisa pieza por pieza'], a:2, e:'Prensa controlada + inspección = la misma calidad en cada metro.' } ] },
      { n:6, title:'La llanta y sus partes',
        lesson:['Banda de rodamiento: el hule con dibujo que toca el camino. Es la que fabricamos.','Costado: la cara lateral; ahí van grabados la medida y los datos de la llanta.','Carcasa: el esqueleto interno de cuerdas; es la parte más valiosa y duradera.','Talón: el aro que amarra la llanta al rin. Una carcasa sana puede vivir varias vidas.'],
        quiz:[
          { q:'¿Qué parte de la llanta toca el camino?', o:['El talón','La banda de rodamiento','La carcasa'], a:1, e:'La banda de rodamiento: el hule con dibujo que fabricamos aquí.' },
          { q:'¿Cuál es «el esqueleto» de la llanta?', o:['La carcasa','El costado','El rin'], a:0, e:'La carcasa de cuerdas da la forma y la fuerza: es lo más valioso.' },
          { q:'¿Por qué la carcasa es tan valiosa?', o:['Porque brilla','Porque pesa mucho','Porque en buen estado aguanta varias renovaciones'], a:2, e:'Una buena carcasa se renueva varias veces: varias vidas útiles.' } ] },
      { n:7, title:'Cómo se renueva una llanta',
        lesson:['El renovador inspecciona la llanta usada: si la carcasa está sana, se renueva.','Luego raspa la banda gastada y repara los daños pequeños.','Aplica cemento y hule cojín, y encima monta nuestra banda de precurado.','Al final la envuelve y la mete al autoclave: calor y presión pegan todo. Queda como nueva para rodar.'],
        quiz:[
          { q:'¿Qué se revisa primero para decidir si una llanta se renueva?', o:['El estado de la carcasa','El color del rin','La marca del camión'], a:0, e:'Sin carcasa sana no hay renovado: es la base de todo.' },
          { q:'¿Qué une la banda de precurado con la carcasa?', o:['Clavos','Cemento y hule cojín, sellados en el autoclave','Cinta adhesiva'], a:1, e:'Cemento + hule cojín + calor y presión del autoclave: unión firme.' },
          { q:'En el renovado, ¿cuál pieza pone Hules Banda?', o:['El rin','El aire','La banda de precurado con su dibujo'], a:2, e:'Nuestra banda es el corazón del renovado que hace el cliente.' } ] },
      { n:8, title:'Por qué renovar conviene',
        lesson:['Renovar cuesta mucho menos que comprar llanta nueva, con desempeño comparable.','Los transportistas ahorran, y por eso las flotas renuevan sus llantas una y otra vez.','El planeta también gana: se aprovecha la carcasa, se gasta menos hule y menos petróleo.','Y hay menos llantas tiradas en basureros. Renovar es negocio inteligente y limpio.'],
        quiz:[
          { q:'¿Por qué las flotas de camiones renuevan llantas?', o:['Por moda','Porque cuesta mucho menos que llanta nueva y rinde bien','Porque es obligatorio'], a:1, e:'El ahorro es el gran argumento: menos costo por kilómetro.' },
          { q:'¿Qué gana el planeta con el renovado?', o:['Menos petróleo gastado y menos llantas en la basura','Más humo','Nada'], a:0, e:'Se reutiliza la carcasa: menos material nuevo y menos desechos.' },
          { q:'¿Qué parte se aprovecha otra vez al renovar?', o:['El aire','El dibujo viejo','La carcasa en buen estado'], a:2, e:'La carcasa vive de nuevo con cada banda que se le aplica.' } ] },
      { n:9, title:'Tu trabajo rueda por el mundo',
        lesson:['Las bandas que salen de esta planta ruedan en más de 50 países.','Cada banda lleva el trabajo de tus manos: tu mezcla, tu medida, tu inspección.','Calidad constante = clientes que regresan = más pedidos = empleo estable para todos.','Aquí tu esfuerzo sí tiene destino: mueve camiones en medio mundo. Es para sentirse orgulloso.'],
        quiz:[
          { q:'¿Hasta dónde llegan las bandas de esta planta?', o:['Solo a la ciudad','Solo a México','A más de 50 países'], a:2, e:'Lo que haces hoy puede rodar mañana en otro continente.' },
          { q:'¿Qué pasa cuando la calidad es constante?', o:['Los clientes regresan y hay más pedidos y empleo estable','Se trabaja menos','Nada'], a:0, e:'Calidad hoy = trabajo seguro mañana. Así de directo.' },
          { q:'¿Quién es parte de esa calidad?', o:['Solo el laboratorio','Tú, en cada mezcla, medida e inspección','Solo los jefes'], a:1, e:'La calidad se hace en cada puesto: también en el tuyo.' } ] },
      { n:10, title:'Logro final: explícalo tú',
        lesson:['Imagina que un amigo te pregunta: ¿y tú qué haces en Hules Banda?','Tu respuesta: «Fabricamos banda de precurado: hule vulcanizado con dibujo, para renovar llantas de camión».','«Renovar ahorra dinero porque la carcasa se usa varias veces, y cuida el planeta».','Si lo puedes explicar así de claro, ya es tuyo. Bienvenido al mundo del hule.'],
        quiz:[
          { q:'¿Cuál resumen es correcto?', o:['«Vendemos llantas nuevas»','«Fabricamos la banda vulcanizada que sirve para renovar llantas»','«Reparamos camiones»'], a:1, e:'Ese es nuestro oficio: la banda de precurado, corazón del renovado.' },
          { q:'¿Por qué el renovado ahorra dinero?', o:['Porque la carcasa buena se aprovecha varias veces','Porque las llantas son de regalo','Porque no se usa hule'], a:0, e:'Reusar la carcasa evita pagar una llanta nueva completa.' },
          { q:'El orden correcto para fabricar la banda es…', o:['Empacar, mezclar, vulcanizar','Vulcanizar, mezclar, inspeccionar','Mezclar el compuesto, formar el dibujo, vulcanizar e inspeccionar'], a:2, e:'Mezcla, forma, vulcanizado e inspección. ¡Completaste El mundo del hule!' } ] }
    ] },
    { id:'salud', name:'Salud y dinero en casa', icon:'', tier:'normal', desc:'Presupuesto, ahorro, IMSS, aguinaldo y tus derechos básicos.', levels:[
      { n:1, title:'Tu presupuesto en 3 pasos',
        lesson:['Presupuesto es saber cuánto entra, cuánto sale y decidir tú, antes de que el dinero decida solo.','Paso 1: apunta lo que entra en el mes. Paso 2: apunta lo que sale.','Paso 3: primero lo necesario (comida, renta, transporte, escuela), luego lo demás.','Con una libreta o el celular basta: 10 minutos por semana cambian tu quincena.'],
        quiz:[
          { q:'¿Qué es un presupuesto?', o:['Un préstamo del banco','Saber qué entra, qué sale y decidir tú tu dinero','Una multa'], a:1, e:'Es tu mapa del dinero: sin mapa, el dinero se pierde solo.' },
          { q:'¿Qué se paga primero en el presupuesto?', o:['Lo necesario: comida, renta, transporte','Los antojos','Las apuestas'], a:0, e:'Primero lo que sostiene tu casa; los gustos van después.' },
          { q:'¿Qué necesitas para empezar tu presupuesto?', o:['Un contador','Mucho dinero','Una libreta o el celular y 10 minutos'], a:2, e:'Empezar es simple: apuntar. Lo que se apunta, se controla.' } ] },
      { n:2, title:'El ahorro que sí se logra',
        lesson:['El truco de los que sí ahorran: apartar PRIMERO, gastar después. Se llama pagarte a ti primero.','Al cobrar, guarda de inmediato una parte, aunque sea el 5 o el 10%.','Ese guardadito es para emergencias: una medicina, una reparación, un imprevisto.','Con guardadito no pides prestado con intereses: tu propio dinero te rescata.'],
        quiz:[
          { q:'¿Cuándo se aparta el dinero del ahorro?', o:['Al cobrar, antes de gastar','Al final, si sobra algo','Nunca'], a:0, e:'Si esperas a que sobre, nunca sobra: primero se aparta.' },
          { q:'¿Para qué sirve el guardadito de emergencias?', o:['Para fiestas','Para imprevistos: medicina, reparación, urgencia','Para prestárselo a todos'], a:1, e:'Es tu colchón: te salva sin deudas cuando algo falla.' },
          { q:'Con guardadito, ante una emergencia…', o:['Pides prestado con intereses','Vendes tus cosas','Usas tu propio dinero y no debes nada'], a:2, e:'Tu ahorro trabaja para ti justo cuando más lo necesitas.' } ] },
      { n:3, title:'Deudas e intereses, con cuidado',
        lesson:['Pedir prestado no es malo; lo malo es pedir sin plan. Todo préstamo se paga, y con intereses.','El interés es lo que pagas DE MÁS: pides 1000 y regresas 1300; esos 300 son interés.','Regla sana: deuda solo para lo importante, no para antojos, y sabiendo cuándo y cuánto pagarás.','Cuidado con préstamos «fáciles» por teléfono o apps desconocidas: suelen cobrar carísimo.'],
        quiz:[
          { q:'Pides 1000 pesos y regresas 1300. ¿Cuánto pagaste de interés?', o:['1300','300','30'], a:1, e:'Los 300 extra son el costo del préstamo: eso es el interés.' },
          { q:'¿Para qué conviene endeudarse?', o:['Solo para cosas importantes y con plan de pago','Para antojos del fin de semana','Para apostar'], a:0, e:'Deuda con plan es herramienta; deuda sin plan es problema.' },
          { q:'Una app desconocida te ofrece dinero «fácil y al momento»…', o:['Acepto rápido','Doy todos mis datos','Desconfío: suelen cobrar carísimo y presionar feo'], a:2, e:'Lo «fácil» sale caro: compara y pide solo en lugares serios.' } ] },
      { n:4, title:'Tu IMSS: qué te da',
        lesson:['Al trabajar aquí estás inscrito en el IMSS: es tu seguro por ley, la empresa lo paga contigo.','Te da atención médica y medicinas para ti y tu familia registrada (pareja e hijos).','Cubre incapacidades: si te enfermas o accidentas, el IMSS protege parte de tu ingreso.','Tu NSS (número de seguridad social) es único de por vida: tenlo a la mano, RRHH te ayuda a ubicarlo.'],
        quiz:[
          { q:'¿Quiénes pueden recibir atención médica con tu IMSS?', o:['Solo tú','Tú y tu familia registrada','Solo los jefes'], a:1, e:'Registra a tu pareja e hijos: el beneficio también es para ellos.' },
          { q:'¿Qué es el NSS?', o:['Tu número de seguridad social, único de por vida','El número de tu casillero','Una contraseña del celular'], a:0, e:'Con tu NSS existes en el IMSS: guárdalo como tu credencial.' },
          { q:'Si te enfermas y no puedes trabajar…', o:['Pierdes todo tu ingreso siempre','Te despiden por ley','El IMSS te da incapacidad y protege parte de tu ingreso'], a:2, e:'Para eso es el seguro: enfermarte no debe arruinarte.' } ] },
      { n:5, title:'Accidentes e incapacidades: qué hacer',
        lesson:['¿Accidente en el trabajo? Primero atenderte; avisa DE INMEDIATO a tu responsable y a RRHH.','Reportarlo el mismo día protege tus derechos: así queda como riesgo de trabajo.','Si el médico del IMSS te da incapacidad, es tu derecho: descansa y entrégala a RRHH a tiempo.','No vengas a trabajar enfermo o lastimado «para no faltar»: te dañas tú y arriesgas al equipo.'],
        quiz:[
          { q:'Te lastimas en la planta. ¿Qué haces primero?', o:['Atenderme y avisar de inmediato a mi responsable','Esconderlo para no dar molestias','Esperar a la próxima semana'], a:0, e:'Avisar el mismo día te protege médica y legalmente.' },
          { q:'¿Qué haces con el papel de incapacidad del IMSS?', o:['Lo tiro','Lo entrego a RRHH a tiempo y descanso lo indicado','Lo guardo de recuerdo'], a:1, e:'Entregarlo a tiempo asegura tu pago y tu tranquilidad.' },
          { q:'Venir a trabajar muy enfermo «para no faltar» es…', o:['Muy valiente y correcto','Obligatorio','Mala idea: te dañas tú y arriesgas al equipo'], a:2, e:'Cuidarte también es cuidar la producción: recupérate bien.' } ] },
      { n:6, title:'Aguinaldo, vacaciones y prima',
        lesson:['El aguinaldo es tu derecho: mínimo 15 días de salario, pagado antes del 20 de diciembre.','Vacaciones por ley: desde tu primer año tienes al menos 12 días pagados, y suben con la antigüedad.','Además, la prima vacacional: un dinero extra (mínimo 25%) para disfrutar tus vacaciones.','Tip: planea tu aguinaldo antes de recibirlo; si no, se va solo en diciembre.'],
        quiz:[
          { q:'¿Cuándo se paga el aguinaldo a más tardar?', o:['Antes del 20 de diciembre','El 6 de enero','Cuando sobre'], a:0, e:'Por ley llega antes del 20 de diciembre: mínimo 15 días de salario.' },
          { q:'Desde tu primer año trabajado tienes derecho a…', o:['0 días de vacaciones','Al menos 12 días pagados','2 días'], a:1, e:'La ley marca mínimo 12 días desde el primer año, y van subiendo.' },
          { q:'¿Qué es la prima vacacional?', o:['Una multa','Tu prima que trabaja aquí','Dinero extra para disfrutar tus vacaciones'], a:2, e:'Mínimo el 25% extra sobre los días de vacaciones: es tu derecho.' } ] },
      { n:7, title:'Tu recibo de nómina y tus horas',
        lesson:['Tu recibo tiene tres partes: percepciones (lo que ganas), deducciones (IMSS, impuestos) y neto (lo que recibes).','Revísalo cada pago: días, horas extra y descuentos deben cuadrar con tu realidad.','Las horas extra se pagan MÁS que las normales: por ley, las primeras se pagan al doble.','También por ley descansas al menos un día por cada seis trabajados. ¿Dudas? RRHH te lo explica sin pena.'],
        quiz:[
          { q:'El «neto» de tu recibo es…', o:['Lo que ganas antes de descuentos','Lo que de verdad recibes ya con descuentos','Un impuesto'], a:1, e:'Percepciones menos deducciones = neto, lo que llega a tu bolsa.' },
          { q:'Las primeras horas extra se pagan…', o:['Al doble de la hora normal','Igual que las normales','No se pagan'], a:0, e:'La ley lo marca: tiempo extra vale más que tiempo normal.' },
          { q:'Algo en tu recibo no te cuadra. ¿Qué haces?', o:['Nada, ni modo','Me enojo en el pasillo','Pregunto a RRHH con mi recibo en la mano'], a:2, e:'Preguntar es tu derecho: los números de tu pago deben quedarte claros.' } ] },
      { n:8, title:'Afore e Infonavit: tu futuro se construye hoy',
        lesson:['Tu Afore es tu ahorro para el retiro: cada pago, una parte se deposita a tu nombre. Es TU dinero.','Ubica en qué Afore estás y revisa tu estado de cuenta; RRHH te orienta para localizarla.','Infonavit junta puntos mientras trabajas formal: con ellos puedes lograr un crédito para tu casa.','Cada semana cotizada aquí suma para tu retiro y tu vivienda. Trabajo formal = futuro que se construye solo.'],
        quiz:[
          { q:'¿Qué es la Afore?', o:['Un impuesto perdido','Una tienda','Tu cuenta personal de ahorro para el retiro'], a:2, e:'Ese dinero es tuyo y te espera: conviene saber dónde está.' },
          { q:'¿Qué junta Infonavit mientras trabajas formal?', o:['Puntos para poder lograr un crédito de vivienda','Vales de gasolina','Boletos de rifa'], a:0, e:'Cada bimestre cotizado suma puntos rumbo a tu casa.' },
          { q:'¿Qué gana tu futuro con cada semana que cotizas aquí?', o:['Nada','Suma para tu retiro y tu vivienda','Solo cansancio'], a:1, e:'El empleo formal construye en silencio: Afore, Infonavit y servicio médico.' } ] },
      { n:9, title:'Cuerpo fuerte para el turno',
        lesson:['Dormir 7 u 8 horas no es flojera: es mantenimiento de tu cuerpo, igual que a las máquinas.','Desayuna antes del turno y toma agua durante el día, más cuando hace calor.','Desvelo y alcohol antes de trabajar = reflejos lentos = accidentes. No se juega con eso.','Cuida tu espalda: dobla rodillas para cargar y pide ayuda con lo muy pesado.'],
        quiz:[
          { q:'Dormir bien antes del turno sirve para…', o:['Nada','Tener reflejos y evitar accidentes','Soñar bonito'], a:1, e:'El cansancio hace lentas tus reacciones: dormir es seguridad.' },
          { q:'¿Cómo se carga algo pesado sin lastimarte?', o:['Doblando rodillas, carga pegada al cuerpo, o pidiendo ayuda','Doblando la espalda rápido','De un jalón con una mano'], a:0, e:'Rodillas dobladas y espalda recta; lo muy pesado, entre dos.' },
          { q:'Llegar desvelado o con copas al turno…', o:['No afecta','Te hace más rápido','Es peligroso para ti y para tus compañeros'], a:2, e:'Tus reflejos protegen a todos: llega descansado y despejado.' } ] },
      { n:10, title:'Logro final: tu plan sencillo de vida',
        lesson:['Tu plan en cinco líneas: 1) Presupuesto en libreta. 2) Ahorro apartado al cobrar.','3) Guardadito para emergencias. 4) Derechos claros: IMSS, aguinaldo, vacaciones, Afore.','5) Cuerpo cuidado: sueño, comida, agua y cargas bien hechas.','Trabajador sano, con dinero en orden y derechos claros, vive mejor y trabaja mejor. Ese es el plan.'],
        quiz:[
          { q:'¿Cuál es el orden sano del dinero al cobrar?', o:['Apartar ahorro, pagar lo necesario y luego gustos','Gustos primero, deudas después','Prestarlo todo'], a:0, e:'Apartar primero y pagar lo necesario: así siempre alcanza.' },
          { q:'¿Cuáles son derechos tuyos por trabajar formal?', o:['Ninguno','IMSS, aguinaldo, vacaciones con prima y Afore','Solo el uniforme'], a:1, e:'Conocer tus derechos te da tranquilidad y te protege.' },
          { q:'¿Quién es el responsable número uno de tu salud y tu dinero?', o:['El gobierno','La suerte','Tú, con buenos hábitos y buena información'], a:2, e:'Tú decides, y ya tienes las herramientas. ¡Completaste Salud y dinero en casa!' } ] }
    ] },
    { id:'comunicacion', name:'Comunicación en el trabajo', icon:'', tier:'normal', desc:'Reportar problemas, pedir ayuda y trabajar en equipo.', levels:[
      { n:1, title:'Hablar claro y con respeto',
        lesson:['Hablar claro es decir lo importante primero, con frases cortas y de frente.','El respeto abre puertas: saluda, mira a la persona y usa «por favor» y «gracias».','Claro no es grosero: se puede decir todo, si se dice bien.','En la planta hay ruido y prisa: mensaje corto y claro vale oro.'],
        quiz:[
          { q:'Hablar claro es…', o:['Decir lo importante primero y corto','Hablar bonito y largo','Gritar'], a:0, e:'Lo importante primero: así el mensaje llega aunque haya prisa.' },
          { q:'¿Qué NO puede faltar al comunicarte?', o:['Palabras rebuscadas','El respeto: saludo, por favor y gracias','Un megáfono'], a:1, e:'El respeto hace que te escuchen con ganas de ayudarte.' },
          { q:'¿Se puede decir algo incómodo con respeto?', o:['No, mejor callarse','Solo por escrito','Sí: todo se puede decir si se dice bien'], a:2, e:'Decir las cosas a tiempo y con respeto evita problemas grandes.' } ] },
      { n:2, title:'Escuchar de verdad',
        lesson:['Escuchar no es esperar tu turno para hablar: es poner atención completa.','Deja lo que traes en las manos un momento y mira a quien te habla.','Al final, confirma con tus palabras: «Entonces, ¿quieres que lleve esto a calidad?»','Quien confirma, no se equivoca dos veces.'],
        quiz:[
          { q:'Escuchar de verdad es…', o:['Pensar en otra cosa','Poner atención completa a quien habla','Interrumpir rápido'], a:1, e:'Atención completa: los errores nacen de escuchar a medias.' },

<script>
/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bandi(cls){ return ''; }   /* mascota retirada: la app es corporativa, sin personaje */
function flash(t){ var f=$('flash'); f.textContent=t; f.classList.add('show'); clearTimeout(f._t); f._t=setTimeout(function(){f.classList.remove('show');},2100); }

/* ---------- estado en memoria (progreso del usuario se guarda en el dispositivo) ---------- */
var S = null;          // sesión actual
var cur = {};          // pantalla de curso/quiz en curso
var HBKEY = '';        // API key opcional para IA real

function rangeOf(n){ for(var i=0;i<CFG.ranges.length;i++){ var r=CFG.ranges[i]; if(n>=r.min && n<=r.max) return r; } return null; }
function level(){ return Math.floor(S.points/CFG.points.perLevel)+1; }
function levelName(){ return CFG.levels[Math.min(level()-1,CFG.levels.length-1)]; }
function myCourses(){ return CFG.common.concat(CFG.areas[S.key]||[]); }
function statusOf(id){ return S.done[id]; }
function doneCount(){ var c=myCourses(),n=0; for(var i=0;i<c.length;i++) if(S.done[c[i].id]) n++; return n; }

/* ---------- persistencia (localStorage; si no está disponible, queda en memoria) ---------- */
function save(){ try{ localStorage.setItem('hb_'+S.emp, JSON.stringify({points:S.points,streak:S.streak,done:S.done,attempts:S.attempts,best:S.best,redeemed:S.redeemed,role:S.role,clases:S.clases,accessible:S.accessible,rate:S.rate,watched:S.watched})); }catch(e){} }
function load(emp){ try{ var d=localStorage.getItem('hb_'+emp); return d?JSON.parse(d):null; }catch(e){ return null; } }

/* ====================== LOGIN ====================== */
function buildLoginHelp(){
  var demos=[['250','Operativo'],['905','RRHH'],['990','Dirección (CEO)'],['950','Resp. Producción'],['920','Resp. Almacén'],['150','Inventario'],['700','Maquinaria']];
  var row=$('tryRow'); var h='<b>Probar como…</b>';
  demos.forEach(function(d){ h+='<button class="tryc" onclick="quickLogin(\''+d[0]+'\')">'+d[1]+' <i>'+d[0]+'</i></button>'; });
  row.innerHTML=h;
  var rh=CFG.ranges.map(function(r){ var a=(''+r.min).padStart(3,'0'), b=(''+r.max).padStart(3,'0'); return '<b>'+r.area+'</b> '+a+'–'+b; }).join(' · ');
  $('loginHint').innerHTML='Rangos de número de empleado:<br>'+rh+'<br><br>Tip: en tu celular usa <b>Compartir → “Agregar a pantalla de inicio”</b> para instalar la app. Funciona sin internet.';
}
function quickLogin(id){ $('inEmp').value=id; login(); }
/* ===== Perfil por empleado (foto · datos · PIN) — por dispositivo (demo); Fase 2: servidor ===== */
function profGet(emp){ try{ return JSON.parse(localStorage.getItem('hb_profile_'+emp)||'{}')||{}; }catch(e){ return {}; } }
function profSave(emp,p){ try{ localStorage.setItem('hb_profile_'+emp, JSON.stringify(p)); }catch(e){ flash('No se pudo guardar (espacio lleno)'); } }
function profInitials(){ var p=profGet(S.emp); var nm=(p.nombre||'').trim();
  if(nm){ return nm.split(/\s+/).map(function(w){return (w[0]||'');}).slice(0,2).join('').toUpperCase(); }
  return (''+S.emp).padStart(3,'0'); }
function profAvatar(size,fs){ var p=profGet(S.emp);
  if(p.foto) return '<img src="'+p.foto+'" alt="foto" style="width:'+size+'px;height:'+size+'px;border-radius:12px;object-fit:cover;flex:none;display:block">';
  return '<span style="width:'+size+'px;height:'+size+'px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:'+fs+'px;color:#fff;background:linear-gradient(150deg,var(--accent),var(--accent2))">'+esc(profInitials())+'</span>'; }
function login(){
  var raw=($('inEmp').value||'').trim(); var n=parseInt(raw,10);
  if(!raw || isNaN(n)){ flash('Escribe tu número de empleado'); return; }
  var r=rangeOf(n);
  if(!r){ flash('Ese número no tiene portal asignado'); return; }
  // PIN: si este ID ya creó su PIN (en este dispositivo), se pide para entrar
  var _prof=profGet(n);
  if(_prof.pin){
    var pf=$('pinField'), pv=(($('inPin')||{}).value||'').trim();
    if(pf && pf.style.display==='none'){ pf.style.display=''; $('inPin').focus(); flash('Escribe tu PIN de 4 dígitos'); return; }
    if(pv!==_prof.pin){ flash('PIN incorrecto'); return; }
  }
  // construir sesión + cargar progreso guardado
  var saved=load(n)||{};
  S={ emp:n, key:r.key, area:r.area, icon:r.icon, accent:r.accent, accent2:r.accent2, admin:!!r.admin, dash:(r.dash||null), greet:r.greet,
      points:saved.points||0, streak:saved.streak||0, done:saved.done||{}, attempts:saved.attempts||{}, best:saved.best||{}, watched:saved.watched||{},
      redeemed:saved.redeemed||{}, role:(saved.role||(r.admin?'admin_demo':(r.key==='almacen'?'almacen':CFG.defaultRole))), clases:(saved.clases||{}), accessible:!!saved.accessible, rate:saved.rate||0.78, chat:[] };
  // demo: sembrar algo de avance (solo si el usuario no tiene progreso) para que se vean las barras
  if(!S.admin && !saved.points && !Object.keys(S.done).length){
    var _mc=myCourses();
    if(_mc[0]){ S.done[_mc[0].id]=1; S.watched[_mc[0].id]=1; }
    if(_mc[1]){ S.done[_mc[1].id]=1; S.watched[_mc[1].id]=1; }
    S.points=180; S.streak=3;
  }
  // aplicar color de acento del área
  document.documentElement.style.setProperty('--accent', r.accent);
  document.documentElement.style.setProperty('--accent2', r.accent2);
  document.querySelector('meta[name=theme-color]').setAttribute('content', r.accent);
  $('s-login').classList.add('hide');
  $('topbar').classList.remove('hide'); $('main').classList.remove('hide'); $('nav').classList.remove('hide');
  buildNav(); renderTop();
  // saludo de bienvenida en el chat
  S.chat.push({role:'assistant',content:'Hola. Soy el asistente de planta. Pregúntame sobre seguridad, procesos, producto, la empresa o tu capacitación.'});
  applyA11y();
  document.body.classList.toggle('admin', !!S.admin);   // management en computadora = modo página web
  // limpiar overlays que pudieran haber quedado abiertos (p. ej. al cambiar de usuario en demo)
  ['lockScreen','beepScreen'].forEach(function(id){ var el=$(id); if(el) el.classList.add('hide'); });
  if(typeof beepStop==='function') beepStop();
  if(!S.admin){ checkPage(); if(!window._pagePoll) window._pagePoll=setInterval(checkPage,3000); }
  if(S.admin) renderDash(); else renderHome();
}
function logout(){ location.reload(); }
function resetProgress(){
  if(!confirm('¿Reiniciar tu progreso (puntos, cursos y canjes)? No se puede deshacer.')) return;
  try{ localStorage.removeItem('hb_'+S.emp); }catch(e){}
  S.points=0; S.streak=0; S.done={}; S.attempts={}; S.best={}; S.redeemed={}; S.watched={};
  flash('Progreso reiniciado'); renderHome();
}

/* ===== Protección básica del código (disuasión en el navegador) =====
   Bloquea clic derecho, doble clic y los atajos de "inspeccionar"/"ver código".
   OJO: es disuasión para el usuario común; la protección real llega con la
   Fase 2 (PIN + reglas en el servidor). */
document.addEventListener('contextmenu',function(e){ e.preventDefault(); },true);
document.addEventListener('dblclick',function(e){ var tg=(e.target.tagName||''); if(tg!=='INPUT'&&tg!=='TEXTAREA') e.preventDefault(); },true);
document.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase();
  if(e.key==='F12'){ e.preventDefault(); return; }
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && !e.altKey && (k==='u'||k==='s')){ e.preventDefault(); return; }
  if((e.ctrlKey||e.metaKey) && (e.shiftKey||e.altKey) && (k==='i'||k==='j'||k==='c'||k==='k')){ e.preventDefault(); return; }
},true);

function show(name){
  _screen=name;
  SCREENS.forEach(function(s){ var el=$('s-'+s); if(el) el.classList.toggle('hide', s!==name); });
  // nav activo (course/quiz/result/pay cuentan como "home")
  var navKey = (name==='courses'||name==='course'||name==='quiz'||name==='result'||name==='pay') ? 'home' : ((name==='thread'||name==='lineas'||name==='newchat'||name==='vac'||name==='quejas')?'msgs':((name==='encuestas'||name==='nom35'||name==='perm')?'news':(name==='perfil'?(S.admin?'hr':'home'):name)));
  ['home','msgs','rewards','chat','hr','clases','news','buzon'].forEach(function(k){ var b=$('nav-'+k); if(b) b.classList.toggle('on', k===navKey); });
  renderTop(name);
  window.scrollTo(0,0);
  var el=$('s-'+name); if(el){ el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); }
  if(typeof updateMsgBadge==='function') updateMsgBadge();
}
function go(name){
  if(name==='home') return renderHome();
  if(name==='rewards') return renderRewards();
  if(name==='chat') return renderChat();
  if(name==='hr') return renderDash();
  if(name==='clases') return renderClases();
  if(name==='news') return renderNews();
  if(name==='msgs') return renderMsgs();

function renderTop(name){

  var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';

/* ====================== HELPERS VISUALES (HUD) ======================
   Gráficas y medidores SIMPLES en SVG puro: sparkline, anillo, columnas de
   dots (tipo ecualizador), barra con progreso, switch. Sin librerías. */
function spark(vals){
  vals=(vals&&vals.length>1)?vals:[2,3,3,4,4,5,6,7];
  var W=300,H=64,pad=5,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){ var x=pad+i*((W-2*pad)/(vals.length-1)); var y=H-pad-((v-mn)/rng)*(H-2*pad-6); return [x,y]; });
  var d=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var ar=d+' L'+pts[pts.length-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+' Z';
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="spf" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="var(--data)" stop-opacity=".30"/><stop offset="1" stop-color="var(--data)" stop-opacity="0"/></linearGradient></defs>'+
    '<path class="ar" fill="url(#spf)" d="'+ar+'"/><path class="ln" d="'+d+'"/></svg>';
}
function statCol(pct,cls){                 // 7 dots que se llenan según el %
  var lit=Math.max(1,Math.round(Math.min(pct,100)/100*7)),c='';
  for(var i=0;i<7;i++) c+='<i class="'+(i<lit?'on':'')+'"></i>';
  return '<span class="col">'+c+'</span>';
}
function dotStat(pct,val,label,cls){       // columna completa (dots + número + etiqueta)
  return '<div class="dcol '+(cls||'')+'">'+statCol(pct,cls)+'<div class="v">'+val+'</div><div class="k">'+esc(label)+'</div></div>';
}
function ring(pct,color){
  pct=Math.max(0,Math.min(100,pct||0)); color=color||'var(--data)';
  var r=30,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<div class="ring"><svg width="76" height="76" viewBox="0 0 76 76" style="transform:rotate(-90deg)">'+
    '<circle cx="38" cy="38" r="30" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="7"/>'+
    '<circle cx="38" cy="38" r="30" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '</svg><b>'+Math.round(pct)+'%</b></div>';
}
/* ===== KIT DE GRÁFICOS DEL TABLERO (SVG puro, interactivo: hover + toque) ===== */
function semiGauge(pct,color){                 // arco de progresión (medio círculo)
  pct=Math.max(0,Math.min(100,Math.round(+pct||0))); color=color||'var(--data)';
  var C=Math.PI*46, off=C*(1-pct/100);
  return '<svg viewBox="0 0 120 68" style="width:100%;display:block">'+
    '<path d="M14 60 A46 46 0 0 1 106 60" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="11" stroke-linecap="round"/>'+
    '<path d="M14 60 A46 46 0 0 1 106 60" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '<text x="60" y="57" text-anchor="middle" font-size="21" font-weight="900" fill="#fff">'+pct+'%</text></svg>';
}
function colChart(items){                      // columnas verticales [etiqueta, valor%, color]
  var W=320,H=150,pad=8,n=items.length||1,slot=(W-2*pad)/n,bw=Math.min(34,slot*.62);
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">';
  items.forEach(function(it,i){
    var v=Math.max(0,Math.min(100,Math.round(it[1]||0))), full=H-46, bh=Math.max(4,v/100*full);
    var x=pad+i*slot+(slot-bw)/2, y=H-26-bh, c=it[2]||'var(--data)';
    s+='<g class="cbar" onclick="flash(\''+esc(it[0])+': '+v+'% de avance\')"><title>'+esc(it[0])+' · '+v+'%</title>'+
       '<rect x="'+x.toFixed(1)+'" y="'+(H-26-full)+'" width="'+bw.toFixed(1)+'" height="'+full+'" rx="7" fill="rgba(255,255,255,.05)"/>'+
       '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="7" fill="'+c+'"/>'+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">'+v+'</text>'+
       '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,.55)">'+esc((it[0]||'').slice(0,6))+'</text></g>';
  });
  return s+'</svg>';
}
function donutChart(items,unidad){             // dona segmentada [etiqueta, n, color] + leyenda
  var total=0; items.forEach(function(x){ total+=x[1]; }); if(!total) total=1;
  var r=40, C=2*Math.PI*r, acc=0, segs='';
  items.forEach(function(it){
    var frac=it[1]/total, d=Math.max(0,frac*C-2.5), off=C*0.25-acc*C; acc+=frac;
    segs+='<circle class="dseg" cx="52" cy="52" r="'+r+'" fill="none" stroke="'+it[2]+'" stroke-width="15" stroke-dasharray="'+d.toFixed(2)+' '+(C-d).toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" onclick="flash(\''+esc(it[0])+': '+it[1]+' '+(unidad||'')+'\')"><title>'+esc(it[0])+' · '+it[1]+'</title></circle>';
  });
  var legend=items.map(function(it){
    var pc=Math.round(it[1]/total*100);
    return '<div class="line" style="padding:5px 0"><span style="display:flex;align-items:center;gap:8px;min-width:0"><span style="width:10px;height:10px;border-radius:3px;background:'+it[2]+';flex:none"></span><span style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it[0])+'</span></span><span style="font-size:12px;font-weight:800;flex:none">'+it[1]+' · '+pc+'%</span></div>';
  }).join('');
  return '<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 104 104" style="width:118px;flex:none">'+segs+
    '<text x="52" y="50" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">'+total+'</text>'+
    '<text x="52" y="64" text-anchor="middle" font-size="8.5" font-weight="700" fill="rgba(255,255,255,.55)">'+esc((unidad||'').toUpperCase())+'</text></svg>'+
    '<div style="flex:1;min-width:0">'+legend+'</div></div>';
}
function heatBars(items,sufijo){               // barras de calor [etiqueta, %] (verde→ámbar→rojo)
  return items.map(function(x){
    var v=Math.round(x[1]||0);
    var col = v>=40?'linear-gradient(90deg,#ff8a5c,var(--bad))' : v>=25?'linear-gradient(90deg,var(--warn),#ff8a5c)' : 'linear-gradient(90deg,var(--data2),var(--data))';

    return '<div style="margin-top:11px;cursor:pointer" onclick="flash(\''+esc(x[0])+': '+v+'%'+(sufijo||'')+'\')">'+
      '<div class="line" style="border:none;padding:0 0 5px"><span style="font-size:12.5px;font-weight:600">'+esc(x[0])+'</span><span class="tg" style="flex:none;'+chip+'">'+v+'%</span></div>'+

  }).join('');
}

function nomItems(){ var out=[]; CFG.nom035.cats.forEach(function(c){ c.doms.forEach(function(d){ d.qs.forEach(function(it){ out.push({cat:c.k, dom:d.dk, it:it}); }); }); }); return out; }
function nomPts(it,val){ return it.inv ? (4-val) : val; }
function nomNivelSum(x,c){ return x<c[0]?'nulo' : x<c[1]?'bajo' : x<c[2]?'medio' : x<c[3]?'alto' : 'muyalto'; }
function nomCalifica(ans,filtros){
  var sum={ total:0, cat:{} };
  nomItems().forEach(function(r){
    if(r.it.filtro && !filtros[r.it.filtro]) return;
    var p=nomPts(r.it, ans[r.it.n]||0);
    sum.total+=p; sum.cat[r.cat]=(sum.cat[r.cat]||0)+p;
  });
  var C=CFG.nom035.cortes, out={ total:nomNivelSum(sum.total,C.total), cat:{}, sumas:sum };
  for(var k in C.cat) out.cat[k]=nomNivelSum(sum.cat[k]||0,C.cat[k]);
  return out;
}

function watch(){
  if(cur.watched) return;
  $('vplay').classList.add('hide'); $('vstat').textContent='Reproduciendo…';
  var w=0, bar=$('vbar');
  clearInterval(cur._t);
  cur._t=setInterval(function(){
    w+=2.5; if(bar) bar.style.width=Math.min(w,100)+'%';
    if(w>=100){ clearInterval(cur._t); cur.watched=true;
      $('vstat').textContent='Video visto ✓';
      var b=$('btnQuiz'); b.disabled=false; b.classList.remove('off');
      var cid=cur.course.id;
      if(!S.watched[cid]){ S.watched[cid]=1; S.points+=CFG.points.watch; save(); renderTop();
        burst(); flash('+'+CFG.points.watch+' puntos. ¡Bien hecho por darte el tiempo de aprender!'); }
      else { flash('¡Listo! Ya puedes responder las preguntas'); }
    }
  },70);
}

/* ====================== QUIZ ====================== */
function startQuiz(exempt){
  cur.exempt=!!exempt; cur.answers=[];
  renderQuiz(); show('quiz');
}
function backFromQuiz(){ openCourse(cur.course.id); }
function renderQuiz(){
  var c=cur.course, qs=c.q;
  var all = qs.every(function(_,i){ return cur.answers[i]!=null; });
  var answered = qs.filter(function(_,i){ return cur.answers[i]!=null; }).length;
  var guideTxt = cur.exempt
    ? 'Vas directo, ¡eso habla bien de ti! Responde con calma. Si algo no lo puedes leer, toca la bocina y te lo leo.'
    : 'Sin prisa y sin miedo: elige una respuesta por pregunta. Si algo no lo puedes leer, toca la bocina y te lo leo. ¡Confío en ti!';
  var h='';
  h+='<div class="panel"><div class="hd" style="align-items:flex-start"><div><div class="eyebrow">Preguntas'+(cur.exempt?' · Sin video':'')+'</div><b style="font-size:20px">'+esc(c.t)+'</b></div><span class="chipst'+(answered?'':' mut')+'">'+answered+'/'+qs.length+'</span></div>'+
       pbarRow(IC2.check,'Contestadas',answered,qs.length)+
       '<div class="note" style="display:flex;gap:8px;align-items:flex-start;margin-top:8px"><span style="flex:1">'+guideTxt+'</span>'+speakBtn(guideTxt)+'</div></div>';
  qs.forEach(function(q,i){
    h+='<div class="panel"><div class="eyebrow" style="font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:8px">Pregunta '+(i+1)+' de '+qs.length+'</div>'+
       '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:11px"><b style="flex:1;margin:0;font-size:15px;line-height:1.35">'+esc(q.q)+'</b>'+speakBtn(q.q)+'</div>';
    q.o.forEach(function(o,j){
      var sel=cur.answers[i]===j?' sel':'';
      h+='<div class="opt'+sel+'" onclick="pick('+i+','+j+')"><span class="dot"></span><span style="flex:1">'+esc(o)+'</span>'+speakBtn(o)+'</div>';
    });
    h+='</div>';
  });
  h+='<button class="btn'+(all?'':' off')+'" id="btnGrade" '+(all?'':'disabled')+' onclick="submitQuiz()">Ver mi resultado</button>';
  $('s-quiz').innerHTML=h;
}
function pick(i,j){ cur.answers[i]=j; renderQuiz(); }
function submitQuiz(){
  var c=cur.course, qs=c.q;
  if(!qs.every(function(_,i){ return cur.answers[i]!=null; })){ flash('Responde las 3 preguntas'); return; }
  var score=0; qs.forEach(function(q,i){ if(cur.answers[i]===q.c) score++; });
  var pass=score>=2, id=c.id;
  var attemptsBefore=S.attempts[id]||0, firstTry=attemptsBefore===0, already=!!S.done[id];
  S.attempts[id]=attemptsBefore+1;
  var earned={base:0,perfect:0,first:0,ontime:0,streak:0,total:0};
  var leveledFrom=level();
  if(pass){
    if(!already){
      earned.base = cur.exempt?CFG.points.exemptBase:CFG.points.base;
      if(score===qs.length) earned.perfect=CFG.points.perfect;
      if(firstTry) earned.first=CFG.points.firstTry;
      earned.ontime=CFG.points.onTime;
      if(firstTry){ S.streak++; earned.streak=S.streak*CFG.points.streakStep; }
      earned.total=earned.base+earned.perfect+earned.first+earned.ontime+earned.streak;
      S.points+=earned.total;
      S.done[id]=cur.exempt?'exempt':'done';
    }
  } else { S.streak=0; }
  S.best[id]=Math.max(S.best[id]||0,score);
  save(); renderTop();
  cur.score=score; cur.pass=pass; cur.earned=earned; cur.already=already;
  showResult();
  if(pass && !already){ burst();
    if(score===qs.length) setTimeout(burst,350);                      // celebración proporcional: doble confeti solo con 3/3
    if(level()>leveledFrom) setTimeout(function(){ burst(); flash('¡Subiste a Nivel '+level()+' · '+levelName()+'!'); },700); }
}

/* ====================== RESULTADO ====================== */
function showResult(){
  var c=cur.course, qs=c.q, score=cur.score, pass=cur.pass, e=cur.earned;
  var pct=Math.round(score/qs.length*100);
  var h='';
  if(pass){
    var msg = score===qs.length ? '¡Perfecto! Las 3 buenas. Se nota que pusiste atención.' : '¡Muy bien! Aprobaste. Abajo te dejo la que faltó, para que te la lleves completa.';
    var say = (cur.exempt?'¡Exentado! ':'¡Aprobado! ')+msg;
    h+='<div class="panel"><div class="hd" style="align-items:flex-start"><div><div class="eyebrow">Aprobado</div><b style="font-size:20px">'+(cur.exempt?'¡Exentado!':'¡Aprobado!')+'</b></div><span class="chipst">'+score+'/'+qs.length+'</span></div>'+
       '<div style="display:flex;gap:14px;align-items:center">'+ring(pct,'var(--ok)')+
         '<div style="flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start"><p class="note" style="flex:1;margin:0;font-size:13px">'+msg+'</p>'+speakBtn(say)+'</div></div></div>';

        qs.map(function(q,i){

        }).join('')+'</div></div>';
    }
    if(cur.already){
      h+='<div class="panel"><div class="note" style="display:flex;gap:8px;align-items:flex-start;margin-top:0"><span style="flex:1">Esto fue repaso: no suma puntos, pero tu memoria sí gana. Repasar de vez en cuando es de los que hacen bien su trabajo.</span>'+speakBtn('Esto fue repaso: no suma puntos, pero tu memoria sí gana. Repasar de vez en cuando es de los que hacen bien su trabajo.')+'</div></div>';
    }else{
      var rows=[['Por aprobar el curso',e.base]];
      if(e.perfect) rows.push(['Por hacerlo perfecto (3 de 3)',e.perfect]);
      if(e.first) rows.push(['Por lograrlo a la primera',e.first]);
      if(e.ontime) rows.push(['Por hacerlo a tiempo',e.ontime]);
      if(e.streak) rows.push(['Racha: llevas '+S.streak+' a la primera',e.streak]);
      h+='<div class="panel"><div class="hd"><div><div class="eyebrow">Puntos ganados</div><b style="font-size:17px">Tu esfuerzo suma</b></div><span class="chipst">+'+e.total+' pts</span></div>'+
        rows.map(function(r){return '<div class="line"><span>'+r[0]+'</span><span style="font-weight:800;color:#fff">+'+r[1]+'</span></div>';}).join('')+
        '<div class="line" style="border-bottom:none;font-size:15px"><span style="font-weight:800">Total ganado</span><span style="font-weight:900;color:var(--ok);font-size:18px">+'+e.total+' pts</span></div></div>';
    }
    h+='<button class="btn" onclick="go(\'home\')">Seguir aprendiendo →</button>'+
       '<button class="btn sec w" style="margin-top:10px" onclick="go(\'rewards\')">Ver mis premios</button>';
    if(S&&S.accessible) setTimeout(function(){ speak(say); },250);
  }else{
    var sayF='Acertaste '+score+' de '+qs.length+'. Equivocarse es parte de aprender. Nadie te regaña ni te quita nada. Repasa las respuestas y vuelve a intentar. Tú puedes.';
    h+='<div class="panel"><div class="hd" style="align-items:flex-start"><div><div class="eyebrow">Resultado</div><b style="font-size:20px">¡Casi! Vamos de nuevo</b></div><span class="chipst mut">'+score+'/'+qs.length+'</span></div>'+
       '<div style="display:flex;gap:14px;align-items:center">'+ring(pct,'var(--warn)')+
         '<div style="flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start"><p class="note" style="flex:1;margin:0;font-size:13px">Acertaste '+score+' de '+qs.length+'. <b>Equivocarse es parte de aprender</b>: nadie te regaña ni te quita nada. Mira abajo las respuestas, y a la siguiente lo logras.</p>'+speakBtn(sayF)+'</div></div></div>';
    h+='<div class="panel"><div class="hd"><div><div class="eyebrow">Para repasar</div><b style="font-size:17px">Las respuestas correctas</b></div></div><div class="review" style="text-align:left">'+
      qs.map(function(q,i){
        var your=cur.answers[i], okTxt=q.o[q.c], wrong=your!==q.c;
        var yourTxt=(your!=null)?q.o[your]:'';
        var sayQ= wrong ? ('La pregunta dice: '+q.q+'. Tú elegiste: '+yourTxt+'. La respuesta correcta es: '+okTxt) : ('La pregunta dice: '+q.q+'. La respuesta correcta es: '+okTxt);
        return '<div class="qr"><div style="display:flex;gap:8px;align-items:flex-start"><b style="flex:1">'+esc(q.q)+'</b>'+speakBtn(sayQ)+'</div>'+
          (wrong?'<div class="note" style="margin:0 0 5px">Tú elegiste: '+esc(yourTxt)+'</div>':'')+
          '<div class="good">✓ <span>Respuesta correcta: '+esc(okTxt)+'</span></div></div>';
      }).join('')+'</div></div>';
    h+='<button class="btn" onclick="startQuiz('+cur.exempt+')">Intentarlo otra vez</button>'+
       '<button class="btn sec w" style="margin-top:10px" onclick="openCourse(\''+c.id+'\')">Volver a ver el video (2 min)</button>';

/* ===== ANTI-SABOTAJE (vigilancia de seguridad) =====
   Detecta intención de DAÑAR la planta: sabotear procesos/equipo, contaminar el
   agua potable o la comida, "recetas" para echar a perder material, etc.
   Si la detecta: Asistente NO responde y se manda un FOCO ROJO inmediato a RRHH con
   la pregunta exacta + el número de empleado + área + hora.
   Diseñado para NO acusar a inocentes: las preguntas de PREVENCIÓN, cuidado,
   reparación o accidentes ("cómo evito dañar…", "se dañó solo…") NO se marcan. */
function maliceCheck(text){
  var t=_norm(text);
  // 1) Señales DURAS: frases que NO tienen lectura legítima en capacitación → bloquean siempre
  var HARD=['sabotaje','sabotear','sabote','envenen','vandali',
    'sin que se den cuenta','sin que se de cuenta','sin que nadie se de cuenta','sin que se note','sin que se noten','sin dejar rastro','sin dejar evidencia',
    'para que falle','hacer que falle','para que se descompon','hacer que se descompon','para que se eche a perder','para que se dane','hacer que se dane','para que se arruine','para que se estrope','para arruinar','para danar',
    'echarle aceite al agua','aceite al agua','aceite en el agua','aceite con agua',
    'al agua potable','en el agua potable','al bebedero','a los bebederos','al garrafon','a la comida','en la comida',
    'danar a proposito','a proposito danar'];
  for(var i=0;i<HARD.length;i++){ if(t.indexOf(HARD[i])>-1) return true; }
  // 2) Intención explícita con groserías (cómo/para/quiero/voy a + jod/ching/freg)
  var SLANG=['como jod','komo jod','como le hago para jod','para jod','quiero jod','voy a jod','para que se jod','como ching','para ching','quiero ching','voy a ching','como friego la maq','como friego el','como friego la prod'];
  for(var p=0;p<SLANG.length;p++){ if(t.indexOf(SLANG[p])>-1) return true; }
  // 3) Contaminar AGUA POTABLE / comida con una sustancia ajena = sabotaje
  var WATER=['agua potable','agua de tomar','agua para tomar','garrafon','bebedero','la comida','el lonche','los tacos','la cocina'];
  var SUBST=['aceite','quimico','solvente','gasolina','diesel','thinner','cloro','acido','veneno','jabon','detergente','grasa','tierra','basura','orin','saliva','vidrio','clavo'];
  var hasW=false,hasS=false;
  for(var w=0;w<WATER.length;w++){ if(t.indexOf(WATER[w])>-1){ hasW=true; break; } }
  for(var x=0;x<SUBST.length;x++){ if(t.indexOf(SUBST[x])>-1){ hasS=true; break; } }
  if(hasW&&hasS) return true;
  // 4) Combinación VERBO dañino + OBJETIVO, salvo prevención / accidente / "ya está roto"
  var VERB=['dana','dano','dane','altera','arruina','descompon','estrope','malogr','contamin','adulter','echar a perder'];
  var TGT=['agua potable','el agua','proceso','produccion','maquina','maquinaria','banbury','tabulador','caldera','aceite','hule','la mezcla','molde','autoclave','quimico','materia prima','el producto','la planta','equipo','sistema','motor','la banda','caucho','vapor'];
  var hasV=false,hasT=false;
  for(var v=0;v<VERB.length;v++){ if(t.indexOf(VERB[v])>-1){ hasV=true; break; } }
  for(var g=0;g<TGT.length;g++){ if(t.indexOf(TGT[g])>-1){ hasT=true; break; } }
  if(hasV&&hasT){
    var SAFE=['evito','evitar','para no','no dana','no danar','sin danar','proteg','prevenir','prevenc','no contamin',
      'se dana','se dano','se descompon','se estrope','se arruin','se malogr','se altero','se altera',
      'esta dana','esta danad','quedo dana','ya esta dana','esta descompuesto','esta roto','esta malogr','esta estrope','esta altera',
      'no funciona','no sirve','no jala','esta fallando','dejo de funcionar','dejo de servir',
      'si se dana','que pasa si se','que pasa si','accidente','por accidente','sin querer',
      'reparar','repara','arreglar','arreglo','como cuido','para cuidar','dar mantenimiento'];
    for(var k=0;k<SAFE.length;k++){ if(t.indexOf(SAFE[k])>-1) return false; }
    return true;
  }
  return false;
}

/* ===== Buscador de la BIBLIOTECA offline (CFG.kb) =====
   Ignora acentos, mayúsculas, plurales y palabras vacías, y elige el tema
   con más coincidencias de palabras. Si nada encaja, sugiere temas. */
function _norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' '); }
var KB_STOP={de:1,la:1,el:1,los:1,las:1,un:1,una:1,unos:1,unas:1,que:1,en:1,por:1,con:1,para:1,del:1,al:1,lo:1,le:1,les:1,se:1,su:1,sus:1,mi:1,tu:1,es:1,son:1,esta:1,este:1,como:1,cual:1,cuales:1,sobre:1,mas:1,muy:1,me:1,te:1,nos:1,hay:1,si:1,no:1,pero:1,porque:1,cuando:1,donde:1,quien:1,cuanto:1,cuanta:1,dime:1,quiero:1,saber:1,puedes:1,decir:1,explica:1,explicame:1,sirve:1}
function kb(t){
  var g=guard(t); if(g) return g;
  var raw=_norm(t).split(/\s+/).filter(function(w){ return w.length>=3 && !KB_STOP[w]; });
  var q=raw.map(function(w){ return w.length>4 ? w.replace(/(es|s)$/,'') : w; });
  var lib=CFG.kb||[], best=null, bs=0;
  for(var i=0;i<lib.length;i++){
    var e=lib[i], K=' '+_norm(e.k)+' ', T=' '+_norm(e.t)+' ', A=' '+_norm(e.a)+' ', s=0;
    for(var j=0;j<q.length;j++){ var w=q[j], inK=K.indexOf(w)>-1, inT=T.indexOf(w)>-1;
      if(inK) s+=3; if(inT) s+=2; if(!inK&&!inT&&A.indexOf(w)>-1) s+=1;
    }
    if(s>bs){ bs=s; best=e; }
  }
  if(best && bs>=3) return best.a;
  var temas=lib.filter(function(e){return e.t;}).slice(0,8).map(function(e){return e.t;});
  return 'Eso todavía no lo tengo guardado en mi biblioteca offline . Puedo ayudarte con: '+temas.join(' · ')+'.\n\nPregúntame de otra forma, o conéctate () para una respuesta más completa. Recuerda: solo temas de llantas, hule, fábrica y clases básicas.';
}
/* ===== RESPUESTAS CERRADAS + REGISTRO DE PREGUNTAS =====
   Asistente solo responde desde la biblioteca AUTORIZADA (CFG.kb). Cada pregunta
   se registra: las que SÍ tienen respuesta suman a "frecuentes"; las que NO,
   se guardan como "sin responder" para que RRHH/dirección las revise, formule
   una respuesta y la agregue (alimentación semanal). En el demo va a
   localStorage; en producción esto iría a una base de datos central. */
function kbFind(t){
  var raw=_norm(t).split(/\s+/).filter(function(w){ return w.length>=3 && !KB_STOP[w]; });
  var q=raw.map(function(w){ return w.length>4 ? w.replace(/(es|s)$/,'') : w; });
  var lib=CFG.kb||[], best=null, bs=0;
  for(var i=0;i<lib.length;i++){
    var e=lib[i], K=' '+_norm(e.k)+' ', T=' '+_norm(e.t)+' ', A=' '+_norm(e.a)+' ', s=0;
    // puntaje aditivo: si la palabra está en el TÍTULO además de las keywords, el tema dedicado gana (p.ej. "Banbury" le gana a "Mezclado")
    for(var j=0;j<q.length;j++){ var w=q[j], inK=K.indexOf(w)>-1, inT=T.indexOf(w)>-1; if(inK) s+=3; if(inT) s+=2; if(!inK&&!inT&&A.indexOf(w)>-1) s+=1; }
    if(s>bs){ bs=s; best=e; }
  }
  if(best && bs>=3) return { hit:true, topic:(best.t||'General'), answer:best.a };
  return { hit:false, topic:null, answer:null };
}
function kbTopics(){ return (CFG.kb||[]).filter(function(e){return e.t;}).map(function(e){return e.t;}); }
function qstats(){ try{ return JSON.parse(localStorage.getItem('hb_qstats')||'null')||{freq:{},unans:{}}; }catch(e){ return {freq:{},unans:{}}; } }
function logQ(topic,text,hit){
  try{ var s=qstats();
    if(hit && topic){ s.freq[topic]=(s.freq[topic]||0)+1; }
    if(!hit){ var k=(text||'').trim().toLowerCase().slice(0,90); if(!k) return; s.unans[k]={ q:(text||'').trim(), n:(s.unans[k]?s.unans[k].n:0)+1, t:Date.now() }; }
    localStorage.setItem('hb_qstats', JSON.stringify(s));
  }catch(e){}
}
/* (Compatibilidad · modo online DORMIDO) arma el historial para la API por si se reactiva
   (el primer mensaje del Asistente es un saludo 'assistant', así que lo recortamos). */

function sendChat(){
  var inp=$('chatIn'); var t=(inp.value||'').trim(); if(!t||chatBusy) return;
  S.chat.push({role:'user',content:t}); inp.value=''; chatBusy=true; paintChat();
  // ANTI-SABOTAJE (máxima prioridad): intención de dañar la planta → Asistente NO responde
  // y manda foco rojo inmediato a RRHH (silencioso: no le avisa al trabajador que fue reportado).
  if(maliceCheck(t)){
    logAlert(t);
    setTimeout(function(){ chatBusy=false; S.chat.push({role:'assistant',content:'Ese tipo de preguntas no son bienvenidas en el Asistente. Estoy para ayudarte a aprender y a cuidar la planta, a tus compañeros y tu propio trabajo. Si fue un malentendido, vuelve a preguntar de otra forma.'}); paintChat(); }, 350);
    return;
  }
  // GUARDRAIL (online y offline): bloquea info sensible / inventario sin permiso / fuera de tema
  var blk=guard(t);
  if(blk){ setTimeout(function(){ chatBusy=false; S.chat.push({role:'assistant',content:blk}); paintChat(); }, 350); return; }
  // RESPUESTAS CERRADAS: solo desde la biblioteca autorizada. Registra frecuencia y no-respondidas.
  setTimeout(function(){
    chatBusy=false;
    var res=kbFind(t);
    if(res.hit){ logQ(res.topic,t,true); S.chat.push({role:'assistant',content:res.answer}); }
    else {
      logQ(null,t,false);
      S.chat.push({role:'assistant',content:'Todavía no tengo una respuesta autorizada para eso . Ya la registré para que el equipo la revise y la agregue pronto.\n\nMientras, sí te puedo ayudar con: '+kbTopics().slice(0,6).join(' · ')+'.'});
    }
    paintChat();
  }, 420);
}
