<style>
/* =======================================================================
   ESTILOS — tema oscuro 2026, glass, degradados animados, tipografía Inter
   (Inter se carga si hay internet; offline cae a la tipografía del sistema)
   ======================================================================= */
:root{
  --bg:#0b0c11; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10); --txt:#f3f4f8; --mut:#9aa0b0;
  --accent:#c4161c; --accent2:#ff5a4e;      /* se cambian por área al iniciar sesión */
  --ok:#27c267; --warn:#ffb020; --bad:#ff6b6b;
  --radius:20px; --shadow:0 16px 44px rgba(0,0,0,.46);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--txt);background:var(--bg);overflow-x:hidden}
button{font-family:var(--font)}

/* ---- fondo de luces/degradados en movimiento ---- */
.mesh{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(42vw 42vw at 12% 6%,rgba(196,22,28,.34),transparent 60%),
  radial-gradient(46vw 46vw at 88% 10%,rgba(224,122,31,.24),transparent 60%),
  radial-gradient(52vw 52vw at 72% 96%,rgba(42,125,225,.20),transparent 62%),
  linear-gradient(180deg,#0b0c11,#0e0f16)}
.mesh:after{content:'';position:absolute;inset:-10%;background:
  radial-gradient(38vw 38vw at 30% 38%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),
  radial-gradient(34vw 34vw at 78% 64%,rgba(120,80,255,.16),transparent 60%);
  animation:drift 16s ease-in-out infinite alternate;filter:blur(8px)}
@keyframes drift{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,4%) scale(1.1)}}
.grain{position:fixed;inset:0;z-index:-1;opacity:.5;pointer-events:none;background:
  radial-gradient(circle at center,transparent 60%,rgba(0,0,0,.35));mix-blend-mode:multiply}

#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.hide{display:none!important}
.fade{animation:fade .42s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding:16px 15px 130px}

/* ====================== BANDI (mascota reutilizable) ====================== */
/* Se define UNA sola vez como <symbol> y se reusa con <use>. */
.bandi{display:inline-block;line-height:0;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 12px 20px rgba(0,0,0,.45))}
.bandi .bv{display:block;width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-8px)}}
.bandi.roll .bv{animation:tilt 5.5s ease-in-out infinite;transform-origin:50% 70%}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.bandi.cheer{animation:cheer .9s cubic-bezier(.2,.8,.3,1.3)}
@keyframes cheer{0%{transform:scale(1)}25%{transform:scale(1.14) rotate(-7deg)}55%{transform:scale(1.04) rotate(7deg)}100%{transform:none}}
.b-xl{width:172px;height:172px}.b-lg{width:84px;height:84px}.b-md{width:54px;height:54px}.b-sm{width:38px;height:38px}.b-xs{width:30px;height:30px}

/* ============================== LOGIN ============================== */
.login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:30px 26px calc(30px + env(safe-area-inset-bottom));padding-top:calc(24px + env(safe-area-inset-top))}
.kicker{font-weight:800;letter-spacing:2px;font-size:11px;color:var(--mut);text-transform:uppercase;margin:14px 0 2px}
.kicker b{color:var(--accent2)}
.login h1{font-size:32px;margin:2px 0 4px;font-weight:900;letter-spacing:-.6px}
.login .sub{color:var(--mut);margin:0 0 22px;font-size:14px;max-width:330px;line-height:1.5}
.field{width:100%;max-width:320px;margin:7px auto;position:relative}
.field input{width:100%;padding:16px 16px;border-radius:15px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);font-size:17px;outline:none;transition:.2s;backdrop-filter:blur(8px);text-align:center;letter-spacing:2px;font-weight:700}
.field input::placeholder{letter-spacing:0;font-weight:500}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.try{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:330px;margin:14px auto 2px}
.try b{width:100%;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:2px}
.tryc{font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:30px;border:1px solid var(--line);background:var(--card);
  color:var(--txt);cursor:pointer;transition:.15s}
.tryc:active{transform:scale(.95)}.tryc i{font-style:normal;opacity:.6;margin-left:5px}
.hint{color:var(--mut);font-size:11.5px;margin-top:20px;max-width:340px;line-height:1.6}
.hint b{color:#cfd2dc}

/* ============================== BOTONES ============================== */
.btn{display:block;width:100%;border:none;border-radius:15px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 26px color-mix(in srgb,var(--accent) 38%,transparent);
  transition:transform .12s,filter .2s;max-width:320px;margin:14px auto 0}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--card2);box-shadow:none;border:1px solid var(--line);color:var(--txt)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--txt)}
.btn:disabled,.btn.off{opacity:.4;cursor:not-allowed;filter:grayscale(.4);box-shadow:none}
.btn.w{max-width:none}

/* ============================== TOPBAR ============================== */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .who{display:flex;align-items:center;gap:10px;min-width:0}
.top .who .av{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,#14151d);padding:3px;flex:none}
.top .who b{font-size:14px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who span{font-size:11px;color:var(--mut)}
.back{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-size:13px;font-weight:700;padding:8px 13px;border-radius:30px;cursor:pointer}
.back:active{transform:scale(.96)}
.ptchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:8px 13px;border-radius:30px;
  background:color-mix(in srgb,var(--accent) 22%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);white-space:nowrap}

/* ============================== CARDS ============================== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:13px;
  box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--mut);margin:20px 4px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-t .ln{flex:1;height:1px;background:var(--line)}

/* hero saludo */
.hero{position:relative;overflow:hidden;border:none;color:#fff;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 92%,#000),color-mix(in srgb,var(--accent) 50%,#0a0a12))}
.hero:before{content:'';position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 10%,rgba(255,255,255,.18),transparent 60%)}
.hero .row{position:relative;display:flex;gap:13px;align-items:center}
.hero .bandi{flex:none}
.hero h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.hero p{margin:5px 0 0;font-size:13px;opacity:.94;line-height:1.4}
.lvl{position:relative;margin-top:14px}
.lvl .lt{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;opacity:.95;margin-bottom:6px}
.lvlbar{height:9px;border-radius:30px;background:rgba(0,0,0,.28);overflow:hidden}
.lvlbar i{display:block;height:100%;border-radius:30px;background:linear-gradient(90deg,#fff,rgba(255,255,255,.7));transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center;backdrop-filter:blur(10px)}
.stat .n{font-size:25px;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:9.5px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;margin-top:6px;font-weight:700}

/* guía Bandi (tip con globo) */
.guide{display:flex;align-items:flex-start;gap:11px;margin:4px 2px 16px}
.guide .bub{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;border-top-left-radius:4px;
  padding:11px 13px;font-size:13px;line-height:1.45;color:#e7e9f0;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.guide .bub b{color:#fff}

/* ============================== CURSOS ============================== */
.course{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.course:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--card2)}
.course:active{transform:scale(.99)}
.thumb{width:50px;height:50px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:23px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 42%,#1c1c24),#15151c)}
.course .t{flex:1;min-width:0}
.course .t b{display:block;font-size:14.5px;font-weight:700;line-height:1.25}
.course .t span{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:7px;margin-top:2px}
.tag{font-size:9px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:20px;text-transform:uppercase}
.tag.ob{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent2)}
.pill{font-size:10px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:none}
.pill.pend{background:rgba(255,255,255,.08);color:var(--mut)}
.pill.done{background:rgba(39,194,103,.16);color:#5fe093}
.pill.exo{background:rgba(42,125,225,.18);color:#7db4ff}

/* ============================== PLAYER + QUIZ ============================== */
.player{position:relative;background:radial-gradient(120% 120% at 50% 0%,#1a1b24,#000);border-radius:16px;aspect-ratio:16/10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.player .glow{position:absolute;inset:0;background:radial-gradient(50% 60% at 50% 40%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 70%)}
.player .bandi{position:relative}
.vplay{position:absolute;z-index:3;width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .15s}
.vplay:active{transform:scale(.9)}
.vplay:after{content:'';width:0;height:0;margin-left:5px;border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
.vstat{position:absolute;bottom:14px;left:14px;font-size:11.5px;color:#d6d9e3;z-index:3;font-weight:600}
.vbarwrap{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(255,255,255,.12);z-index:3}
.vbarwrap i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .1s linear}
.vtag{position:absolute;top:12px;left:12px;z-index:3;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);padding:5px 9px;border-radius:20px;color:#fff}

.q b{display:block;margin-bottom:11px;font-size:15px;line-height:1.35}
.qn{font-size:11px;font-weight:800;color:var(--accent2);letter-spacing:.5px}
.opt{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;font-size:14px;transition:.15s;line-height:1.3}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none;transition:.15s;position:relative}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.opt.sel .dot{border-color:var(--accent);background:var(--accent)}
.opt.sel .dot:after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
.opt.ok{border-color:var(--ok);background:rgba(39,194,103,.14)}
.opt.ok .dot{border-color:var(--ok);background:var(--ok)}
.opt.bad{border-color:var(--bad);background:rgba(255,107,107,.14)}
.opt .ic{margin-left:auto;font-size:15px}

/* ============================== RESULTADO ============================== */
.result{text-align:center;padding-top:8px}
.result .emo{font-size:64px;margin:6px 0}
.result h2{font-size:24px;margin:4px 0 2px;font-weight:900}
.result .ms{color:var(--mut);font-size:14px;line-height:1.5;max-width:330px;margin:0 auto 6px}
.scorering{width:120px;height:120px;margin:10px auto;position:relative;display:flex;align-items:center;justify-content:center}
.scorering svg{position:absolute;inset:0;transform:rotate(-90deg)}
.scorering b{font-size:30px;font-weight:900}.scorering span{font-size:11px;color:var(--mut);display:block;margin-top:-4px}
.brk{text-align:left;margin-top:8px}
.brk .r{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.brk .r:last-child{border-bottom:none}
.brk .r span:last-child{font-weight:800;color:#fff}
.brk .r.tot{font-size:16px;margin-top:4px;border-top:1px solid var(--line);padding-top:13px}
.brk .r.tot span:last-child{color:var(--ok);font-size:19px}
.review{text-align:left}
.review .qr{padding:11px 0;border-bottom:1px solid var(--line)}
.review .qr:last-child{border-bottom:none}
.review .qr b{font-size:13.5px;display:block;margin-bottom:5px}
.review .qr .good{font-size:13px;color:#5fe093;display:flex;gap:7px;align-items:flex-start}
.note{font-size:12px;color:var(--mut);line-height:1.6;margin-top:6px}

/* ============================== RECOMPENSAS ============================== */
.balance{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#000),color-mix(in srgb,var(--accent) 40%,#0a0a12));border:none;color:#fff}
.balance .big{font-size:34px;font-weight:900;line-height:1}.balance small{opacity:.9;font-size:12px}
.rwd{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.rwd .thumb{background:rgba(255,255,255,.06);font-size:25px}
.rwd .t{flex:1;min-width:0}.rwd .t b{display:block;font-size:14px}.rwd .t span{font-size:12px;color:var(--mut)}
.rdm{border:none;border-radius:30px;padding:10px 15px;font-size:12px;font-weight:800;cursor:pointer;flex:none;transition:transform .12s}
.rdm:active{transform:scale(.94)}
.rdm.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.rdm.off{background:var(--card2);color:var(--mut);cursor:default;border:1px solid var(--line)}
.rdm.got{background:rgba(39,194,103,.16);color:#5fe093;cursor:default}
.prog{height:6px;border-radius:30px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ============================== CHAT ============================== */
.chathead{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.chathead .t{flex:1}.chathead .t b{font-size:16px}.chathead .t span{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dotst{width:8px;height:8px;border-radius:50%;background:var(--mut);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.dotst.on{background:var(--ok);box-shadow:0 0 0 3px rgba(39,194,103,.18)}
.keybtn{background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:12px;font-weight:700;padding:9px 12px;border-radius:30px;cursor:pointer;display:flex;align-items:center;gap:6px}
.keybtn:active{transform:scale(.96)}
.msgs{display:flex;flex-direction:column;gap:11px;min-height:46dvh;padding:4px 0 6px}
.m{display:flex;gap:9px;align-items:flex-end;max-width:90%}
.m.user{align-self:flex-end;flex-direction:row-reverse}
.m .bub{padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.m.bot .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;backdrop-filter:blur(10px)}
.m.user .bub{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:4px}
.m .bandi{flex:none;align-self:flex-end}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip2{white-space:nowrap;font-size:12px;font-weight:600;padding:8px 13px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;flex:none}
.chip2:active{transform:scale(.95)}
.composer{position:sticky;bottom:0;display:flex;gap:9px;align-items:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 28%)}
.composer input{flex:1;padding:14px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;outline:none;backdrop-filter:blur(10px)}
.composer input:focus{border-color:var(--accent)}
.send{width:48px;height:48px;border-radius:50%;border:none;flex:none;cursor:pointer;color:#fff;font-size:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 36%,transparent)}
.send:active{transform:scale(.92)}
.authrow{display:flex;align-items:center;gap:9px;margin:-2px 0 10px;flex-wrap:wrap}
.authpill{font-size:11px;font-weight:700;padding:6px 11px;border-radius:30px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut)}
.authpill.on{background:rgba(39,194,103,.16);border-color:rgba(39,194,103,.3);color:#5fe093}
.lnkbtn{background:none;border:none;color:var(--accent2);font-size:11.5px;font-weight:800;cursor:pointer;padding:4px}
.lnkbtn:active{transform:scale(.95)}

/* ============================== TABLERO RRHH ============================== */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.kpi .b{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(10px)}
.kpi .b .n{font-size:28px;font-weight:900;line-height:1}
.kpi .b .l{font-size:11px;color:var(--mut);margin-top:4px;font-weight:600}
.kpi .b.grn .n{color:#5fe093}.kpi .b.red .n{color:var(--bad)}
.barrow{font-size:12.5px;margin-top:12px;display:flex;justify-content:space-between;font-weight:600}
.barrow .v{color:var(--mut)}
.bar{height:9px;border-radius:30px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:30px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.line:last-child{border-bottom:none}
.tg{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:20px;background:rgba(255,176,32,.16);color:#ffce6e;white-space:nowrap;flex:none}
.tg.g{background:rgba(39,194,103,.16);color:#5fe093}
.rank{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.medal{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none;background:var(--card2);color:var(--mut)}
.rank:nth-child(1) .medal{background:linear-gradient(135deg,#ffd76a,#e0a019);color:#3a2400}
.rank:nth-child(2) .medal{background:linear-gradient(135deg,#e3e7ef,#a9b0c0);color:#22252e}
.rank:nth-child(3) .medal{background:linear-gradient(135deg,#e6a463,#b06a2e);color:#2a1400}
.rank .rn{flex:1;font-size:13.5px;font-weight:600}

/* ============================== NAV INFERIOR ============================== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:4px;max-width:480px;margin:0 auto;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:120px;background:none;border:none;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border-radius:14px;transition:.18s}
.nav button .ni{width:24px;height:24px}
.nav button.on{color:var(--accent2)}
.nav button.on .ni{filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--accent) 50%,transparent))}
.nav button:active{transform:scale(.92)}

/* ============================== FLASH / CONFETTI ============================== */
.flash{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#1b1d27;border:1px solid var(--line);color:#fff;font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:30px;
  z-index:100;opacity:0;transition:.3s;box-shadow:var(--shadow);pointer-events:none;max-width:90%}
.flash.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:.9}}

/* ===== ACADEMIA · PROFESOR BANDI ===== */
.accbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;font-weight:600}
.toggle{border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;background:var(--card2);color:var(--mut)}
.toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.topic{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px;cursor:pointer;transition:transform .15s,border-color .2s}
.topic:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.topic:active{transform:scale(.99)}
.topic .t{flex:1;min-width:0}.topic .t b{display:block;font-size:15px}.topic .t span{font-size:11.5px;color:var(--mut)}
.acad-head{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.lvl-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s}
.lvl-card:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.lvl-card.locked{opacity:.5;cursor:default}
.lvl-card .t{flex:1;min-width:0}.lvl-card .t b{display:block;font-size:14px}.lvl-card .t span{font-size:11px;color:var(--mut)}
.lvl-num{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.lvl-num.on{background:linear-gradient(135deg,var(--ok),#46c46e);color:#06210f;border:none}
.lesson-step{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:15px;line-height:1.5}
.lesson-step span{flex:1}
.qbig{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:700;line-height:1.4;margin-bottom:12px}
.qbig span{flex:1}
.qopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:15px;color:var(--txt);cursor:pointer;transition:.15s;font-family:var(--font)}
.qopt:hover{border-color:var(--accent)}.qopt:active{transform:scale(.99)}.qopt span{flex:1}
.speak{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:color-mix(in srgb,var(--accent) 22%,transparent);color:#fff;font-size:16px;cursor:pointer}
.speak:active{transform:scale(.9)}
.bigbtn{display:block;width:100%;border:none;border-radius:15px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:12px;font-family:var(--font)}
.bigbtn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.bigbtn:active{transform:scale(.98)}
.fb-ok{border-color:rgba(39,194,103,.45);background:rgba(39,194,103,.10)}
.fb-bad{border-color:rgba(255,176,32,.45);background:rgba(255,176,32,.08)}
.access .qbig,.access .lesson-step{font-size:20px;line-height:1.55}
.access .qopt{font-size:19px;padding:19px}
.access .bigbtn{font-size:20px;padding:21px}
.access .speak{width:48px;height:48px;font-size:20px}
.access .topic .t b,.access .lvl-card .t b{font-size:18px}
.nav button span{white-space:nowrap}

/* ===== Reporte semanal imprimible (RRHH) — solo se ve al imprimir ===== */
#printReport{display:none}
@media print{
  body>*:not(#printReport){display:none!important}
  #printReport{display:block!important;color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13px;padding:6px}
  #printReport h1{font-size:19px;margin:0 0 2px}
  #printReport h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
  #printReport .prl{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed #ccc}
  #printReport .mut2{color:#555;font-size:11px}
}

<!-- ======================================================================
     CONFIGURACIÓN DE LA APP  ·  edita aquí sin tocar el resto del código
     · CFG.ranges  : qué portal/área ve cada rango de número de empleado
     · CFG.common  : cursos para TODO el personal (Inducción + Seguridad)
     · CFG.areas   : cursos específicos por área (con su quiz de 3 preguntas)
     · CFG.rewards : catálogo de recompensas canjeables con puntos
     · CFG.points  : cuántos puntos otorga cada logro
     · CFG.kb      : biblioteca de respuestas AUTORIZADAS de Bandi (chat cerrado)
     · CFG.clases  : academia "Profe Bandi" (Clases Básicas, niveles 1–10)
     · CFG.api     : IA online opcional (OpenAI) — DORMIDA; el chat usa CFG.kb
     ====================================================================== -->
<script>
window.CFG = {

  /* === BIBLIOTECA DE BANDI (modo offline · sin internet ni tokens) ===========
     Aquí va TODO lo que quieres que Bandi sepa sin conexión.
     Formato de cada tema:  { t:'Título', k:'palabras clave y sinónimos', a:'Respuesta' }
       · t = título corto (también se usa para sugerencias)
       · k = palabras que disparan el tema (sinónimos, singular/plural, con o sin acento)
       · a = lo que responde Bandi
     El buscador elige el tema con más coincidencias. Agrega o edita libremente. ====== */
  kb: [
    { t:'', k:'hola buenas buenos saludos hey que tal holi ola', a:'¡Hola! Soy Bandi 🛞 tu asistente experto en llantas, precurado y renovado. Pregúntame lo que quieras: partes de una llanta, el renovado, camiones, líneas de producto, el negocio o tus cursos.' },
    { t:'', k:'gracias grax thanks genial perfecto excelente', a:'¡Con gusto! Aquí estoy cuando me necesites. 💪' },
    { t:'¿Qué es una llanta?', k:'llanta neumatico que es para que sirve funcion', a:'Una llanta (o neumático) es el componente de hule que envuelve el rin de una rueda y es el único punto de contacto del vehículo con el suelo. Cumple cuatro funciones: soportar el peso/carga del vehículo, transmitir las fuerzas de aceleración y frenado, dar agarre y dirección, y absorber las irregularidades del camino. En el transporte de carga es una de las mayores fuentes de costo operativo.' },
    { t:'Anatomía de la llanta: sus partes', k:'partes anatomia estructura componentes', a:'Una llanta se compone de: banda de rodamiento (tread, la parte con dibujo que toca el suelo), hombro (shoulder), costado (sidewall), carcasa o casing (la estructura interna de lonas/cuerdas), cinturones (belts, refuerzos), talón (bead, el aro que ancla la llanta al rin) y el liner interior (en llantas tubeless). En el renovado, la banda se reemplaza y la carcasa se reutiliza.' },
    { t:'Banda de rodamiento (tread)', k:'banda de rodamiento tread dibujo rodadura caucho de rodamiento', a:'La banda de rodamiento es la capa de hule con dibujo que está en contacto con el camino. Su compuesto y diseño definen el agarre, la tracción, el drenaje de agua, el ruido y el rendimiento kilométrico. Es la parte que se desgasta y la que se reemplaza durante el renovado. La banda de precurado de Hules Banda es exactamente esta pieza, ya vulcanizada y lista para aplicarse.' },
    { t:'Carcasa (casing)', k:'carcasa casing cuerpo lonas estructura esqueleto', a:'La carcasa es el "esqueleto" de la llanta: las capas de cuerdas (textil o acero) que le dan forma y resistencia y contienen la presión. Es la parte más valiosa y duradera: una carcasa en buen estado puede renovarse varias veces. Por eso el renovado evalúa primero la carcasa antes de aplicar una banda nueva.' },
    { t:'Costado (sidewall)', k:'costado sidewall flanco informacion dot', a:'El costado o sidewall es la cara lateral de la llanta, entre el hombro y el talón. Protege la carcasa, aporta flexibilidad y lleva grabada la información: medida, marca, índices de carga y velocidad, y el código DOT con la fecha de fabricación. Grietas o daños severos en el costado pueden descartar una carcasa para renovado.' },
    { t:'Talón (bead)', k:'talon bead aro rin sellado alambre', a:'El talón es el borde reforzado (normalmente con un aro de alambre de acero) que asienta y fija la llanta al rin y asegura el sellado del aire. Debe estar íntegro para que la llanta monte bien y no pierda presión.' },
    { t:'Cinturones (belts)', k:'cinturones belts acero refuerzo estabilidad', a:'Los cinturones son capas de refuerzo (frecuentemente de acero) ubicadas bajo la banda de rodamiento. Estabilizan la zona de contacto, mejoran el rendimiento y protegen la carcasa. En llantas radiales son clave para la durabilidad y la aptitud para renovar.' },
    { t:'Liner interior (tubeless)', k:'liner inner liner tubeless sin camara aire', a:'El liner es una capa de hule poco permeable en el interior de las llantas tubeless (sin cámara) que retiene el aire, sustituyendo a la cámara tradicional. Un liner en buen estado mantiene la presión y protege la carcasa de la humedad.' },
    { t:'Llanta radial vs diagonal (bias)', k:'radial diagonal bias tipos construccion cuerdas', a:'En la llanta radial las cuerdas de la carcasa van en sentido radial (90° respecto a la rodadura) con cinturones encima; ofrece menor calentamiento, mayor rendimiento kilométrico y mejor aptitud para renovar. La diagonal (bias) cruza las cuerdas en diagonal; es más antigua y hoy menos común en carga. El transporte moderno usa mayormente radial.' },
    { t:'Medidas y nomenclatura de la llanta', k:'medida tamaño nomenclatura 295 80 r22.5 indice de carga dot lectura costado', a:'La medida se lee en el costado, por ejemplo 295/80 R22.5: 295 = ancho de sección en mm, 80 = relación de aspecto (alto del costado como % del ancho), R = radial, 22.5 = diámetro del rin en pulgadas. También aparecen los índices de carga y velocidad y el código DOT. Conocer la medida es esencial para elegir la banda y el renovado correctos.' },
    { t:'Presión de inflado', k:'presion inflado psi cuidado desgaste inflar aire libras', a:'La presión correcta es crítica: baja presión genera sobrecalentamiento, desgaste irregular y riesgo de falla; alta presión reduce el contacto y el agarre. Mantener la presión recomendada alarga la vida de la llanta, mejora el rendimiento de combustible y conserva la carcasa apta para renovar.' },
    { t:'Dibujo del tread y su función', k:'dibujo diseño traccion drenaje ruido patron surcos bloques', a:'El diseño del dibujo (patrón de surcos y bloques) define el desempeño: surcos profundos y abiertos dan tracción y evacuan agua/lodo (uso off-road o tracción); patrones cerrados y nervaduras continuas dan kilometraje y bajo ruido (largo recorrido y dirección). Cada línea de banda de Hules Banda tiene un dibujo pensado para una aplicación.' },
    { t:'Profundidad del tread y desgaste', k:'profundidad 32avos desgaste minimo reemplazo testigo', a:'La profundidad del dibujo se mide en 32avos de pulgada y disminuye con el uso. Existen límites mínimos legales y operativos para retirar o renovar la llanta. El desgaste irregular (por presión, alineación o mecánica) acorta la vida y puede señalar un problema a corregir.' },
    { t:'Vida útil y factores de desgaste', k:'vida util duracion desgaste factores mantenimiento', a:'La vida de una llanta depende de la presión, la alineación, la carga, el estilo de manejo, el estado del camino y el mantenimiento. Un buen cuidado no solo alarga la primera vida, sino que conserva la carcasa para una o varias renovaciones, multiplicando el valor de la inversión.' },
    { t:'Llanta de carga vs de pasajeros', k:'comercial carga camion pasajeros auto diferencia autobus', a:'Las llantas comerciales/de carga (camión, autobús) están construidas para soportar grandes pesos y muchos kilómetros, con carcasas robustas pensadas para renovarse varias veces. Las de pasajeros priorizan confort y se renuevan menos. El negocio del renovado y del precurado se centra sobre todo en el transporte de carga y pasajeros.' },
    { t:'El mundo de la llanta: panorama', k:'industria mundo panorama mercado transporte', a:'La llanta es un producto global y estratégico: mueve el transporte de personas y mercancías. La industria abarca fabricantes de llanta nueva, productores de materia prima de hule, y el sector del renovado, que da segundas y terceras vidas a las carcasas. Para una flota, las llantas son uno de los mayores costos después del combustible.' },
    { t:'Llanta nueva vs llanta renovada', k:'nueva renovada reencauche comparacion costo', a:'Una llanta nueva trae carcasa y banda de fábrica. Una llanta renovada reutiliza una carcasa en buen estado y le aplica una banda nueva, a una fracción del costo de una nueva y con desempeño comparable para el uso adecuado. El renovado es una práctica estándar y aprobada en el transporte profesional de carga.' },
    { t:'Ciclo de vida y multivida de la llanta', k:'ciclo de vida multivida reuso economia circular vidas', a:'Una carcasa de calidad puede vivir varias "vidas": primera vida como llanta nueva y luego una o más renovaciones. Aprovechar la multivida reduce drásticamente el costo por kilómetro y el desperdicio. Maximizar las vidas de cada carcasa es el corazón del valor que aporta el renovado.' },
    { t:'Costo por kilómetro (CPK)', k:'costo por kilometro cpk flotas ahorro rentabilidad', a:'El costo por kilómetro mide cuánto cuesta cada kilómetro recorrido por una llanta (precio dividido entre los kilómetros que rinde). El renovado baja el CPK porque extiende la vida de la carcasa a menor costo. Es el indicador que más les importa a las flotas al decidir entre llanta nueva y renovada.' },
    { t:'Impacto ambiental del renovado', k:'impacto ambiental sostenibilidad co2 ahorro ecologico petroleo', a:'Renovar una llanta consume mucho menos materia prima y energía que fabricar una nueva, porque reutiliza la carcasa. Esto ahorra hule, petróleo y agua, y reduce las emisiones de CO2 y la cantidad de llantas de desecho. El renovado es una de las prácticas de economía circular más establecidas de la industria.' },
    { t:'Sostenibilidad y economía circular', k:'economia circular sostenibilidad reuso residuos verde', a:'La economía circular busca extender la vida de los productos y reducir residuos. En llantas, esto se logra reutilizando carcasas mediante el renovado en lugar de desecharlas. Hules Banda participa en esta cadena al producir la banda de precurado que da nuevas vidas a las llantas.' },
    { t:'¿Qué es el renovado (reencauche/retread)?', k:'renovado reencauche retread recauchutado que es', a:'El renovado (también llamado reencauche, recauchutado o retread) es el proceso de aplicar una banda de rodamiento nueva a una carcasa usada en buen estado, devolviéndole vida útil. Es un proceso industrial controlado, no una simple reparación, y permite que una misma carcasa ruede muchos kilómetros más a bajo costo.' },
    { t:'¿Por qué renovar? Beneficios', k:'beneficios por que ahorro ventajas renovar conviene', a:'Renovar conviene porque: cuesta una fracción de una llanta nueva, baja el costo por kilómetro, reduce el impacto ambiental y aprovecha el valor de la carcasa. Para transportistas y flotas es una práctica rentable y responsable, siempre que la carcasa esté en condiciones y el proceso sea de calidad.' },
    { t:'Requisitos de una carcasa para renovar', k:'carcasa requisitos inspeccion apta daños', a:'No toda carcasa se puede renovar: debe estar libre de daños estructurales graves (cortes profundos, separaciones, daños por baja presión o impactos, oxidación de cables). Se inspecciona el estado general, los costados, el interior y los talones. Una carcasa bien cuidada (presión correcta) es la mejor candidata.' },
    { t:'Proceso de renovado paso a paso', k:'proceso pasos como se hace etapas renovado', a:'El renovado suele seguir estas etapas: 1) inspección inicial de la carcasa, 2) raspado/buffing para preparar la superficie, 3) reparación de daños menores, 4) aplicación del cojín de unión y de la banda, 5) vulcanizado/curado para unir banda y carcasa, y 6) inspección final de calidad. El detalle varía entre sistema precurado y de molde.' },
    { t:'Inspección inicial de la carcasa', k:'inspeccion revision ndt carcasa seleccion shearografia', a:'Antes de renovar, se revisa la carcasa por dentro y por fuera para detectar daños, perforaciones, separaciones o desgaste anormal; a veces con equipos especiales (shearografía, alta presión). Solo las carcasas que pasan la inspección continúan al proceso. Este filtro garantiza la seguridad del producto renovado.' },
    { t:'Raspado / buffing', k:'raspado buffing preparacion superficie textura radio', a:'El buffing o raspado retira la banda gastada y deja la superficie de la carcasa con la textura y el radio correctos para recibir la banda nueva. Una buena preparación es clave para que la unión sea fuerte y uniforme.' },
    { t:'Reparación de daños (skiving)', k:'reparacion skiving parches daños carcasa relleno', a:'Los daños menores de la carcasa (pequeñas perforaciones o cortes dentro de límites) se reparan con técnicas como el skiving y la aplicación de parches y hule de relleno antes de aplicar la banda, asegurando que la carcasa quede íntegra.' },
    { t:'Aplicación de la banda y el cojín', k:'aplicacion banda cojin cushion gum union', a:'Sobre la carcasa preparada se coloca una capa de hule de unión llamada cojín (cushion gum) y encima la banda nueva. En el sistema precurado, la banda ya viene vulcanizada con su dibujo; el cojín es el que se vulcaniza para unir banda y carcasa.' },
    { t:'Vulcanizado / curado en cámara', k:'vulcanizado curado autoclave camara calor presion', a:'El conjunto se cura en una cámara (autoclave) con calor y presión durante un tiempo definido; ahí el cojín se vulcaniza y une firmemente la banda a la carcasa. Controlar temperatura, presión y tiempo es esencial para una unión confiable.' },
    { t:'Inspección final y calidad del renovado', k:'inspeccion final calidad control liberacion acabado balanceo', a:'Al terminar, la llanta renovada se inspecciona de nuevo (acabado, unión, balanceo, defectos) antes de liberarse. El control de calidad asegura que el producto cumple especificaciones y es seguro para circular.' },
    { t:'¿Qué es la banda de precurado?', k:'precurado precured banda que es producto', a:'La banda de precurado es una banda de rodamiento que ya viene vulcanizada de fábrica, con su dibujo y compuesto definidos, lista para aplicarse a la carcasa durante el renovado. Es el producto principal de Hules Banda. Al venir ya curada, solo se vulcaniza el cojín de unión, no la banda.' },
    { t:'Precurado vs sistema de molde (mold-cure)', k:'precurado molde mold cure diferencia sistemas frio caliente', a:'Hay dos grandes sistemas de renovado. En el de molde (mold-cure), se aplica hule sin curar y el dibujo se forma y vulcaniza dentro de un molde a alta temperatura. En el precurado (sistema "en frío"), la banda ya viene vulcanizada con su dibujo y solo se cura el cojín a menor temperatura. El precurado es muy usado en carga por su practicidad y variedad de dibujos.' },
    { t:'Ventajas del sistema precurado', k:'ventajas precurado beneficios flexibilidad dibujos', a:'El precurado ofrece gran variedad de dibujos y medidas listos para usar, un proceso de curado a menor temperatura (más cuidadoso con la carcasa), buena consistencia de calidad y flexibilidad para el renovador. Por eso es muy popular en flotas de transporte.' },
    { t:'El cojín de unión (cushion gum)', k:'cojin cushion gum union ligas adhesion', a:'El cojín o cushion gum es la capa de hule sin vulcanizar que se coloca entre la carcasa y la banda de precurado. Al curarse en la cámara, se vulcaniza y crea una unión fuerte y permanente entre ambas. Su calidad y correcta aplicación son clave para que la banda no se despegue.' },
    { t:'¿Qué es el hule?', k:'hule caucho natural sintetico material', a:'El hule (caucho) es un material elástico que puede ser natural (del árbol de hule) o sintético (derivado del petróleo). Es la base de las llantas y de la banda de precurado por su elasticidad, resistencia a la abrasión y capacidad de agarre. Los compuestos de llanta combinan varios tipos de hule y aditivos.' },
    { t:'Hule verde (compuesto sin vulcanizar)', k:'hule verde green rubber compuesto sin vulcanizar materia prima', a:'El hule verde es el compuesto de hule ya mezclado pero AÚN SIN VULCANIZAR; es maleable y todavía no tiene sus propiedades finales. Es materia prima para fabricar productos de hule. Hules Banda produce y vende hule verde (por ejemplo a empresas como Goodyear), además de la banda de precurado.' },
    { t:'Vulcanización', k:'vulcanizacion curado azufre calor propiedades', a:'La vulcanización es el proceso (con calor y agentes como el azufre) que transforma el hule crudo y pegajoso en un material elástico, resistente y estable. Es lo que da a la llanta y a la banda sus propiedades finales. El hule "verde" es el que todavía no ha pasado por este proceso.' },
    { t:'Compuestos de hule y aditivos', k:'compuesto formulacion negro de humo azufre aceleradores receta', a:'Un compuesto de hule es una "receta" que mezcla hules con aditivos: negro de humo (refuerzo y color), azufre y aceleradores (vulcanización), aceites, antioxidantes y otros. La formulación define el rendimiento (kilometraje, tracción, resistencia al calor). El mezclado debe seguir la receta con precisión.' },
    { t:'Propiedades clave del hule para llantas', k:'propiedades resistencia elasticidad abrasion calor', a:'Para una banda de rodamiento importan: resistencia a la abrasión (kilometraje), elasticidad y agarre, resistencia al calor y al corte, y estabilidad. Cada línea de producto ajusta su compuesto para equilibrar estas propiedades según la aplicación.' },
    { t:'Proceso de producción en Hules Banda', k:'proceso fabrica produccion mezclado extruido prensado', a:'Hules Banda fabrica la banda de precurado con un proceso controlado de mezclado, extruido y prensado, con rigurosa selección de materia prima y control de calidad. El objetivo es garantizar una banda con el mejor rendimiento kilométrico y consistencia. (Descripción general; los parámetros exactos los define la empresa.)' },
    { t:'Mezclado (mixing)', k:'mezclado mixing compuesto receta', a:'En el mezclado se combinan los hules y aditivos según la receta aprobada para formar el compuesto (hule verde). Se controlan tiempos, temperatura y orden de carga. Una mezcla fuera de especificación afecta el rendimiento de toda la banda, por eso es un punto crítico de calidad.' },
    { t:'Extruido', k:'extruido extrusion forma perfil banda dado', a:'En el extruido, el compuesto se hace pasar por un dado para darle el perfil/forma de la banda. Se cuidan la temperatura y la velocidad para lograr medidas correctas y evitar defectos como burbujas o variaciones de espesor.' },
    { t:'Prensado / curado de la banda', k:'prensado curado vulcanizado molde dibujo', a:'En el prensado, la banda se vulcaniza y adquiere su dibujo definitivo bajo calor y presión, quedando como banda de precurado lista para el renovado. El control de temperatura, presión y tiempo asegura la calidad y el dibujo correcto.' },
    { t:'Control de calidad en la fábrica', k:'calidad control inspeccion especificaciones no conformidad', a:'El control de calidad verifica que cada banda cumpla las especificaciones (medidas, dibujo, compuesto, acabado) en las distintas etapas. Los productos que no cumplen se separan como no conformidad y se analizan para corregir la causa raíz.' },
    { t:'Materia prima y su selección', k:'materia prima seleccion hule insumos calidad', a:'La calidad de la banda empieza por la materia prima. Hules Banda hace una rigurosa selección de insumos para garantizar el rendimiento kilométrico. Insumos consistentes permiten compuestos consistentes y, por lo tanto, un producto confiable.' },
    { t:'Línea SAP', k:'linea sap sap banda producto dibujo aplicacion', a:'Línea SAP: banda enfocada en el mejor rendimiento kilométrico por milímetro. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea UM', k:'linea um um banda producto dibujo aplicacion urbano', a:'Línea UM: diseñada para transporte urbano de pasajeros y camiones. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea ZY2M', k:'linea zy2m zy2m bl banda producto dibujo todo terreno', a:'Línea ZY2M: banda todo terreno a toda prueba; (la familia BL/ZY2M busca menos peso y más eficiencia operacional). (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea BMB', k:'linea bmb bmb banda producto dibujo traccion', a:'Línea BMB: pensada para la verdadera tracción a toda carga. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea AT', k:'linea at at banda producto dibujo all terrain', a:'Línea AT: exitoso diseño all-terrain de alto desempeño. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea SAW', k:'linea saw saw banda producto dibujo arrastre parqueo', a:'Línea SAW: banda con aletas y un compuesto para resistir el arrastre del parqueo. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea DT', k:'linea dt dt banda producto dibujo regional urbano', a:'Línea DT: diseño para las nuevas exigencias regionales y urbanas. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Línea MLZ', k:'linea mlz mlz banda producto dibujo off road', a:'Línea MLZ: diseño ganador off-road para terrenos exigentes. (Información del catálogo de Hules Banda; confirma medidas y especificaciones técnicas exactas con la empresa.)' },
    { t:'Líneas SAM, SA, SA1 y SA15', k:'sam sa sa1 sa15 single posicion 18/32 15/32', a:'Familia de bandas por posición/aplicación: SAM es multipropósito de posición y aplicación (18/32); SA usa tecnología que disminuye la oposición lateral (18/32); SA1 ofrece menos peso con la misma eficiencia (18/32); SA15 da precisión sin oposición sin limitar la eficiencia (15/32). (Catálogo HB; confirmar especificaciones con la empresa.)' },
    { t:'Cómo elegir la banda correcta', k:'elegir seleccion recomendacion aplicacion eje cliente recomendar', a:'Para recomendar una banda se considera el uso del vehículo (largo recorrido, regional, urbano, mixto, fuera de carretera, industrial) y la posición del eje (dirección/libre, tracción, toda posición, single). Se elige la línea cuyo dibujo y compuesto se ajusten a esa necesidad. Ante la duda, preguntar al cliente cómo y dónde opera.' },
    { t:'Tipos de aplicación', k:'aplicacion largo recorrido regional urbano mixto fuera de carretera industrial', a:'Las bandas se clasifican por aplicación: largo recorrido (carretera, máximo kilometraje), regional (rutas mixtas/medias), urbano (arranques/frenadas, ciudad), mixto (on/off road), fuera de carretera (obra, minería) e industrial. Cada aplicación exige un dibujo y compuesto distintos.' },
    { t:'Tipo de eje', k:'eje direccion libre traccion toda posicion single tire posicion steer drive', a:'La posición del eje define la banda ideal: eje de dirección/libre (nervaduras para rodar y dirigir), eje de tracción (bloques para agarre y empuje), toda posición (versátil) y single tire (llanta ancha que sustituye a un par). Elegir según el eje optimiza desgaste y desempeño.' },
    { t:'¿Quién es Hules Banda?', k:'hules banda empresa quien es fabrica mision lema paises', a:'Hules Banda (HB plus Bandamatic) es una fábrica de hule especializada en productos para el renovado de llantas. Produce banda de precurado de alto desempeño y hule verde. Tiene presencia en más de 50 países y su lema es "Tecnología que rueda por el mundo".' },
    { t:'Bandamatic (empresa hermana)', k:'bandamatic comercializa hermana ventas distribucion', a:'Bandamatic es la empresa hermana que compra la banda de precurado de Hules Banda y la comercializa. Forma parte del mismo grupo y es el brazo comercial que lleva el producto al mercado. (En el futuro tendrá su propia app de ventas.)' },
    { t:'Clientes y mercado', k:'clientes goodyear mercado 50 paises exportacion', a:'Hules Banda vende a empresas grandes del sector, como Goodyear, que compran tanto hule verde como banda de precurado, además de a renovadores y distribuidores. Exporta a más de 50 países en América, Europa y el Caribe.' },
    { t:'Qué vende Hules Banda', k:'productos que vende precurado hule verde oferta asesoria', a:'Hules Banda ofrece principalmente dos productos: 1) banda de precurado (en varias líneas según aplicación) para el renovado de llantas, y 2) hule verde (compuesto sin vulcanizar) como materia prima. También brinda asesoría para desarrollar productos a la medida del cliente.' },
    { t:'Seguridad: uso de EPP', k:'epp seguridad proteccion guantes casco lentes botas', a:'El Equipo de Protección Personal (EPP) —casco, lentes, guantes, botas según la zona— debe usarse siempre en el área de producción. Si una pieza está dañada, se reporta y reemplaza antes de continuar. El EPP protege la integridad física del trabajador.' },
    { t:'Seguridad en la zona de prensado', k:'seguridad prensa prensado manos seguros', a:'En la zona de prensado, mantén las manos fuera del área de cierre, verifica que los seguros estén activos antes de operar y detén el equipo ante cualquier ruido o comportamiento anormal, reportándolo de inmediato.' },
    { t:'Manejo seguro de químicos y compuestos', k:'quimicos seguridad hojas de datos manejo almacenamiento', a:'Los químicos y aditivos del compuesto se manejan según sus hojas de datos de seguridad: con el EPP indicado, buena ventilación, almacenamiento correcto y sin mezclar productos. Ante dudas o derrames, seguir el procedimiento y avisar al supervisor.' },
    { t:'Costos de operación y rendimiento', k:'costos operacion rendimiento kilometrico ahorro flota', a:'Para un transportista, las llantas son un costo mayor. El renovado con banda de precurado de buen rendimiento kilométrico baja ese costo al extender la vida de la carcasa. Por eso el desempeño "por milímetro" y la durabilidad son argumentos de venta clave.' },
    { t:'Por qué el renovado conviene a los transportistas', k:'renovado conviene transportistas roi beneficio flota', a:'El renovado conviene porque entrega un desempeño comparable al de una llanta nueva para el uso adecuado, a una fracción del costo, reduce el costo por kilómetro y es más sostenible. Una flota que gestiona bien sus carcasas y renueva con calidad ahorra de forma significativa.' },
    { t:'Tabulador 7 y 8', k:'tabulador siete ocho 7 8 maquina como usar operar', a:'El Tabulador 7 y 8 son máquinas de la planta. Para usarlos: revisa que estén limpios y con los seguros puestos, ponte tu EPP y sigue el manual oficial paso a paso. Si tienes dudas, pregunta a tu supervisor. (El procedimiento detallado está en la capacitación de Maquinaria.)' },
    { t:'Mezclador Banbury', k:'banbury banburi mezclador mezcla compuesto hule maquina', a:'El Banbury es el mezclador donde se combina el hule con los aditivos para formar el compuesto. Regla de oro: mantén manos y ropa lejos de las partes móviles, usa tu EPP y revisa los seguros antes de operar.' }
  ],

<script>
/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bandi(cls){ return '<span class="bandi '+(cls||'')+'"><svg class="bv"><use href="#bandi"/></svg></span>'; }
function flash(t){ var f=$('flash'); f.textContent=t; f.classList.add('show'); clearTimeout(f._t); f._t=setTimeout(function(){f.classList.remove('show');},2100); }

/* ---------- estado en memoria (progreso del usuario se guarda en el dispositivo) ---------- */
var S = null;          // sesión actual
var cur = {};          // pantalla de curso/quiz en curso
var HBKEY = '';        // API key opcional para IA real

function rangeOf(n){ for(var i=0;i<CFG.ranges.length;i++){ var r=CFG.ranges[i]; if(n>=r.min && n<=r.max) return r; } return null; }
function level(){ return Math.floor(S.points/CFG.points.perLevel)+1; }
function levelName(){ return CFG.levels[Math.min(level()-1,CFG.levels.length-1)]; }
function myCourses(){ return CFG.common.concat(CFG.areas[S.key]||[]); }
function statusOf(id){ return S.done[id]; }
function doneCount(){ var c=myCourses(),n=0; for(var i=0;i<c.length;i++) if(S.done[c[i].id]) n++; return n; }

/* ---------- persistencia (localStorage; si no está disponible, queda en memoria) ---------- */
function save(){ try{ localStorage.setItem('hb_'+S.emp, JSON.stringify({points:S.points,streak:S.streak,done:S.done,attempts:S.attempts,best:S.best,redeemed:S.redeemed,role:S.role,clases:S.clases,accessible:S.accessible,rate:S.rate})); }catch(e){} }
function load(emp){ try{ var d=localStorage.getItem('hb_'+emp); return d?JSON.parse(d):null; }catch(e){ return null; } }

/* ====================== LOGIN ====================== */
function buildLoginHelp(){
  var demos=[['007','Almacén'],['034','Inventario'],['070','Producción'],['100','Calidad'],['120','Comercial'],['140','Maquinaria'],['901','RRHH']];
  var row=$('tryRow'); var h='<b>Probar como…</b>';
  demos.forEach(function(d){ h+='<button class="tryc" onclick="quickLogin(\''+d[0]+'\')">'+d[1]+' <i>'+d[0]+'</i></button>'; });
  row.innerHTML=h;
  var rh=CFG.ranges.map(function(r){ var a=(''+r.min).padStart(3,'0'), b=(''+r.max).padStart(3,'0'); return '<b>'+r.area+'</b> '+a+'–'+b; }).join(' · ');
  $('loginHint').innerHTML='Rangos de número de empleado:<br>'+rh+'<br><br>📲 Tip: en tu celular usa <b>Compartir → “Agregar a pantalla de inicio”</b> para instalar la app. Funciona sin internet.';
}
function quickLogin(id){ $('inEmp').value=id; login(); }
function login(){
  var raw=($('inEmp').value||'').trim(); var n=parseInt(raw,10);
  if(!raw || isNaN(n)){ flash('Escribe tu número de empleado'); return; }
  var r=rangeOf(n);
  if(!r){ flash('Ese número no tiene portal asignado'); return; }
  // construir sesión + cargar progreso guardado
  var saved=load(n)||{};
  S={ emp:n, key:r.key, area:r.area, icon:r.icon, accent:r.accent, accent2:r.accent2, admin:!!r.admin, greet:r.greet,
      points:saved.points||0, streak:saved.streak||0, done:saved.done||{}, attempts:saved.attempts||{}, best:saved.best||{},
      redeemed:saved.redeemed||{}, role:(saved.role||(r.admin?'admin_demo':(r.key==='almacen'?'almacen':CFG.defaultRole))), clases:(saved.clases||{}), accessible:!!saved.accessible, rate:saved.rate||0.78, chat:[] };
  // aplicar color de acento del área
  document.documentElement.style.setProperty('--accent', r.accent);
  document.documentElement.style.setProperty('--accent2', r.accent2);
  document.querySelector('meta[name=theme-color]').setAttribute('content', r.accent);
  $('s-login').classList.add('hide');
  $('topbar').classList.remove('hide'); $('main').classList.remove('hide'); $('nav').classList.remove('hide');
  buildNav(); renderTop();
  // saludo de bienvenida en el chat
  S.chat.push({role:'assistant',content:'¡Hola! Soy Bandi 🛞 tu asistente. Pregúntame sobre seguridad, procesos, producto o tus puntos. '+(S.admin?'':'¡Vamos por esos cursos!')});
  if(S.admin) renderHR(); else renderHome();
}
function logout(){ location.reload(); }
function resetProgress(){
  if(!confirm('¿Reiniciar tu progreso (puntos, cursos y canjes)? No se puede deshacer.')) return;
  try{ localStorage.removeItem('hb_'+S.emp); }catch(e){}
  S.points=0; S.streak=0; S.done={}; S.attempts={}; S.best={}; S.redeemed={};
  flash('Progreso reiniciado'); renderHome();
}

function submitQuiz(){
  var c=cur.course, qs=c.q;
  if(!qs.every(function(_,i){ return cur.answers[i]!=null; })){ flash('Responde las 3 preguntas'); return; }
  var score=0; qs.forEach(function(q,i){ if(cur.answers[i]===q.c) score++; });
  var pass=score>=2, id=c.id;
  var attemptsBefore=S.attempts[id]||0, firstTry=attemptsBefore===0, already=!!S.done[id];
  S.attempts[id]=attemptsBefore+1;
  var earned={base:0,perfect:0,first:0,ontime:0,streak:0,total:0};
  var leveledFrom=level();
  if(pass){
    if(!already){
      earned.base = cur.exempt?CFG.points.exemptBase:CFG.points.base;
      if(score===qs.length) earned.perfect=CFG.points.perfect;
      if(firstTry) earned.first=CFG.points.firstTry;
      earned.ontime=CFG.points.onTime;
      if(firstTry){ S.streak++; earned.streak=S.streak*CFG.points.streakStep; }
      earned.total=earned.base+earned.perfect+earned.first+earned.ontime+earned.streak;
      S.points+=earned.total;
      S.done[id]=cur.exempt?'exempt':'done';
    }
  } else { S.streak=0; }
  S.best[id]=Math.max(S.best[id]||0,score);
  save(); renderTop();
  cur.score=score; cur.pass=pass; cur.earned=earned; cur.already=already;
  showResult();
  if(pass && !already){ burst(); if(level()>leveledFrom) setTimeout(function(){flash('🎉 ¡Subiste a Nivel '+level()+' · '+levelName()+'!');},700); }
}

/* ===== ROLES Y GUARDRAILS DE BANDI (aplican ONLINE y OFFLINE) =====

function curRole(){ return (S && CFG.roles[S.role]) || CFG.roles[CFG.defaultRole]; }

  S.role=next; save(); flash('Perfil demo: '+CFG.roles[next].label); renderChat();

function guard(text){
  var t=_norm(text), r=curRole();
  var SENS=['salario','sueldo','nomina','cuanto gana','cuanto ganan','cuanto cobran','margen','utilidad','utilidades','ganancia','ganancias','rentabilidad','dividendo','accionista','dueno','propietario','director general','directiva','ejecutiv','gerente general','estrategia de la empresa','plan estrategico','estados financieros','finanzas de la empresa','presupuesto de la empresa','facturacion','cuanto factura','cuanto vende la empresa','ventas de la empresa','ingresos de la empresa','contrato confidencial','informacion confidencial','reporte de direccion','reportes de direccion','cuanto cuesta producir','costo de produccion','precio interno','demanda legal','juicio'];
  if(!r.sensitive){ for(var i=0;i<SENS.length;i++){ if(t.indexOf(SENS[i])>-1) return 'Esa información es confidencial de la empresa 🔒. Mi función es ayudarte con capacitación, seguridad, procesos de planta, llantas, hule y aprendizaje básico. ¿Te ayudo con alguno de esos?'; } }
  var INV=['cuanto stock','cuantas hay','cuantos hay','cuanto hay','existencia','stock de','stock actual','cuantas llantas hay','cuantas bandas hay','cuantas piezas','cuanto material hay','cuanto inventario hay','niveles de stock','disponibilidad de','sku','faltante actual','cantidades exactas','cuanto producto hay'];
  if(!r.inventoryData){ for(var k=0;k<INV.length;k++){ if(t.indexOf(INV[k])>-1) return 'Los datos exactos de inventario son solo para el área de almacén o personal autorizado 📦. Pero sí puedo explicarte cómo reportar material faltante o cómo funciona el inventario de forma básica.'; } }

  for(var j=0;j<OFF.length;j++){ if(t.indexOf(OFF[j])>-1) return 'Soy el asistente de Hules Banda 🛞 y solo te ayudo con llantas, hule, renovado, procesos de fábrica, seguridad, calidad, mantenimiento, materiales y clases básicas. ¿Empezamos con alguno de esos temas?'; }

/* ===== Buscador de la BIBLIOTECA offline (CFG.kb) =====
   Ignora acentos, mayúsculas, plurales y palabras vacías, y elige el tema
   con más coincidencias de palabras. Si nada encaja, sugiere temas. */
function _norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' '); }
var KB_STOP={de:1,la:1,el:1,los:1,las:1,un:1,una:1,unos:1,unas:1,que:1,en:1,por:1,con:1,para:1,del:1,al:1,lo:1,le:1,les:1,se:1,su:1,sus:1,mi:1,tu:1,es:1,son:1,esta:1,este:1,como:1,cual:1,cuales:1,sobre:1,mas:1,muy:1,me:1,te:1,nos:1,hay:1,si:1,no:1,pero:1,porque:1,cuando:1,donde:1,quien:1,cuanto:1,cuanta:1,dime:1,quiero:1,saber:1,puedes:1,decir:1,explica:1,explicame:1,sirve:1}
function kb(t){
  var g=guard(t); if(g) return g;
  var raw=_norm(t).split(/\s+/).filter(function(w){ return w.length>=3 && !KB_STOP[w]; });
  var q=raw.map(function(w){ return w.length>4 ? w.replace(/(es|s)$/,'') : w; });
  var lib=CFG.kb||[], best=null, bs=0;
  for(var i=0;i<lib.length;i++){
    var e=lib[i], K=' '+_norm(e.k)+' ', T=' '+_norm(e.t)+' ', A=' '+_norm(e.a)+' ', s=0;
    for(var j=0;j<q.length;j++){ var w=q[j], inK=K.indexOf(w)>-1, inT=T.indexOf(w)>-1;
      if(inK) s+=3; if(inT) s+=2; if(!inK&&!inT&&A.indexOf(w)>-1) s+=1;
    }
    if(s>bs){ bs=s; best=e; }
  }
  if(best && bs>=3) return best.a;
  var temas=lib.filter(function(e){return e.t;}).slice(0,8).map(function(e){return e.t;});
  return 'Eso todavía no lo tengo guardado en mi biblioteca offline 🤔. Puedo ayudarte con: '+temas.join(' · ')+'.\n\nPregúntame de otra forma, o conéctate (🔑) para una respuesta más completa. Recuerda: solo temas de llantas, hule, fábrica y clases básicas.';
}
/* ===== RESPUESTAS CERRADAS + REGISTRO DE PREGUNTAS =====
   Bandi solo responde desde la biblioteca AUTORIZADA (CFG.kb). Cada pregunta
   se registra: las que SÍ tienen respuesta suman a "frecuentes"; las que NO,
   se guardan como "sin responder" para que RRHH/dirección las revise, formule
   una respuesta y la agregue (alimentación semanal). En el demo va a
   localStorage; en producción esto iría a una base de datos central. */
function kbFind(t){
  var raw=_norm(t).split(/\s+/).filter(function(w){ return w.length>=3 && !KB_STOP[w]; });
  var q=raw.map(function(w){ return w.length>4 ? w.replace(/(es|s)$/,'') : w; });
  var lib=CFG.kb||[], best=null, bs=0;
  for(var i=0;i<lib.length;i++){
    var e=lib[i], K=' '+_norm(e.k)+' ', T=' '+_norm(e.t)+' ', A=' '+_norm(e.a)+' ', s=0;
    // puntaje aditivo: si la palabra está en el TÍTULO además de las keywords, el tema dedicado gana (p.ej. "Banbury" le gana a "Mezclado")
    for(var j=0;j<q.length;j++){ var w=q[j], inK=K.indexOf(w)>-1, inT=T.indexOf(w)>-1; if(inK) s+=3; if(inT) s+=2; if(!inK&&!inT&&A.indexOf(w)>-1) s+=1; }
    if(s>bs){ bs=s; best=e; }
  }
  if(best && bs>=3) return { hit:true, topic:(best.t||'General'), answer:best.a };
  return { hit:false, topic:null, answer:null };
}
function kbTopics(){ return (CFG.kb||[]).filter(function(e){return e.t;}).map(function(e){return e.t;}); }
function qstats(){ try{ return JSON.parse(localStorage.getItem('hb_qstats')||'null')||{freq:{},unans:{}}; }catch(e){ return {freq:{},unans:{}}; } }
function logQ(topic,text,hit){
  try{ var s=qstats();
    if(hit && topic){ s.freq[topic]=(s.freq[topic]||0)+1; }
    if(!hit){ var k=(text||'').trim().toLowerCase().slice(0,90); if(!k) return; s.unans[k]={ q:(text||'').trim(), n:(s.unans[k]?s.unans[k].n:0)+1, t:Date.now() }; }
    localStorage.setItem('hb_qstats', JSON.stringify(s));
  }catch(e){}
}
/* (Compatibilidad · modo online DORMIDO) arma el historial para la API por si se reactiva
   (el primer mensaje de Bandi es un saludo 'assistant', así que lo recortamos). */
function apiMessages(){
  var h=S.chat.map(function(m){return {role:m.role,content:m.content};});
  while(h.length && h[0].role!=='user') h.shift();
  return h;
}
function sendChat(){
  var inp=$('chatIn'); var t=(inp.value||'').trim(); if(!t||chatBusy) return;
  S.chat.push({role:'user',content:t}); inp.value=''; chatBusy=true; paintChat();
  // GUARDRAIL (online y offline): bloquea info sensible / inventario sin permiso / fuera de tema
  var blk=guard(t);
  if(blk){ setTimeout(function(){ chatBusy=false; S.chat.push({role:'assistant',content:blk}); paintChat(); }, 350); return; }
  // RESPUESTAS CERRADAS: solo desde la biblioteca autorizada. Registra frecuencia y no-respondidas.
  setTimeout(function(){
    chatBusy=false;
    var res=kbFind(t);
    if(res.hit){ logQ(res.topic,t,true); S.chat.push({role:'assistant',content:res.answer}); }
    else {
      logQ(null,t,false);
      S.chat.push({role:'assistant',content:'Todavía no tengo una respuesta autorizada para eso 🤔. Ya la registré para que el equipo la revise y la agregue pronto.\n\nMientras, sí te puedo ayudar con: '+kbTopics().slice(0,6).join(' · ')+'.'});
    }
    paintChat();
  }, 420);
}

var HBVOICES=[];
function loadVoices(){ try{ if('speechSynthesis' in window){ var v=speechSynthesis.getVoices(); if(v&&v.length) HBVOICES=v; } }catch(e){} }
function pickVoice(lang){
  var vs=HBVOICES.length?HBVOICES:[]; if(!vs.length){ loadVoices(); vs=HBVOICES; }
  if(!vs.length) return null;
  var nrm=function(v){ return (v.lang||'').toLowerCase().replace('_','-'); };
  // calidad: prefiere voces "Enhanced / Premium / Natural" si el dispositivo las tiene descargadas
  var qual=function(v){ var n=(v.name||''), s=0;
    if(/enhanced|mejorad|premium|neural|natural|siri/i.test(n)) s+=2;
    if(/paulina|juan|google|microsoft|sabina|luciana|monica|angelica/i.test(n)) s+=1;
    return s; };
  var best=function(list){ var b=list[0]; for(var x=1;x<list.length;x++) if(qual(list[x])>qual(b)) b=list[x]; return b; };
  if(lang && lang.toLowerCase().indexOf('en')===0){
    var en=vs.filter(function(v){ return /^en-us/.test(nrm(v)); }); if(!en.length) en=vs.filter(function(v){ return /^en/.test(nrm(v)); });
    return en.length?best(en):null;
  }
  var pref=['es-mx','es-419','es-us','es-co','es-es','es'];
  for(var i=0;i<pref.length;i++){ var m=vs.filter(function(v){ return nrm(v).indexOf(pref[i])===0; }); if(m.length) return best(m); }
  return null;
}
try{ if('speechSynthesis' in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; } }catch(e){}
function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var clean=String(text||'').replace(/[\u{1F000}-\u{1FAFF}←-⇿⌀-➿⬀-⯿️]/gu,' ');
    if(!clean) return;
    var u=new SpeechSynthesisUtterance(clean.replace(/\s+/g,' ').trim());
    var v=pickVoice(lang); if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=lang||'es-MX'; }
    u.rate=(window.S&&S.rate)||0.78; u.pitch=1.0; u.volume=1;   // velocidad ajustable desde Profe Bandi
    setTimeout(function(){ try{ window.speechSynthesis.speak(u); }catch(e){} }, 80);
  }catch(e){}
}

  h+='<button class="bigbtn" onclick="'+(last?'finishCl()':'nextCl()')+'">'+(last?'Terminar nivel ✓':'Siguiente →')+'</button>';
  paintClases(h);
  if(S&&S.accessible) speak(ok?'¡Muy bien!':('La respuesta correcta es '+q.o[q.a]));
}
function nextCl(){ clState.qi++; renderClQuiz(); }
function finishCl(){
  var tp=clState.topic, lv=clState.level, key=tp.id+':'+lv.n;
  if(!S.clases) S.clases={};
  var first=!S.clases[key]; S.clases[key]=true;
  var pts=Math.round((CFG.clasesTiers[tp.tier]||100)/10);
  if(first){ S.points+=pts; } save(); renderTop();
  var h='<div class="result"><span class="bandi cheer b-xl"><svg class="bv"><use href="#bandi"/></svg></span><div class="emo">🎉</div><h2>¡Nivel '+lv.n+' completado!</h2>';
  h+='<p class="ms">'+(first?('Ganaste +'+pts+' puntos. '):'Repaso hecho. ')+'¡Cada avance cuenta! Sigue así. 💪</p>';
  h+='<div style="max-width:320px;margin:0 auto">'+'<button class="bigbtn" data-s="'+escA('¡Felicidades! Completaste el nivel '+lv.n+'. '+(first?('Ganaste '+pts+' puntos. '):'')+'Cada avance cuenta.')+'" onclick="speak(this.getAttribute(\'data-s\'))">🔊 Escuchar</button>';
  h+='<button class="bigbtn" onclick="openTopic(\''+tp.id+'\')">Seguir aprendiendo →</button>';
  h+='<button class="bigbtn ghost" onclick="renderClases()">Otras materias</button></div></div>';
  paintClases(h); burst();
}

/* ====================== CONFETTI ====================== */
function burst(){
  var c=document.createElement('div'); c.className='confetti';
  var cols=[getCss('--accent'),getCss('--accent2'),'#27c267','#ffd76a','#5aa8ff','#fff'];
  for(var i=0;i<26;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%';
    p.style.background=cols[i%cols.length];
    p.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    p.style.transform='rotate('+(Math.random()*360)+'deg)';
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(function(){ c.remove(); },3400);
}
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#fff'; }
